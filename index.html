<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엔코스 대나무숲</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!--
        디자인 테마: Red & White
        - brand : 서비스 기본 색(루비 레드). 버튼/내비게이션/링크/포커스 링에 사용.
        - slate : 기본 중립색. 차가운 회색 대신 붉은기가 살짝 도는 웜 그레이로 재정의했다.
                  (마크업 전체가 slate-* 를 쓰고 있어, 여기서 한 번만 덮어쓰면 전체가 따뜻해진다.)
        - red / amber / green : 위험 · 주의 · 정상 상태를 나타내는 의미 색.
          brand 와 red 는 같은 계열이므로, 위험 상태는 '진하게 채운' 배지로 구분한다.
    -->
    <script>
        // CDN 로드가 실패해도 이 스크립트가 통째로 죽지 않도록 방어한다.
        window.tailwind = window.tailwind || {};
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#fff5f5',
                            100: '#ffe3e3',
                            200: '#ffc9c9',
                            300: '#ffa8a8',
                            400: '#ff6b6b',
                            500: '#f03e3e',
                            600: '#d92b2b',
                            700: '#b81f1f',
                            800: '#961b1b',
                            900: '#7a1a1a',
                            950: '#450a0a'
                        },
                        slate: {
                            50:  '#faf7f7',
                            100: '#f3eeee',
                            200: '#e7e0e0',
                            300: '#d3c9c9',
                            400: '#a79c9c',
                            500: '#7c7373',
                            600: '#5e5757',
                            700: '#4a4444',
                            800: '#322e2e',
                            900: '#211e1e',
                            950: '#131111'
                        }
                    },
                    boxShadow: {
                        card: '0 1px 2px rgba(33, 30, 30, 0.04), 0 8px 24px -12px rgba(150, 27, 27, 0.12)',
                        brand: '0 10px 24px -12px rgba(217, 43, 43, 0.55)'
                    }
                }
            }
        };
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, updateDoc, doc, setDoc, getDoc, getDocs, serverTimestamp, query, orderBy, where, limit, increment, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-functions.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDm0qnGzq8P3zBBqW_4qjlMd9aq-QKrDyU",
            authDomain: "hr-manager-6635c.firebaseapp.com",
            projectId: "hr-manager-6635c",
            storageBucket: "hr-manager-6635c.firebasestorage.app",
            messagingSenderId: "796639392690",
            appId: "1:796639392690:web:6e88b74eab16b69118aaab",
            measurementId: "G-GMXXY9EPXM"
        };

        try {
            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            window.auth = getAuth(app);
            window.firestore = { collection, onSnapshot, addDoc, deleteDoc, updateDoc, doc, setDoc, getDoc, getDocs, serverTimestamp, query, orderBy, where, limit, increment, arrayUnion, arrayRemove };
            window.firebaseAuth = { signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword, signOut };
            // 게시판 삭제는 규칙만으로 작성자를 판정할 수 없어(해시 계산 불가) 함수를 거친다.
            const fns = getFunctions(app, 'asia-northeast3');
            window.callFn = (name, payload) => httpsCallable(fns, name)(payload);
        } catch (e) { console.error("Firebase Init Error:", e); }
    </script>

    <style>
        /* ── 디자인 토큰 (Red & White) ───────────────────────────────── */
        :root {
            --brand-50:  #fff5f5;
            --brand-100: #ffe3e3;
            --brand-200: #ffc9c9;
            --brand-500: #f03e3e;
            --brand-600: #d92b2b;
            --brand-700: #b81f1f;
            --ink:       #211e1e;
            --ink-soft:  #7c7373;
            --line:      #e7e0e0;
            --surface:   #ffffff;
            --canvas:    #fbf8f8;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            color: var(--ink);
            /* 흰 바탕 위로 아주 옅은 레드 글로우를 깔아 화면 전체 톤을 잡는다. */
            background-color: var(--canvas);
            background-image:
                radial-gradient(900px 420px at 100% -8%, rgba(217, 43, 43, 0.07), transparent 60%),
                radial-gradient(720px 360px at -10% 0%, rgba(217, 43, 43, 0.045), transparent 62%);
            background-attachment: fixed;
        }

        ::selection { background: var(--brand-200); color: var(--brand-700); }

        /* ── 배경: 대나무 줄기 ───────────────────────────────────────
           이름값을 화면에서도 하게 만든다. 다만 익명으로 어려운 이야기를
           꺼내는 곳이라, 눈에 띄면 안 된다. 세로 줄기를 거의 보이지 않을
           만큼만 깔고, 그 위로 빛이 아주 느리게 흐르게 한다. */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                repeating-linear-gradient(90deg,
                    transparent 0 86px,
                    rgba(96, 82, 82, 0.030) 86px 88px,
                    rgba(96, 82, 82, 0.014) 88px 92px,
                    transparent 92px 168px),
                repeating-linear-gradient(90deg,
                    transparent 0 213px,
                    rgba(96, 82, 82, 0.020) 213px 216px,
                    transparent 216px 431px);
        }
        body::after {
            content: '';
            position: fixed;
            inset: -20%;
            z-index: -1;
            pointer-events: none;
            background-image:
                radial-gradient(38% 42% at 22% 18%, rgba(217, 43, 43, 0.055), transparent 70%),
                radial-gradient(34% 38% at 82% 72%, rgba(217, 43, 43, 0.040), transparent 70%);
            animation: drift 34s ease-in-out infinite alternate;
        }
        @keyframes drift {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(2.5%, -2%, 0) scale(1.08); }
        }

        /* ── 게시판 카드 ─────────────────────────────────────────────
           말머리마다 색을 다르게 주되, 채도는 낮춘다. 레드는 브랜드색이자
           위험색이라 '칭찬' 하나에만 쓴다. */
        .cat-free       { --cat: #6b7a8f; --cat-bg: #eef1f5; }
        .cat-suggestion { --cat: #a86a1f; --cat-bg: #fbf2e4; }
        .cat-praise     { --cat: #c0392b; --cat-bg: #fdeceb; }
        .cat-question   { --cat: #5b5ba8; --cat-bg: #eeeef8; }

        .post-card {
            position: relative;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            transition: transform .2s cubic-bezier(.2,.7,.3,1),
                        box-shadow .2s ease,
                        border-color .2s ease;
        }
        /* 좌측 레일이 말머리 색을 들고 있다가, 올려두면 넓어진다. */
        .post-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--cat, var(--brand-600));
            opacity: .55;
            transition: width .2s cubic-bezier(.2,.7,.3,1), opacity .2s ease;
        }
        .post-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px -12px rgba(60, 40, 40, .28);
            border-color: color-mix(in srgb, var(--cat, var(--brand-600)) 32%, var(--line));
        }
        .post-card:hover::before { width: 5px; opacity: 1; }
        .post-card:active { transform: translateY(0); }

        .cat-chip {
            color: var(--cat);
            background: var(--cat-bg);
            border: 1px solid color-mix(in srgb, var(--cat) 18%, transparent);
        }

        /* 익명 표식. 글마다 다른 authorTag 에서 색을 뽑으므로, 같은 사람이
           써도 글끼리 색이 달라진다. 익명성 설계를 그대로 시각화한 것이다. */
        .anon-badge {
            width: 30px; height: 30px;
            border-radius: 10px;
            display: grid; place-items: center;
            flex-shrink: 0;
            color: #fff;
            background: linear-gradient(140deg,
                hsl(var(--h) 42% 58%),
                hsl(calc(var(--h) + 28) 38% 46%));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
        }

        /* 카드가 차례로 올라온다. 한꺼번에 나타나면 목록이 '툭' 하고 바뀐다. */
        .post-enter { animation: postIn .34s cubic-bezier(.2,.7,.3,1) backwards; }
        @keyframes postIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 공감을 누르면 살짝 튄다. */
        .pop { animation: pop .34s cubic-bezier(.2,.7,.3,1); }
        @keyframes pop {
            0%   { transform: scale(1); }
            35%  { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        /* 빈 게시판에서 잎이 아주 천천히 흔들린다. */
        .sway { animation: sway 5.5s ease-in-out infinite; transform-origin: 50% 90%; }
        @keyframes sway {
            0%, 100% { transform: rotate(-5deg); }
            50%      { transform: rotate(5deg); }
        }

        .lift { transition: transform .18s ease, box-shadow .18s ease; }
        .lift:hover { transform: translateY(-1px); }
        .lift:active { transform: translateY(0); }

        /* ── 게시판 머리말 ───────────────────────────────────────────
           흰 카드가 흰 배경 위에 있어 경계가 흐렸다. 옅은 브랜드
           그라데이션과 천천히 떠다니는 잎으로 '숲'의 인상을 준다. */
        .board-hero {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            background:
                radial-gradient(120% 140% at 88% -12%, rgba(217, 43, 43, 0.10), transparent 58%),
                linear-gradient(135deg, #ffffff 0%, var(--brand-50) 62%, #fff8f5 100%);
        }
        .hero-leaf {
            position: absolute;
            color: var(--brand-600);
            opacity: .085;
            pointer-events: none;
            animation: floaty 13s ease-in-out infinite;
        }
        @keyframes floaty {
            0%, 100% { transform: translate3d(0, 0, 0) rotate(-8deg); }
            50%      { transform: translate3d(-9px, -14px, 0) rotate(9deg); }
        }

        /* 글이 몇 건 없을 때 목록 아래가 휑해 보이지 않도록 자리를 채운다. */
        .write-prompt {
            border: 1.5px dashed color-mix(in srgb, var(--brand-600) 26%, var(--line));
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255, 245, 245, .55), rgba(255, 255, 255, .35));
            transition: border-color .2s ease, background .2s ease,
                        transform .2s cubic-bezier(.2,.7,.3,1);
        }
        .write-prompt:hover {
            border-color: var(--brand-600);
            background: linear-gradient(180deg, rgba(255, 240, 240, .85), rgba(255, 255, 255, .6));
            transform: translateY(-2px);
        }

        /* ── 게시판 배경의 잎 ────────────────────────────────────────
           바람에 날리는 잎은 한 가지 움직임이 아니라 세 가지가 겹친 것이다.
           그래서 겹을 나눠 각각 다른 주기로 돌린다.
             leaf      … 위에서 아래로 떨어지며 바람 방향으로 밀린다
             leaf-sway … 좌우로 흔들린다(떨어지는 주기보다 훨씬 짧다)
             leaf-flip … 뒤집히며 돈다. 옆면이 보일 때 납작해진다
           전부 transform/opacity 만 건드리므로 합성 단계에서 처리된다.
           글을 읽는 데 걸리면 안 되므로 투명도는 0.075 를 넘기지 않는다. */
        .leaf-field {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .leaf-field .leaf {
            position: absolute;
            top: 0;
            left: var(--x);
            color: var(--brand-600);
            animation: leafFall var(--dur) linear var(--delay) infinite;
        }
        .leaf-field .leaf-sway,
        .leaf-field .leaf-flip { display: block; }
        .leaf-field .leaf-sway {
            animation: leafSway var(--sway) ease-in-out var(--delay) infinite alternate;
        }
        .leaf-field .leaf-flip {
            animation: leafFlip var(--flip) ease-in-out var(--delay) infinite alternate;
        }
        /* 가장자리에서 툭 나타나고 사라지지 않도록 양 끝을 흐린다. */
        @keyframes leafFall {
            0%   { transform: translate3d(0, -22vh, 0); opacity: 0; }
            9%   { opacity: var(--op); }
            87%  { opacity: var(--op); }
            100% { transform: translate3d(var(--drift), 118vh, 0); opacity: 0; }
        }
        @keyframes leafSway {
            from { transform: translateX(calc(var(--swing) * -1)); }
            to   { transform: translateX(var(--swing)); }
        }
        /* 옆면이 보이는 구간(scaleX 가 작아지는 때)에 오래 머물면 잎이
           아니라 실오라기처럼 보인다. 중간을 빠르게 지나가게 잡는다. */
        @keyframes leafFlip {
            0%   { transform: rotate(-24deg) scaleX(1); }
            40%  { transform: rotate(32deg)  scaleX(.88); }
            50%  { transform: rotate(60deg)  scaleX(.42); }
            60%  { transform: rotate(88deg)  scaleX(.88); }
            100% { transform: rotate(146deg) scaleX(1); }
        }

        /* 움직임을 원치 않는 사용자에게는 전부 멈춘다. */
        @media (prefers-reduced-motion: reduce) {
            body::after, .post-enter, .pop, .sway, .hero-leaf,
            .leaf-field .leaf, .leaf-field .leaf-sway, .leaf-field .leaf-flip,
            .live-dot::after { animation: none !important; }
            /* 잎은 떨어뜨리지 않고 제자리에 흩어놓는다(--sy 가 그 자리다). */
            .leaf-field .leaf { top: var(--sy); opacity: var(--op); }
            .leaf-field .leaf-flip { transform: rotate(var(--sr)); }
            .post-card, .lift, .write-prompt, .sidebar-item, .nav-icon { transition: none !important; }
            /* 바는 animation 으로 자라므로, 끌 때는 최종 상태를 직접 준다. */
            .sidebar-item.active::before {
                animation: none !important;
                transform: translateY(-50%) scaleY(1);
            }
            .live-dot::after { opacity: 0; }
        }

        /* ── 이용 안내의 창구 카드 ───────────────────────────────────
           두 창구는 성격이 다르므로 색을 나눠야 한다. 다만 회색은 UI 에서
           '꺼짐·비활성'으로 읽히므로 쓰지 않는다. 고충 접수는 '담당자만
           보는 창구'라는 성격에 맞게 짙은 잉크블루를 쓴다. */
        .ch-brand {
            --ch: var(--brand-600); --ch-deep: var(--brand-700);
            --ch-soft: var(--brand-50); --ch-line: var(--brand-200);
            --ch-line-soft: var(--brand-100);
        }
        .ch-ink {
            --ch: #3d4a61; --ch-deep: #2b3648;
            --ch-soft: #eef1f6; --ch-line: #c2ccdb;
            --ch-line-soft: #dbe2ec;
        }
        .ch-card {
            background: var(--surface);
            border: 1px solid var(--ch-line);
            border-radius: 16px;
            transition: transform .2s cubic-bezier(.2,.7,.3,1),
                        box-shadow .2s ease, border-color .2s ease;
        }
        .ch-card:hover {
            transform: translateY(-2px);
            border-color: var(--ch);
            box-shadow: 0 12px 30px -16px color-mix(in srgb, var(--ch) 60%, transparent);
        }
        .ch-badge { background: var(--ch-soft); color: var(--ch); border: 1px solid var(--ch-line-soft); }
        .ch-tag   { color: var(--ch); }
        .ch-dot   { background: var(--ch); opacity: .55; }
        .ch-btn   { background: var(--ch); color: #fff; transition: background-color .18s ease; }
        .ch-btn:hover { background: var(--ch-deep); }

        /* ── 사이드바 ────────────────────────────────────────────────── */
        .sidebar-shell {
            overflow: hidden;
            background:
                radial-gradient(130% 44% at 50% 100%, rgba(217, 43, 43, 0.045), transparent 68%),
                linear-gradient(180deg, #ffffff 0%, #fffbfb 64%, #fff7f7 100%);
        }
        /* 메뉴가 네 줄뿐이라 아래가 휑했다. 이름이 대나무숲이니 숲을 그려
           넣는다. 아주 옅어서 글자를 가리지 않고, 바닥을 받쳐 준다. */
        .grove {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            width: 100%;
            height: 292px;
            z-index: 0;
            pointer-events: none;
            /* 줄기 윗동이 싹둑 잘리면 막대 그래프처럼 보인다. 위로 갈수록
               흐려지게 해서 안개 속에서 솟아오르는 것처럼 만든다. */
            -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 52%, #000 100%);
                    mask-image: linear-gradient(180deg, transparent 0%, #000 52%, #000 100%);
        }
        /* 숲은 배경이므로 메뉴와 발치는 그 위에 둔다. */
        .sidebar-layer { position: relative; z-index: 1; }
        /* 머리에 옅은 브랜드 번짐을 둬서 로고가 흰 바탕에 떠 있지 않게 한다. */
        .sidebar-brand {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #ffffff 0%, var(--brand-50) 130%);
        }
        .sidebar-brand::after {
            content: '';
            position: absolute;
            right: -22px; top: -26px;
            width: 92px; height: 92px;
            pointer-events: none;
            background: radial-gradient(circle at 32% 32%, rgba(217, 43, 43, 0.13), transparent 68%);
        }
        .brand-mark {
            background: linear-gradient(140deg, var(--brand-500), var(--brand-700));
            box-shadow: 0 4px 12px -4px rgba(217, 43, 43, 0.55),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .sidebar-item {
            position: relative;
            transition: background-color .18s ease, color .18s ease,
                        transform .18s cubic-bezier(.2,.7,.3,1);
        }
        .sidebar-item:hover {
            background-color: var(--brand-50);
            color: var(--brand-600);
            transform: translateX(2px);
        }
        .sidebar-item.active {
            background: linear-gradient(90deg, var(--brand-50), rgba(255, 245, 245, .3));
            color: var(--brand-700);
            font-weight: 700;
        }
        /* 활성 항목은 왼쪽 레드 바로 표시한다. 메뉴를 옮기면 바가 세로로 자란다. */
        .sidebar-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 3px;
            height: 62%;
            border-radius: 0 3px 3px 0;
            background: linear-gradient(180deg, var(--brand-500), var(--brand-700));
            transform: translateY(-50%) scaleY(0);
            animation: railIn .28s cubic-bezier(.2,.7,.3,1) forwards;
        }
        @keyframes railIn { to { transform: translateY(-50%) scaleY(1); } }

        /* 아이콘은 제 타일 안에 둔다. 글자만 있던 줄에 무게중심이 생긴다. */
        .nav-icon {
            width: 32px; height: 32px;
            border-radius: 9px;
            display: grid; place-items: center;
            flex-shrink: 0;
            color: #9a8d8d;
            background: #f4efef;
            transition: background-color .18s ease, color .18s ease, box-shadow .18s ease;
        }
        .sidebar-item:hover .nav-icon { background: var(--brand-100); color: var(--brand-600); }
        .sidebar-item.active .nav-icon {
            background: linear-gradient(140deg, var(--brand-500), var(--brand-700));
            color: #ffffff;
            box-shadow: 0 3px 8px -2px rgba(217, 43, 43, 0.5);
        }

        .nav-caption {
            font-size: 10.5px;
            letter-spacing: .12em;
            font-weight: 800;
            color: #bdb0b0;
        }

        /* 연동 표시등에서 아주 옅은 파문이 퍼진다. */
        .live-dot { position: relative; }
        .live-dot::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 999px;
            border: 1px solid rgba(34, 197, 94, 0.5);
            animation: ripple 2.6s ease-out infinite;
        }
        @keyframes ripple {
            0%   { transform: scale(.55); opacity: .9; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* ── 모션 ────────────────────────────────────────────────────── */
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .chart-path { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2s ease-out forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }

        /* ── 폼 요소 ─────────────────────────────────────────────────── */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; /* Larger touch target for mobile */
            width: 20px;
            border-radius: 50%;
            background: var(--brand-600);
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--brand-600);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--line);
            border-radius: 2px;
        }
        input[type=checkbox], input[type=radio] { accent-color: var(--brand-600); }

        /* 브라우저 기본 포커스 링도 브랜드 색으로 맞춘다. */
        :where(input, select, textarea, button, a):focus-visible {
            outline: 2px solid var(--brand-500);
            outline-offset: 2px;
        }

        /* ── 스크롤바 ────────────────────────────────────────────────── */
        * { scrollbar-color: var(--brand-200) transparent; scrollbar-width: thin; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--brand-200);
            border: 3px solid transparent;
            background-clip: content-box;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-500); background-clip: content-box; }

        .action-item:hover .action-tools { opacity: 1; }
        .action-tools { opacity: 0; transition: opacity 0.2s; }
        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            .action-tools { opacity: 1; } /* Always show tools on mobile since no hover */
        }

        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; background-image: none; }
            #root { margin: 0; padding: 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : "hr_dashboard";
        
        const Icon = ({ name, size = 20, className = "", color }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (!ref.current || !window.lucide) return;
                const iconName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                const iconData = window.lucide.icons[iconName];
                if (!iconData) return;
                const svgElement = window.lucide.createElement(iconData);
                svgElement.setAttribute('width', size);
                svgElement.setAttribute('height', size);
                if (className) svgElement.setAttribute('class', `lucide lucide-${name} ${className}`);
                if (color) svgElement.setAttribute('stroke', color);
                ref.current.innerHTML = '';
                ref.current.appendChild(svgElement);
            }, [name, size, className, color]);
            return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }} />;
        };

        const Loading = () => (
            <div className="flex justify-center items-center h-full min-h-[400px]">
                <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600"></div>
            </div>
        );

        const Badge = ({ type, text }) => {
            // brand 와 위험 색이 같은 레드 계열이므로, 위험 단계만 '꽉 채운' 배지로 구분한다.
            const styles = {
                critical: "bg-red-600 text-white border-red-600 shadow-sm",
                warning: "bg-amber-100 text-amber-800 border-amber-200",
                good: "bg-green-100 text-green-700 border-green-200",
                neutral: "bg-slate-100 text-slate-700 border-slate-200"
            };
            return <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold border ${styles[type] || styles.neutral}`}>{text}</span>;
        };

        const getFormattedPeriod = (year, month) => `${year}-${String(month).padStart(2, '0')}`;

        // 진단 응답은 이 기간에 묶여 저장된다. 구성원 화면에는 기간 선택이 없으므로,
        // 여기에 고정값을 두면 몇 달치 응답이 한 칸에 전부 쌓인다.
        // (실제로 '2026-02' 로 박혀 있어 9월에 낸 응답도 2월로 들어갔다)
        const nowPeriod = () => {
            const d = new Date();
            return { year: String(d.getFullYear()), month: String(d.getMonth() + 1) };
        };

        // ── 고충 접수 창구 ────────────────────────────────────────────
        // 고충 접수는 사내 카카오톡 채널에서 운영한다. 웹 접수 양식은 두지 않는다.
        //
        // 카카오톡은 프로필이 그대로 보이는 '기명' 창구다. 이름을 밝히기 어려운
        // 이야기는 대나무숲 게시판이 받고, 두 창구의 차이를 화면에서 분명히 알린다.
        const KAKAO_CHANNEL_URL = 'https://pf.kakao.com/_kGxhxnX/chat';

        const PULSE_FIELDS = [
            { id: 'workload', label: '업무부하', desc: '업무량과 마감이 감당 가능한 수준입니다.', category: 'env' },
            { id: 'clarity', label: '역할명확성', desc: '내 역할과 목표, 업무 우선순위가 명확합니다.', category: 'env' },
            { id: 'relationship', label: '협업관계', desc: '동료와의 협업과 소통이 원활합니다.', category: 'people' },
            { id: 'leadership', label: '리더십', desc: '리더가 방향, 우선순위, 피드백을 명확히 제공합니다.', category: 'people' },
            { id: 'safety', label: '심리적 안전감', desc: '불이익 걱정 없이 의견이나 문제를 말할 수 있습니다.', category: 'people' },
            { id: 'growth', label: '성장감', desc: '현재 업무가 역량 성장과 커리어에 도움이 됩니다.', category: 'growth' },
            { id: 'fairness', label: '공정성', desc: '평가, 보상, 업무배분이 공정하다고 느낍니다.', category: 'growth' },
            { id: 'engagement', label: '몰입/추천의향', desc: '이 조직에서 계속 일하고 싶고 지인에게 추천할 수 있습니다.', category: 'engagement' }
        ];

        const PULSE_CATEGORIES = [
            { id: 'env', label: '업무 환경' },
            { id: 'people', label: '관계·리더십' },
            { id: 'growth', label: '성장·공정성' },
            { id: 'engagement', label: '몰입도' }
        ];

        const DEFAULT_SURVEY_DATA = PULSE_FIELDS.reduce((acc, field) => ({ ...acc, [field.id]: "3" }), { teamId: "", keywords: "" });
        const getPulseScore = (data, key) => {
            const parsed = Number(data?.[key]);
            return Number.isFinite(parsed) && parsed > 0 ? parsed : 3;
        };
        // 팀 단위 결과를 몇 명부터 보여줄지.
        // 표본이 적은 팀은 점수만 보고도 누가 어떻게 답했는지 좁혀진다. 특히
        // 1~2명이면 사실상 본인 답이 그대로 노출되므로, 그런 팀은 점수도 키워드도
        // 산출하지 않는다(화면에서 가리는 게 아니라 저장 자체를 하지 않는다).
        //
        // 값이 클수록 익명은 두터워지지만 그만큼 많은 팀이 '표본부족' 으로 빠져
        // 대시보드에 볼 것이 없어진다. 팀 수가 많고 응답률이 낮은 조직이라
        // 활용도 쪽으로 3명을 택했다. 응답이 늘면 올리는 편이 안전하다.
        const PULSE_MIN_N = 3;
        const scoreToPercent = (score) => Math.round(((score - 1) / 4) * 100);
        const scoreToRiskPercent = (score) => Math.round(((5 - score) / 4) * 100);

        // --- Shared Logic for Auto Calculation ---
        const calculatePeriodStats = async (db, period, teamsList, silent = false) => {
            const { collection, query, where, getDocs, getDoc, doc, setDoc, updateDoc, serverTimestamp } = window.firestore;
            
            try {
                let effectiveTeams = Array.isArray(teamsList) ? teamsList : [];
                if (effectiveTeams.length === 0) {
                    const teamSnap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'teams'));
                    effectiveTeams = teamSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                }
                // 기간별 결과 문서의 ID 는 (기간, 팀) 으로 정해 둔다. 몇 번을 다시
                // 산출해도 같은 문서를 덮어쓰므로 중복이 쌓이지 않는다.
                const statRef = (teamId) =>
                    doc(db, 'artifacts', APP_ID, 'public', 'data', 'team_stats', `${period}__${teamId}`);
                const blankStat = (teamId, n) => ({
                    teamId, period, responseCount: n,
                    status: n === 0 ? '양호' : '표본부족',
                    workload: '적정', conflict: '낮음', leadership: '보통',
                    diagnosisScores: {}, diagnosisDrivers: [], keywords: [],
                    calculatedAt: serverTimestamp()
                });

                // 기간 필터를 서버에 맡긴다. 전부 내려받아 브라우저에서 거르면
                // 300명이 매주 응답하는 환경에서 1년이면 한 번 산출할 때마다
                // 1만 건 이상을 읽게 되고, 읽기 요금도 그만큼 붙는다.
                const q = query(
                    collection(db, 'artifacts', APP_ID, 'public', 'data', 'survey_responses'),
                    where("period", "==", period)
                );
                const querySnapshot = await getDocs(q);
                const currentDocs = querySnapshot.docs;
                const emptyMetrics = {
                    burnout: { label: "번아웃 리스크", value: "-", diff: "0" },
                    safety: { label: "심리적 안전감", value: "-", diff: "0" },
                    enps: { label: "몰입도 (eNPS)", value: "-", diff: "0" },
                    growth: { label: "성장 비전 공감", value: "-", diff: "0" }
                };

                if (currentDocs.length === 0) {
                    await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'global_stats', period), emptyMetrics);

                    const chartRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'chart_stats', 'current');
                    const chartSnap = await getDoc(chartRef);
                    const currentTrend = chartSnap.exists() ? (chartSnap.data().trend || []) : [];
                    await setDoc(chartRef, { trend: currentTrend.filter(t => t.label !== period) }, { merge: true });

                    await Promise.all(effectiveTeams.map((team) => setDoc(statRef(team.id), blankStat(team.id, 0))));

                    if(!silent) alert(`현재 기간(${period})에 데이터가 없어 통계가 초기화되었습니다.`);
                    return;
                }

                const totals = PULSE_FIELDS.reduce((acc, field) => ({ ...acc, [field.id]: 0 }), {});
                currentDocs.forEach(d => {
                    const data = d.data();
                    PULSE_FIELDS.forEach(field => {
                        totals[field.id] += getPulseScore(data, field.id);
                    });
                });
                const count = currentDocs.length;

                const averages = PULSE_FIELDS.reduce((acc, field) => ({ ...acc, [field.id]: totals[field.id] / count }), {});
                const burnout = scoreToRiskPercent(averages.workload);
                const safety = averages.safety.toFixed(1);
                const growth = scoreToPercent(averages.growth);
                
                let enps = Math.round((averages.engagement - 3) * 50);
                let enpsStr = String(enps);
                if(enps > 0) enpsStr = "+" + enps;

                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'global_stats', period), {
                    burnout: { label: "번아웃 리스크", value: `${burnout}%`, diff: "0" },
                    safety: { label: "심리적 안전감", value: String(safety), diff: "0" },
                    enps: { label: "몰입도 (eNPS)", value: enpsStr, diff: "0" },
                    growth: { label: "성장 비전 공감", value: `${growth}%`, diff: "0" }
                });

                const chartRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'chart_stats', 'current');
                const chartSnap = await getDoc(chartRef);
                let currentTrend = [];
                if (chartSnap.exists()) {
                    currentTrend = chartSnap.data().trend || [];
                }
                
                const newTrendItem = { label: period, value: String(enps) };
                
                const updatedTrend = [...currentTrend.filter(t => t.label !== period), newTrendItem].sort((a,b) => a.label.localeCompare(b.label));
                await setDoc(chartRef, { trend: updatedTrend }, { merge: true });

                const updatePromises = effectiveTeams.map(async (team) => {
                    const teamResponses = currentDocs.filter(d => d.data().teamId === team.id);
                    // 표본이 너무 적으면 집계하지 않는다. 점수도 키워드도 남기지 않으므로
                    // 관리자 화면에도, Firestore 에도 개인을 추정할 단서가 생기지 않는다.
                    // 응답 자체는 survey_responses 에 그대로 있어 전사 통계에는 반영된다.
                    if(teamResponses.length < PULSE_MIN_N) {
                        await setDoc(statRef(team.id), blankStat(team.id, teamResponses.length));
                        return;
                    }

                    const teamTotals = PULSE_FIELDS.reduce((acc, field) => ({ ...acc, [field.id]: 0 }), {});
                    teamResponses.forEach(d => {
                        const dat = d.data();
                        PULSE_FIELDS.forEach(field => {
                            teamTotals[field.id] += getPulseScore(dat, field.id);
                        });
                    });
                    const tc = teamResponses.length;
                    const diagnosisScores = PULSE_FIELDS.reduce((acc, field) => ({
                        ...acc,
                        [field.id]: Number((teamTotals[field.id] / tc).toFixed(1))
                    }), {});
                    const teamKeywords = [...new Set(
                        teamResponses
                            .flatMap(d => String(d.data().keywords || '').split(','))
                            .map(k => k.trim())
                            .filter(Boolean)
                    )];

                    const diagnosisDrivers = [];
                    if (diagnosisScores.workload <= 2.5) diagnosisDrivers.push('업무부하');
                    if (diagnosisScores.relationship <= 2.5) diagnosisDrivers.push('협업관계');
                    if (diagnosisScores.leadership <= 2.5) diagnosisDrivers.push('리더십');
                    if (diagnosisScores.safety <= 2.5) diagnosisDrivers.push('심리적 안전감');
                    if (diagnosisScores.growth <= 2.5) diagnosisDrivers.push('성장감');
                    if (diagnosisScores.fairness <= 2.5) diagnosisDrivers.push('공정성');
                    if (diagnosisScores.clarity <= 2.5) diagnosisDrivers.push('역할명확성');
                    if (diagnosisScores.engagement <= 2.5) diagnosisDrivers.push('몰입/추천의향');

                    let newStatus = '양호';
                    if (diagnosisDrivers.length >= 3 || diagnosisScores.engagement <= 2.2) newStatus = '심각';
                    else if (diagnosisDrivers.length > 0) newStatus = '위험';

                    await setDoc(statRef(team.id), {
                        teamId: team.id,
                        period,
                        responseCount: tc,
                        status: newStatus,
                        workload: diagnosisScores.workload <= 2.5 ? '과부하' : '적정',
                        conflict: diagnosisScores.relationship <= 2.5 ? '높음' : '낮음',
                        leadership: diagnosisScores.leadership <= 2.5 ? '부족' : '보통',
                        safetyStatus: diagnosisScores.safety <= 2.5 ? '낮음' : '양호',
                        growthStatus: diagnosisScores.growth <= 2.5 ? '정체' : '양호',
                        fairnessStatus: diagnosisScores.fairness <= 2.5 ? '주의' : '양호',
                        clarityStatus: diagnosisScores.clarity <= 2.5 ? '불명확' : '양호',
                        diagnosisScores,
                        diagnosisDrivers,
                        keywords: teamKeywords,
                        calculatedAt: serverTimestamp()
                    });
                });
                await Promise.all(updatePromises);

                if(!silent) alert(`데이터 산출 완료! (총 ${count}건 반영)\n팀 상태가 자동 업데이트되었습니다.`);
                console.log(`[Auto-Calc] Metrics updated for ${period}. Count: ${count}`);

            } catch(e) {
                console.error("Auto Calc Error:", e);
                if(!silent) alert("자동 산출 중 오류: " + e.message);
            }
        };

        // 관리자 인증은 Firebase Auth 이메일 로그인으로 처리한다.
        // 예전에는 비밀번호 해시를 브라우저에서 상수와 비교했는데, 그 방식은
        // 콘솔에서 우회할 수 있을 뿐 아니라 Firestore 규칙이 관리자를 구분할
        // 근거가 없어서 고충 내역을 잠글 수가 없었다.
        // 이제 관리자 여부는 admins/{uid} 문서의 존재로 판정하고, 같은 조건을
        // 보안 규칙에서도 검사한다.
        const AdminLoginModal = ({ onClose, onSuccess }) => {
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [error, setError] = useState("");
            const [busy, setBusy] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (busy) return;
                setError("");
                setBusy(true);
                try {
                    const cred = await window.firebaseAuth.signInWithEmailAndPassword(window.auth, email.trim(), password);
                    const adminDoc = await window.firestore.getDoc(
                        window.firestore.doc(window.db, 'admins', cred.user.uid)
                    );
                    if (!adminDoc.exists()) {
                        // 로그인은 됐지만 관리자 명단에 없는 계정. 익명으로 되돌린다.
                        await window.firebaseAuth.signOut(window.auth);
                        await window.firebaseAuth.signInAnonymously(window.auth);
                        setError("관리자 권한이 없는 계정입니다.");
                        return;
                    }
                    onSuccess();
                    onClose();
                } catch (err) {
                    const code = err?.code || "";
                    setError(
                        code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")
                            ? "이메일 또는 비밀번호가 올바르지 않습니다."
                            : code.includes("too-many-requests")
                                ? "시도가 너무 잦습니다. 잠시 후 다시 시도해주세요."
                                : "로그인에 실패했습니다. " + (err?.message || "")
                    );
                } finally {
                    setBusy(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[100] p-4 fade-in backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full p-8 border border-slate-200">
                        <div className="text-center mb-6">
                            <div className="w-12 h-12 bg-brand-50 border border-brand-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                <Icon name="lock" size={24} className="text-brand-600" />
                            </div>
                            <h2 className="text-xl font-bold text-slate-800">관리자 인증</h2>
                            <p className="text-xs text-slate-500 mt-1.5">HR 담당자 계정으로 로그인해주세요.</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <input
                                type="email"
                                value={email}
                                onChange={(e) => { setEmail(e.target.value); setError(""); }}
                                className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200"
                                placeholder="이메일"
                                autoComplete="username"
                                autoFocus
                                required
                            />
                            <input
                                type="password"
                                value={password}
                                onChange={(e) => { setPassword(e.target.value); setError(""); }}
                                className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200"
                                placeholder="비밀번호"
                                autoComplete="current-password"
                                required
                            />
                            {error && <p className="text-red-700 text-xs text-center font-medium bg-red-50 border border-red-100 rounded-lg px-3 py-2">{error}</p>}
                            <div className="flex gap-2 pt-1">
                                <button type="button" onClick={onClose} className="flex-1 py-3 font-bold text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors">취소</button>
                                <button type="submit" disabled={busy} className="flex-1 py-3 font-bold text-white bg-brand-600 rounded-lg hover:bg-brand-700 shadow-brand transition-colors disabled:opacity-50">
                                    {busy ? "확인 중…" : "로그인"}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const ActionBoardWidget = ({ user }) => {
            const [actions, setActions] = useState([]);
            const [input, setInput] = useState("");
            const [editingId, setEditingId] = useState(null);
            const [editText, setEditText] = useState("");
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);

            useEffect(() => { 
                if(!user || !window.db) return; 
                const q = window.firestore.query(window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'action_items')); 
                return window.firestore.onSnapshot(q, (snapshot) => { 
                    const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    setActions(list); 
                }); 
            }, [user]);

            const handleAdd = async (e) => { 
                e.preventDefault(); if(!input.trim()) return; 
                await window.firestore.addDoc(window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'action_items'), { text: input, completed: false, createdAt: window.firestore.serverTimestamp(), createdBy: user.uid }); setInput(""); 
            };
            const handleDelete = async (id) => { await window.firestore.deleteDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'action_items', id)); setDeleteConfirmId(null); };
            const handleRequestDelete = (id) => { if (deleteConfirmId === id) { handleDelete(id); } else { setDeleteConfirmId(id); setTimeout(() => setDeleteConfirmId(null), 3000); } };
            const toggleStatus = async (action) => { await window.firestore.updateDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'action_items', action.id), { completed: !action.completed }); };
            const startEdit = (action) => { setEditingId(action.id); setEditText(action.text); };
            const saveEdit = async () => { if(!editText.trim()) return; await window.firestore.updateDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'action_items', editingId), { text: editText }); setEditingId(null); setEditText(""); };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 h-full flex flex-col">
                    <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-xl">
                        <h3 className="font-bold text-slate-800 text-sm">실행 과제 (Action Items)</h3>
                        <div className="flex gap-2"><span className="text-xs bg-white px-2 py-1 rounded border text-slate-600">전체: {actions.length}건</span><span className="text-xs bg-brand-100 text-brand-700 px-2 py-1 rounded border border-brand-200">진행 중: {actions.filter(a => !a.completed).length}건</span></div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-2 max-h-[300px]">
                        {actions.length === 0 && <p className="text-xs text-slate-400 text-center py-4">등록된 실행 과제가 없습니다.</p>}
                        {actions.map(action => (
                            <div key={action.id} className={`action-item flex gap-3 items-start p-3 border rounded-lg transition-all ${action.completed ? 'bg-slate-50 border-slate-100' : 'bg-white border-slate-200 hover:border-brand-300'}`}>
                                <button onClick={() => toggleStatus(action)} className={`mt-0.5 flex-shrink-0 w-4 h-4 rounded border flex items-center justify-center transition-colors ${action.completed ? 'bg-green-500 border-green-500' : 'bg-white border-slate-300 hover:border-brand-400'}`} title={action.completed ? "완료됨 (다시 클릭하여 취소)" : "완료 처리"}>{action.completed && <Icon name="check" size={12} className="text-white" />}</button>
                                <div className="flex-1 min-w-0">{editingId === action.id ? (<div className="flex gap-2 items-center animate-fade-in"><input value={editText} onChange={e => setEditText(e.target.value)} className="flex-1 text-xs border border-brand-300 rounded px-2 py-1 outline-none shadow-sm" autoFocus onKeyDown={e => { if(e.key === 'Enter') saveEdit(); else if(e.key === 'Escape') setEditingId(null); }} /><button onClick={saveEdit} className="text-green-600 hover:bg-green-50 p-1 rounded"><Icon name="check" size={14} /></button><button onClick={() => setEditingId(null)} className="text-red-500 hover:bg-red-50 p-1 rounded"><Icon name="x" size={14} /></button></div>) : (<p className={`text-xs break-words leading-relaxed cursor-pointer select-none ${action.completed ? 'text-slate-400 line-through' : 'text-slate-700'}`} onClick={() => startEdit(action)} title="클릭하여 수정">{action.text}</p>)}</div>
                                {editingId !== action.id && (<div className="action-tools flex gap-1"><button onClick={() => startEdit(action)} className="text-slate-400 hover:text-brand-500 p-1 rounded hover:bg-brand-50 transition-colors" title="수정"><Icon name="pencil" size={14} /></button><button onClick={() => handleRequestDelete(action.id)} className={`p-1 rounded transition-colors ${deleteConfirmId === action.id ? 'bg-red-100 text-red-600' : 'text-slate-400 hover:text-red-500 hover:bg-red-50'}`} title={deleteConfirmId === action.id ? "삭제 확인 (한번 더 클릭)" : "삭제"}><Icon name={deleteConfirmId === action.id ? "alert-circle" : "trash-2"} size={14} /></button></div>)}
                            </div>
                        ))}
                    </div>
                    <form onSubmit={handleAdd} className="p-3 border-t bg-slate-50 rounded-b-xl flex gap-2"><input value={input} onChange={e => setInput(e.target.value)} placeholder="새로운 실행 과제 입력..." className="flex-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:border-brand-400 bg-white" /><button className="bg-brand-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-brand-700 transition-colors shadow-sm">추가</button></form>
                </div>
            );
        };

        const getTeamName = (teamStats, teamId) => {
            const team = (teamStats || []).find(t => t.id === teamId);
            return team ? team.name : "미지정";
        };

        const formatDateTime = (value) => {
            if (!value) return "-";
            if (value.seconds) return new Date(value.seconds * 1000).toLocaleString();
            // 처리 이력·대화는 ISO 문자열로 저장되므로 사람이 읽는 형식으로 바꿔준다.
            if (typeof value === "string") {
                const parsed = new Date(value);
                if (!Number.isNaN(parsed.getTime())) return parsed.toLocaleString();
            }
            return String(value);
        };

        // 고충 접수는 사내 카카오톡 채널이 맡으므로 이 화면은 조직 진단만 담당한다.
        const SurveyView = ({ teamStats, currentPeriod }) => {
            const [surveyData, setSurveyData] = useState({ ...DEFAULT_SURVEY_DATA });
            const [copied, setCopied] = useState(false);
            const [submitted, setSubmitted] = useState(null);
            const [keywordInput, setKeywordInput] = useState("");
            const [touchedFields, setTouchedFields] = useState({});
            const [pulseComments, setPulseComments] = useState({});
            const pulseProgress = useMemo(() => {
                const touchedCount = PULSE_FIELDS.filter(f => touchedFields[f.id]).length;
                const total = PULSE_FIELDS.length + 1; // +1 for 소속 부서
                const done = touchedCount + (surveyData.teamId ? 1 : 0);
                return { done, total, percent: Math.round((done / total) * 100) };
            }, [touchedFields, surveyData.teamId]);
            const keywordList = useMemo(() => {
                const items = String(surveyData.keywords || "")
                    .split(',')
                    .map(k => k.trim())
                    .filter(Boolean);
                return [...new Set(items)];
            }, [surveyData.keywords]);

            const setKeywordList = (nextList) => {
                const cleaned = [...new Set(nextList.map(k => String(k || '').trim()).filter(Boolean))];
                setSurveyData(prev => ({ ...prev, keywords: cleaned.join(', ') }));
            };

            const addKeywordFromInput = () => {
                const v = String(keywordInput || '').trim();
                if (!v) return;
                setKeywordList([...keywordList, v]);
                setKeywordInput("");
            };

            const removeKeyword = (target) => {
                setKeywordList(keywordList.filter(k => k !== target));
            };

            const handleSurveySubmit = async (e) => {
                e.preventDefault();
                if(!surveyData.teamId) return alert("소속 팀을 선택해주세요.");
                try {
                    const lowScoreComments = PULSE_FIELDS.reduce((acc, field) => {
                        const score = Number(surveyData[field.id]);
                        const note = String(pulseComments[field.id] || '').trim();
                        if (score <= 2 && note) acc[field.id] = note;
                        return acc;
                    }, {});
                    await window.firestore.addDoc(window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'survey_responses'), {
                        teamId: surveyData.teamId,
                        period: currentPeriod,
                        ...PULSE_FIELDS.reduce((acc, field) => ({ ...acc, [field.id]: Number(surveyData[field.id]) }), {}),
                        keywords: surveyData.keywords, // Added to save raw keywords with response
                        comments: lowScoreComments,
                        createdAt: window.firestore.serverTimestamp()
                    });

                    await calculatePeriodStats(window.db, currentPeriod, teamStats, true); 

                    setSubmitted({ type: "survey" });
                } catch(e) { console.error(e); alert("제출 오류: " + e.message); }
            };

            if(submitted) return (
                <div className="flex flex-col items-center justify-center h-full p-4 md:p-8 text-center animate-fade-in">
                    <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-4"><Icon name="check" size={32} className="text-green-600" /></div>
                    <h2 className="text-2xl font-bold text-slate-800 mb-2">제출 완료</h2>
                    <p className="text-slate-500 mb-6">소중한 의견이 안전하게 저장되었습니다.</p>


                    <button onClick={() => { setSubmitted(null); setSurveyData({ ...DEFAULT_SURVEY_DATA }); setKeywordInput(""); setTouchedFields({}); setPulseComments({}); }} className="text-brand-600 font-bold hover:underline mt-6">추가 작성하기</button>
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto animate-fade-in my-4 md:my-8">
                    <div className="bg-white rounded-2xl shadow-md border border-slate-100 p-4 md:p-8">
                        <div className="mb-6">
                            <h1 className="text-xl md:text-2xl font-bold text-slate-800">조직 진단</h1>
                            <p className="text-xs md:text-sm text-slate-500 mt-2">8개 핵심 지표를 진단하고, 개선 키워드를 태그로 추가해주세요.</p>
                        </div>


                        {(
                            <div>
                                <div className="text-center mb-4">
                                    <h2 className="text-lg md:text-xl font-bold text-slate-800">주간 조직 진단 (Weekly Pulse Survey)</h2>
                                    <p className="text-xs md:text-sm text-slate-400 mt-2">8개 핵심 지표를 5점 척도로 진단하고, 개선 키워드는 태그로 추가하세요.</p>
                                </div>
                                <div className="mb-6 md:mb-8">
                                    <div className="flex justify-between items-center text-xs font-bold text-slate-500 mb-1.5">
                                        <span>진행률</span>
                                        <span className="text-brand-600">{pulseProgress.done} / {pulseProgress.total}</span>
                                    </div>
                                    <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                        <div className="h-full bg-brand-500 rounded-full transition-all duration-300" style={{ width: `${pulseProgress.percent}%` }}></div>
                                    </div>
                                </div>
                                {/* 팀 목록은 기간별로 등록된다. 이번 기간 것이 없으면 부서를 고를 수 없어
                                    제출 자체가 막히는데, 빈 드롭다운만 보이면 왜 안 되는지 알 수가 없다. */}
                                {teamStats.length === 0 && (
                                    <div className="bg-white border border-red-200 rounded-2xl p-6 text-center">
                                        <div className="w-12 h-12 bg-red-50 border border-red-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                            <Icon name="alert-circle" size={22} className="text-red-600" />
                                        </div>
                                        <p className="font-bold text-slate-800">아직 진단을 시작할 수 없습니다</p>
                                        <p className="text-sm text-slate-500 mt-1.5 leading-relaxed">
                                            {currentPeriod} 의 부서 목록이 아직 등록되지 않았습니다.<br className="hidden md:block" />
                                            담당자에게 알려주시면 바로 열립니다.
                                        </p>
                                    </div>
                                )}
                                {teamStats.length > 0 && (
                                <form onSubmit={handleSurveySubmit} className="space-y-7 pb-20 md:pb-0">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">소속 부서</label>
                                        <select value={surveyData.teamId} onChange={e => setSurveyData({...surveyData, teamId: e.target.value})} className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-200" required>
                                            <option value="">부서를 선택해주세요</option>
                                            {teamStats.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                        </select>
                                    </div>
                                    {PULSE_CATEGORIES.map(cat => (
                                        <div key={cat.id} className="space-y-4">
                                            <h3 className="text-sm font-bold text-brand-700 flex items-center gap-2 pt-1">
                                                <span className="w-1.5 h-1.5 rounded-full bg-brand-500"></span>{cat.label}
                                            </h3>
                                            {/* 문항 카드가 가로로 늘어나면 오른쪽이 통째로 비어, 넓은 화면에서는 2열로 둔다 */}
                                            <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">
                                            {PULSE_FIELDS.filter(f => f.category === cat.id).map(f => (
                                                <div key={f.id} className="bg-slate-50 p-5 rounded-xl border border-slate-100 shadow-sm">
                                                    <div className="flex items-center justify-between mb-3">
                                                        <label className="block text-base font-extrabold text-slate-800">{f.label}</label>
                                                        <span className="text-sm font-bold text-brand-700 bg-brand-50 px-2.5 py-1 rounded-full">{surveyData[f.id]}점</span>
                                                    </div>
                                                    <p className="text-xs text-slate-400 mb-3">{f.desc}</p>
                                                    <div className="flex gap-2 overflow-x-auto pb-1">
                                                        {[1, 2, 3, 4, 5].map(num => {
                                                            const selected = String(surveyData[f.id]) === String(num);
                                                            const levelLabel = ['전혀 아님', '아님', '보통', '그렇다', '매우 그렇다'][num - 1];
                                                            const selectedTone = num <= 2
                                                                ? 'border-red-500 bg-red-500 text-white shadow-red-200'
                                                                : num === 3
                                                                    ? 'border-amber-500 bg-amber-500 text-white shadow-amber-200'
                                                                    : 'border-green-500 bg-green-500 text-white shadow-green-200';
                                                            return (
                                                                <button
                                                                    key={num}
                                                                    type="button"
                                                                    onClick={() => { setSurveyData({ ...surveyData, [f.id]: String(num) }); setTouchedFields(prev => ({ ...prev, [f.id]: true })); }}
                                                                    className={`flex-1 min-w-[76px] rounded-xl border px-2 py-3 text-center transition-all ${
                                                                        selected
                                                                            ? `${selectedTone} shadow-md`
                                                                            : 'border-slate-200 bg-white text-slate-600 hover:border-brand-300 hover:bg-brand-50'
                                                                    }`}
                                                                    aria-label={`${f.label} ${num}점`}
                                                                >
                                                                    <div className={`text-lg font-black ${selected ? 'text-white' : 'text-slate-800'}`}>{num}</div>
                                                                    <div className={`mt-1 text-[11px] font-semibold ${selected ? 'text-white/90' : 'text-slate-400'}`}>{levelLabel}</div>
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                    {Number(surveyData[f.id]) <= 2 && (
                                                        <div className="mt-3 animate-fade-in">
                                                            <textarea
                                                                value={pulseComments[f.id] || ''}
                                                                onChange={e => setPulseComments(prev => ({ ...prev, [f.id]: e.target.value }))}
                                                                rows="2"
                                                                placeholder="구체적인 사유를 남겨주시면 개선에 큰 도움이 됩니다 (선택)"
                                                                className="w-full px-3 py-2 text-xs border border-red-200 rounded-lg bg-red-50/50 focus:outline-none focus:ring-2 focus:ring-red-200 resize-none"
                                                            />
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                            </div>
                                        </div>
                                    ))}
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-3">키워드 태그</label>
                                        <div className="w-full px-4 py-4 border border-slate-200 rounded-xl bg-white">
                                            <div className="flex flex-wrap gap-2.5 mb-3 min-h-10 items-center">
                                                {keywordList.length === 0 && <span className="text-sm text-slate-400">예: 소통 부재, 야근, 협업 개선</span>}
                                                {keywordList.map((tag) => (
                                                    <span key={tag} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-brand-50 text-brand-700 text-sm font-semibold border border-brand-100">
                                                        {tag}
                                                        <button type="button" className="text-brand-500 hover:text-brand-700" onClick={() => removeKeyword(tag)} aria-label={`${tag} 삭제`}>
                                                            <Icon name="x" size={12} />
                                                        </button>
                                                    </span>
                                                ))}
                                            </div>
                                            <input
                                                type="text"
                                                placeholder="입력 후 Enter 또는 쉼표(,)로 추가"
                                                value={keywordInput}
                                                onChange={e => setKeywordInput(e.target.value)}
                                                onKeyDown={e => {
                                                    if (e.key === 'Enter' || e.key === ',') {
                                                        e.preventDefault();
                                                        addKeywordFromInput();
                                                    } else if (e.key === 'Backspace' && !keywordInput && keywordList.length > 0) {
                                                        removeKeyword(keywordList[keywordList.length - 1]);
                                                    }
                                                }}
                                                onBlur={addKeywordFromInput}
                                                className="w-full px-2 py-2.5 text-base outline-none"
                                            />
                                        </div>
                                    </div>
                                    <div className="sticky bottom-0 -mx-4 px-4 py-3 bg-white/95 backdrop-blur border-t border-slate-100 md:static md:mx-0 md:px-0 md:py-0 md:bg-transparent md:border-0">
                                        <button type="submit" className="w-full bg-brand-600 text-white py-4 rounded-xl font-bold hover:bg-brand-700 transition shadow-lg shadow-brand-200">익명 제출</button>
                                    </div>
                                </form>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ── 안내 페이지 (구성원 첫 화면) ────────────────────────────
        // 익명 제보 도구는 "내가 쓴 게 누구에게 어디까지 보이는지" 를 이해시키지
        // 못하면 아무도 쓰지 않는다. 특히 이 서비스는 성격이 정반대인 창구
        // 두 개(관리자 전용 / 전체 공개)를 함께 두고 있어 그 구분이 중요하다.
        // 다만 급히 제보하려는 사람에게 벽이 되면 안 되므로, 각 항목에서 바로
        // 해당 화면으로 넘어갈 수 있게 한다.
        const ComplaintIntakeView = ({ setView }) => {
            const routes = [
                {
                    icon: 'message-circle',
                    title: '카카오톡 채널로 연결됩니다',
                    body: '평소 쓰시던 사내 카카오톡 채널이 그대로 접수 창구입니다. 담당자와 대화하듯 주고받으실 수 있고, 별도 양식이나 접수번호가 필요 없습니다.',
                    caution: '카카오톡 프로필(이름·사진)이 담당자에게 보입니다. 익명이 아닙니다. 아래 안내대로 프로필을 바꾸고 접수하실 수 있습니다.'
                },
                {
                    icon: 'lock',
                    title: '담당자 외에는 보지 않습니다',
                    body: '대화 내용은 고충 처리 담당자만 확인합니다. 게시판처럼 다른 구성원에게 공개되지 않고, 동료나 상급자에게 전달되지 않습니다.',
                    caution: '조사나 보호조치가 필요하면 담당자가 먼저 동의를 구합니다.'
                }
            ];

            return (
                <div className="max-w-6xl mx-auto animate-fade-in my-4 md:my-8 space-y-5">
                    <div className="bg-white rounded-2xl shadow-card border border-slate-100 p-6 md:p-10">
                        <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-brand-50 text-brand-700 border border-brand-100 mb-4">
                            <Icon name="shield" size={13} /> 담당자만 봅니다
                        </span>
                        <h1 className="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight leading-snug">고충 접수</h1>
                        <p className="text-sm md:text-base text-slate-600 mt-4 leading-relaxed">
                            괴롭힘, 부당한 업무 배분, 평가·보상 문제처럼 개별 확인과 조치가 필요한 일은
                            게시판이 아니라 이곳으로 남겨주세요. 게시판과 달리 담당자 외에는 누구도 볼 수 없습니다.
                        </p>
                        <div className="flex flex-wrap gap-2 mt-6">
                            <a href={KAKAO_CHANNEL_URL} target="_blank" rel="noopener noreferrer"
                               className="bg-[#FEE500] text-[#3C1E1E] px-5 py-3 rounded-xl text-sm font-bold hover:brightness-95 transition-all flex items-center gap-2 border border-yellow-300">
                                <Icon name="message-circle" size={16} /> 카카오톡 채널로 접수하기
                            </a>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {routes.map(r => (
                            <div key={r.title} className="bg-white rounded-2xl border border-slate-200 p-5 md:p-6 flex flex-col">
                                <div className="flex items-center gap-2.5 mb-3">
                                    <span className="w-9 h-9 rounded-lg flex items-center justify-center bg-brand-50 text-brand-600 border border-brand-100">
                                        <Icon name={r.icon} size={18} />
                                    </span>
                                    <p className="font-bold text-slate-900">{r.title}</p>
                                </div>
                                <p className="text-sm text-slate-600 leading-relaxed flex-1">{r.body}</p>
                                <p className="mt-4 text-xs text-slate-700 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 leading-relaxed">
                                    <span className="font-bold">알아두세요 · </span>{r.caution}
                                </p>
                            </div>
                        ))}
                    </div>

                    <div className="bg-white rounded-2xl border border-red-200 p-6 md:p-8">
                        <div className="flex items-center gap-2 mb-3">
                            <Icon name="alert-circle" size={18} className="text-red-600" />
                            <h2 className="text-lg font-bold text-slate-800">이름을 밝히기 어려운 일이라면</h2>
                        </div>
                        <p className="text-sm text-slate-700 leading-relaxed">
                            담당자에게는 카카오톡 프로필의 <span className="font-bold">이름과 사진만</span> 보입니다.
                            전화번호나 사번은 보이지 않습니다. 그래서 접수 전에 프로필을 바꿔두시면,
                            담당자가 누가 보냈는지 알아보기 어렵습니다.
                        </p>
                        <ol className="mt-4 space-y-2">
                            {[
                                '카카오톡 → 내 프로필 → 프로필 편집',
                                '이름과 사진을 알아볼 수 없는 것으로 변경',
                                '채널에 접수한 뒤, 처리가 끝나면 원래대로 되돌리기'
                            ].map((step, i) => (
                                <li key={step} className="flex gap-2.5 text-sm text-slate-700 leading-relaxed">
                                    <span className="flex-shrink-0 w-5 h-5 rounded-full bg-brand-600 text-white text-[11px] font-bold flex items-center justify-center mt-0.5">{i + 1}</span>
                                    {step}
                                </li>
                            ))}
                        </ol>
                        <div className="mt-5 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5">
                            <p className="text-xs text-slate-700 leading-relaxed">
                                <span className="font-bold">다만 완전한 익명은 아닙니다. </span>
                                프로필은 채널뿐 아니라 <span className="font-bold">가족·친구·동료 모두에게 함께 바뀝니다.</span>{' '}
                                예전에 이 채널과 나눈 대화가 있으면 그 이력도 그대로 이어지고,
                                글의 내용만으로 짐작될 수도 있습니다.
                            </p>
                            <p className="text-xs text-slate-700 leading-relaxed mt-2">
                                신원이 드러나면 정말 곤란한 사안이라면,
                                이름·부서를 아예 받지 않는 <span className="font-bold">대나무숲 게시판</span> 쪽이 더 안전합니다.
                                (대신 전체에게 공개되고 개별 조사로 이어지지 않습니다)
                            </p>
                        </div>
                        <button onClick={() => setView('board')} className="mt-4 bg-white border border-slate-200 text-slate-700 px-4 py-2.5 rounded-lg text-sm font-bold hover:border-brand-300 hover:text-brand-600 transition-colors flex items-center gap-2">
                            <Icon name="message-square" size={15} /> 대나무숲 게시판으로
                        </button>
                    </div>
                </div>
            );
        };

        const GuideView = ({ setView }) => {
            const channels = [
                {
                    id: 'board',
                    icon: 'message-square',
                    label: '대나무숲 게시판',
                    tagline: '구성원 모두가 봅니다',
                    tone: 'ch-brand',
                    desc: '개선 아이디어, 칭찬, 소소한 질문처럼 함께 이야기하고 싶은 주제를 자유롭게 나눕니다. 이 사이트의 기본 공간입니다.',
                    points: ['모든 구성원이 읽고 댓글', '글마다 다른 익명 표식', `신고 ${BOARD_BLIND_THRESHOLD}건이면 자동으로 가려짐`],
                    cta: '게시판 둘러보기'
                },
                {
                    id: 'complaint',
                    icon: 'shield',
                    label: '고충 접수',
                    tagline: '담당자만 봅니다',
                    // 회색이면 '운영하지 않는 창구'처럼 보인다. 잉크블루로 둔다.
                    tone: 'ch-ink',
                    desc: '괴롭힘, 부당한 업무 배분, 평가·보상 문제처럼 개별적으로 확인과 조치가 필요한 일을 접수합니다. 사내 카카오톡 채널로 연결됩니다.',
                    points: ['담당자만 열람', '담당자와 1:1 대화', '카카오톡이라 익명은 아님'],
                    cta: '고충 접수 안내'
                }
            ];

            const steps = [
                { n: '1', title: '카카오톡 채널 열기', desc: '‘고충 접수’ 메뉴의 버튼을 누르면 사내 카카오톡 채널로 연결됩니다. 별도 양식은 없습니다.' },
                { n: '2', title: '상황 남기기', desc: '언제, 어떤 일이 있었고, 어떤 조치를 바라시는지 적어주세요. 담당자가 확인 후 답변드립니다.' },
                { n: '3', title: '담당자 확인', desc: '검토 → 조사 → 조치 순으로 진행되며, 필요하면 담당자가 추가로 질문합니다.' },
                { n: '4', title: '결과 확인', desc: '진행 상황과 결과는 같은 카카오톡 대화에서 그대로 받아보실 수 있습니다.' }
            ];

            const privacy = [
                { icon: 'user-x', title: '신원을 받지 않습니다', desc: '게시판 글과 조직 진단에는 이름·부서·연락처를 수집하지 않습니다. 인원이 적은 팀에서는 부서만으로도 사람이 특정되기 때문입니다.' },
                { icon: 'key', title: '로그인이 필요 없습니다', desc: '게시판과 조직 진단은 사번이나 계정 없이 바로 쓰실 수 있습니다. 누가 접속했는지 기록하지 않습니다.' },
                { icon: 'shuffle', title: '글끼리 연결되지 않습니다', desc: '게시판 글에는 글마다 다른 익명 표식이 붙습니다. 같은 사람이 쓴 글 여러 개를 모아 글쓴이를 추정할 수 없습니다.' },
                { icon: 'eye-off', title: '진단 결과는 팀 단위로만 봅니다', desc: `개별 응답은 담당자도 한 건씩 열어보지 않습니다. 응답이 ${PULSE_MIN_N}명 미만인 팀은 응답자가 특정될 수 있어 점수를 아예 산출하지 않습니다.` }
            ];

            return (
                <div className="max-w-6xl mx-auto animate-fade-in my-4 md:my-8 space-y-5">

                    {/* 첫인상: 무엇을 하는 곳인지 한 문장 */}
                    <div className="bg-white rounded-2xl shadow-card border border-slate-100 p-6 md:p-10">
                        <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-brand-50 text-brand-700 border border-brand-100 mb-4">
                            <Icon name="lock" size={13} /> 게시판·조직 진단은 익명
                        </span>
                        <h1 className="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight leading-snug">
                            말하기 어려운 이야기를<br className="hidden md:block" /> 안전하게 꺼내는 곳
                        </h1>
                        <p className="text-sm md:text-base text-slate-600 mt-4 leading-relaxed">
                            엔코스 대나무숲은 구성원이 익명으로 이야기를 나누는 공간입니다.
                            평소 생각은 게시판에 남기고, 담당자의 확인이 필요한 일은 고충 접수를 이용해주세요.
                        </p>
                        <div className="flex flex-wrap gap-2 mt-6">
                            <button onClick={() => setView('board')} className="bg-brand-600 text-white px-5 py-3 rounded-xl text-sm font-bold hover:bg-brand-700 shadow-brand transition-colors flex items-center gap-2">
                                <Icon name="edit-3" size={16} /> 게시판 둘러보기
                            </button>
                            <button onClick={() => setView('complaint')} className="ch-ink ch-btn px-5 py-3 rounded-xl text-sm font-bold flex items-center gap-2">
                                <Icon name="shield" size={16} /> 고충 접수 안내
                            </button>
                        </div>
                    </div>

                    {/* 가장 헷갈리는 지점: 두 창구의 차이 */}
                    <div>
                        <h2 className="text-lg font-bold text-slate-800 mb-1 px-1">어디에 남길까요?</h2>
                        <p className="text-sm text-slate-500 mb-4 px-1">두 창구는 보이는 범위가 다릅니다.</p>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {channels.map(ch => (
                                <div key={ch.id} className={`${ch.tone} ch-card p-5 md:p-6 flex flex-col`}>
                                    <div className="flex items-center gap-2.5 mb-3">
                                        <span className="ch-badge w-9 h-9 rounded-lg flex items-center justify-center">
                                            <Icon name={ch.icon} size={18} />
                                        </span>
                                        <div>
                                            <p className="font-bold text-slate-900">{ch.label}</p>
                                            <p className="ch-tag text-xs font-bold">{ch.tagline}</p>
                                        </div>
                                    </div>
                                    <p className="text-sm text-slate-600 leading-relaxed">{ch.desc}</p>
                                    <ul className="mt-4 space-y-1.5 flex-1">
                                        {ch.points.map(pt => (
                                            <li key={pt} className="flex items-start gap-2 text-xs text-slate-600">
                                                <span className="ch-dot mt-1.5 w-1 h-1 rounded-full flex-shrink-0"></span>{pt}
                                            </li>
                                        ))}
                                    </ul>
                                    <button onClick={() => setView(ch.id)} className="ch-btn mt-5 w-full py-2.5 rounded-lg text-sm font-bold">
                                        {ch.cta}
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 접수 후 무슨 일이 일어나는지 */}
                    <div className="bg-white rounded-2xl shadow-card border border-slate-100 p-6 md:p-8">
