<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엔코스 대나무숲</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!--
        디자인 테마: Red & White
        - brand : 서비스 기본 색(루비 레드). 버튼/내비게이션/링크/포커스 링에 사용.
        - slate : 기본 중립색. 차가운 회색 대신 붉은기가 살짝 도는 웜 그레이로 재정의했다.
                  (마크업 전체가 slate-* 를 쓰고 있어, 여기서 한 번만 덮어쓰면 전체가 따뜻해진다.)
        - red / amber / green : 위험 · 주의 · 정상 상태를 나타내는 의미 색.
          brand 와 red 는 같은 계열이므로, 위험 상태는 '진하게 채운' 배지로 구분한다.
    -->
    <script>
        // CDN 로드가 실패해도 이 스크립트가 통째로 죽지 않도록 방어한다.
        window.tailwind = window.tailwind || {};
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#fff5f5',
                            100: '#ffe3e3',
                            200: '#ffc9c9',
                            300: '#ffa8a8',
                            400: '#ff6b6b',
                            500: '#f03e3e',
                            600: '#d92b2b',
                            700: '#b81f1f',
                            800: '#961b1b',
                            900: '#7a1a1a',
                            950: '#450a0a'
                        },
                        slate: {
                            50:  '#faf7f7',
                            100: '#f3eeee',
                            200: '#e7e0e0',
                            300: '#d3c9c9',
                            400: '#a79c9c',
                            500: '#7c7373',
                            600: '#5e5757',
                            700: '#4a4444',
                            800: '#322e2e',
                            900: '#211e1e',
                            950: '#131111'
                        }
                    },
                    boxShadow: {
                        card: '0 1px 2px rgba(33, 30, 30, 0.04), 0 8px 24px -12px rgba(150, 27, 27, 0.12)',
                        brand: '0 10px 24px -12px rgba(217, 43, 43, 0.55)'
                    }
                }
            }
        };
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, updateDoc, doc, setDoc, getDoc, getDocs, serverTimestamp, query, orderBy, where, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDm0qnGzq8P3zBBqW_4qjlMd9aq-QKrDyU",
            authDomain: "hr-manager-6635c.firebaseapp.com",
            projectId: "hr-manager-6635c",
            storageBucket: "hr-manager-6635c.firebasestorage.app",
            messagingSenderId: "796639392690",
            appId: "1:796639392690:web:6e88b74eab16b69118aaab",
            measurementId: "G-GMXXY9EPXM"

        try {
            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            window.auth = getAuth(app);
            window.firestore = { collection, onSnapshot, addDoc, deleteDoc, updateDoc, doc, setDoc, getDoc, getDocs, serverTimestamp, query, orderBy, where, limit };
            window.firebaseAuth = { signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword, signOut };
        } catch (e) { console.error("Firebase Init Error:", e); }
    </script>

    <style>
        /* ── 디자인 토큰 (Red & White) ───────────────────────────────── */
        :root {
            --brand-50:  #fff5f5;
            --brand-100: #ffe3e3;
            --brand-200: #ffc9c9;
            --brand-500: #f03e3e;
            --brand-600: #d92b2b;
            --brand-700: #b81f1f;
            --ink:       #211e1e;
            --ink-soft:  #7c7373;
            --line:      #e7e0e0;
            --surface:   #ffffff;
            --canvas:    #fbf8f8;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            color: var(--ink);
            /* 흰 바탕 위로 아주 옅은 레드 글로우를 깔아 화면 전체 톤을 잡는다. */
            background-color: var(--canvas);
            background-image:
                radial-gradient(900px 420px at 100% -8%, rgba(217, 43, 43, 0.07), transparent 60%),
                radial-gradient(720px 360px at -10% 0%, rgba(217, 43, 43, 0.045), transparent 62%);
            background-attachment: fixed;
        }

        ::selection { background: var(--brand-200); color: var(--brand-700); }

        /* ── 사이드바 ────────────────────────────────────────────────── */
        .sidebar-item {
            position: relative;
            transition: background-color 0.18s ease, color 0.18s ease;
        }
        .sidebar-item:hover { background-color: var(--brand-50); color: var(--brand-600); }
        .sidebar-item.active {
            background-color: var(--brand-50);
            color: var(--brand-700);
            font-weight: 700;
        }
        /* 활성 항목은 왼쪽 레드 바로 표시한다. */
        .sidebar-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            border-radius: 0 3px 3px 0;
            background: var(--brand-600);
        }

        /* ── 모션 ────────────────────────────────────────────────────── */
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .chart-path { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2s ease-out forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }

        /* ── 폼 요소 ─────────────────────────────────────────────────── */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; /* Larger touch target for mobile */
            width: 20px;
            border-radius: 50%;
            background: var(--brand-600);
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--brand-600);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--line);
            border-radius: 2px;
        }
        input[type=checkbox], input[type=radio] { accent-color: var(--brand-600); }

        /* 브라우저 기본 포커스 링도 브랜드 색으로 맞춘다. */
        :where(input, select, textarea, button, a):focus-visible {
            outline: 2px solid var(--brand-500);
            outline-offset: 2px;
        }

        /* ── 스크롤바 ────────────────────────────────────────────────── */
        * { scrollbar-color: var(--brand-200) transparent; scrollbar-width: thin; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--brand-200);
            border: 3px solid transparent;
            background-clip: content-box;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-500); background-clip: content-box; }

        .action-item:hover .action-tools { opacity: 1; }
        .action-tools { opacity: 0; transition: opacity 0.2s; }
        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            .action-tools { opacity: 1; } /* Always show tools on mobile since no hover */
        }

        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; background-image: none; }
            #root { margin: 0; padding: 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : "hr_dashboard";
        
        const Icon = ({ name, size = 20, className = "", color }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (!ref.current || !window.lucide) return;
                const iconName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                const iconData = window.lucide.icons[iconName];
                if (!iconData) return;
                const svgElement = window.lucide.createElement(iconData);
                svgElement.setAttribute('width', size);
                svgElement.setAttribute('height', size);
                if (className) svgElement.setAttribute('class', `lucide lucide-${name} ${className}`);
                if (color) svgElement.setAttribute('stroke', color);
                ref.current.innerHTML = '';
                ref.current.appendChild(svgElement);
            }, [name, size, className, color]);
            return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }} />;
        };

        const Loading = () => (
            <div className="flex justify-center items-center h-full min-h-[400px]">
                <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600"></div>
            </div>
        );

        const Badge = ({ type, text }) => {
            // brand 와 위험 색이 같은 레드 계열이므로, 위험 단계만 '꽉 채운' 배지로 구분한다.
            const styles = {
                critical: "bg-red-600 text-white border-red-600 shadow-sm",
                warning: "bg-amber-100 text-amber-800 border-amber-200",
                good: "bg-green-100 text-green-700 border-green-200",
                neutral: "bg-slate-100 text-slate-700 border-slate-200"
            };
            return <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold border ${styles[type] || styles.neutral}`}>{text}</span>;
        };

        const getFormattedPeriod = (year, month) => `${year}-${String(month).padStart(2, '0')}`;

        // ── 익명 접수 조회 ────────────────────────────────────────────
        // 신원 정보를 받지 않는 대신, 접수번호 + 신고자가 정한 PIN 으로 본인 건을 찾는다.
        // PIN 원문은 저장하지 않고 SHA-256 해시만 남긴다.
        const LOOKUP_SALT = 'bambooforest-lookup-v1';

        // ── 접수번호 ──────────────────────────────────────────────────
        // 예전 형식(GC-202602-410381)은 16자에 의미 없는 숫자라 외우기도, 받아
        // 적기도 어려웠다. 앞의 'GC-202602-' 는 신고자에게 아무 정보도 주지 않는다.
        // 대신 자연물 낱말 두 개와 네 자리 숫자를 쓴다. 눈으로 한 번 보면 남고,
        // 전화로 불러주기도 쉽다. (예: 푸른대나무-7421)
        //
        // 조합 수는 24 × 24 × 10000 = 약 576만. 게다가 문서 ID 는 접수번호와
        // PIN 을 함께 해시한 값이라, 실제로 겹치려면 둘 다 같아야 한다.
        // 그래도 덮어쓰기를 원천 차단하려고 저장 직전에 빈자리인지 확인한다.
        // 접수번호 앞머리는 회사명으로 고정한다. 어디서 온 번호인지 바로 알아보고,
        // 사내 문서나 메일에 적어도 자연스럽다.
        const CASE_PREFIX = '엔코스';

        // 뒤 숫자는 다섯 자리를 쓴다. 네 자리(1만 가지)면 접수가 100건쯤 쌓였을 때
        // 같은 번호가 두 건 나올 확률이 절반에 가까워, 관리자 목록에서 헷갈린다.
        // 한 자리를 늘리면 10만 가지가 되어 그 위험이 10분의 1로 준다.
        const CASE_DIGITS = 5;

        const makeCaseNo = () => {
            const buf = new Uint32Array(1);
            window.crypto.getRandomValues(buf);
            const max = 10 ** CASE_DIGITS;
            return `${CASE_PREFIX}-${String(buf[0] % max).padStart(CASE_DIGITS, '0')}`;
        };

        // 하이픈을 빼거나 공백을 넣어 입력해도 찾을 수 있게 후보를 만든다.
        // 기존 GC- 형식 접수번호의 해시가 달라지면 안 되므로, 정규화를 강제하지 않고
        // 입력 원본을 먼저 시도한 뒤 변형을 덧붙인다.
        const caseNoCandidates = (raw) => {
            const trimmed = String(raw).trim();
            const compact = trimmed.replace(/\s+/g, '');
            const forms = [trimmed, compact];
            const m = compact.match(/^([가-힣]+)-?(\d{4,6})$/);
            if (m) forms.push(`${m[1]}-${m[2]}`);
            return [...new Set(forms.filter(Boolean))];
        };

        const makeLookupHash = async (caseNo, pin) => {
            if (!window.crypto?.subtle) {
                // crypto.subtle 은 HTTPS(또는 localhost)에서만 동작한다.
                throw new Error('보안 연결(HTTPS)에서만 조회 기능을 사용할 수 있습니다.');
            }
            const data = new TextEncoder().encode(`${LOOKUP_SALT}:${String(caseNo).trim().toUpperCase()}:${String(pin).trim()}`);
            const buf = await window.crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        };

        const appendThreadMessage = (caseData, by, text) => {
            const thread = Array.isArray(caseData?.thread) ? caseData.thread : [];
            return [...thread, { by, text: String(text).trim(), at: new Date().toISOString() }];
        };

        // 신고자가 마지막으로 말을 걸었고 아직 답이 없으면 '답변 대기' 상태로 본다.
        const isAwaitingReply = (caseData) => {
            const thread = Array.isArray(caseData?.thread) ? caseData.thread : [];
            return thread.length > 0 && thread[thread.length - 1].by === 'reporter';
        };

        // 신고자 화면과 관리자 화면이 같은 대화를 쓰므로 컴포넌트를 공유한다.
        const CaseThread = ({ thread, viewer, onSend, emptyText }) => {
            const [draft, setDraft] = useState("");
            const [sending, setSending] = useState(false);
            const messages = Array.isArray(thread) ? thread : [];

            const submit = async (e) => {
                e.preventDefault();
                const text = draft.trim();
                if (!text || sending) return;
                setSending(true);
                try {
                    await onSend(text);
                    setDraft("");
                } catch (err) {
                    alert("전송 실패: " + err.message);
                } finally {
                    setSending(false);
                }
            };

            return (
                <div>
                    <div className="space-y-2 max-h-[280px] overflow-y-auto mb-3">
                        {messages.length === 0 ? (
                            <p className="text-sm text-slate-500">{emptyText}</p>
                        ) : messages.map((m, idx) => {
                            const mine = m.by === viewer;
                            return (
                                <div key={`${m.at}-${idx}`} className={`flex ${mine ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[85%] rounded-xl px-3.5 py-2.5 border ${mine ? 'bg-brand-600 text-white border-brand-600' : 'bg-white text-slate-700 border-slate-200'}`}>
                                        <p className={`text-[11px] font-bold mb-1 ${mine ? 'text-white/80' : 'text-slate-400'}`}>
                                            {m.by === 'admin' ? '담당자' : '신고자'} · {formatDateTime(m.at)}
                                        </p>
                                        <p className="text-sm whitespace-pre-wrap break-words leading-relaxed">{m.text}</p>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    <form onSubmit={submit} className="flex gap-2">
                        <input
                            value={draft}
                            onChange={e => setDraft(e.target.value)}
                            placeholder={viewer === 'admin' ? '신고자에게 보낼 메시지…' : '담당자에게 보낼 메시지…'}
                            className="flex-1 border border-slate-200 rounded-lg px-3 py-2.5 text-sm bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200"
                        />
                        <button type="submit" disabled={!draft.trim() || sending} className="bg-brand-600 text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                            {sending ? '전송 중' : '보내기'}
                        </button>
                    </form>
                </div>
            );
        };

        const PULSE_FIELDS = [
            { id: 'workload', label: '업무부하', desc: '업무량과 마감이 감당 가능한 수준입니다.', category: 'env' },
            { id: 'clarity', label: '역할명확성', desc: '내 역할과 목표, 업무 우선순위가 명확합니다.', category: 'env' },
            { id: 'relationship', label: '협업관계', desc: '동료와의 협업과 소통이 원활합니다.', category: 'people' },
            { id: 'leadership', label: '리더십', desc: '리더가 방향, 우선순위, 피드백을 명확히 제공합니다.', category: 'people' },
            { id: 'safety', label: '심리적 안전감', desc: '불이익 걱정 없이 의견이나 문제를 말할 수 있습니다.', category: 'people' },
            { id: 'growth', label: '성장감', desc: '현재 업무가 역량 성장과 커리어에 도움이 됩니다.', category: 'growth' },
            { id: 'fairness', label: '공정성', desc: '평가, 보상, 업무배분이 공정하다고 느낍니다.', category: 'growth' },
            { id: 'engagement', label: '몰입/추천의향', desc: '이 조직에서 계속 일하고 싶고 지인에게 추천할 수 있습니다.', category: 'engagement' }
        ];

        const PULSE_CATEGORIES = [
            { id: 'env', label: '업무 환경' },
            { id: 'people', label: '관계·리더십' },
            { id: 'growth', label: '성장·공정성' },
            { id: 'engagement', label: '몰입도' }
        ];

        const DEFAULT_SURVEY_DATA = PULSE_FIELDS.reduce((acc, field) => ({ ...acc, [field.id]: "3" }), { teamId: "", keywords: "" });
        const getPulseScore = (data, key) => {
            const parsed = Number(data?.[key]);
            return Number.isFinite(parsed) && parsed > 0 ? parsed : 3;
        };
        const scoreToPercent = (score) => Math.round(((score - 1) / 4) * 100);
        const scoreToRiskPercent = (score) => Math.round(((5 - score) / 4) * 100);

        // --- Shared Logic for Auto Calculation ---
        const calculatePeriodStats = async (db, period, teamsList, silent = false) => {
            const { collection, query, where, getDocs, getDoc, doc, setDoc, updateDoc, serverTimestamp } = window.firestore;
            
            try {
                let effectiveTeams = Array.isArray(teamsList) ? teamsList : [];
                if (effectiveTeams.length === 0) {
                    const teamQ = query(
                        collection(db, 'artifacts', APP_ID, 'public', 'data', 'team_stats'),
                        where("period", "==", period)
                    );
                    const teamSnap = await getDocs(teamQ);
                    effectiveTeams = teamSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                }

                const q = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'survey_responses'));
                const querySnapshot = await getDocs(q);
                const currentDocs = querySnapshot.docs.filter(d => d.data().period === period);
                const emptyMetrics = {
                    burnout: { label: "번아웃 리스크", value: "-", diff: "0" },
                    safety: { label: "심리적 안전감", value: "-", diff: "0" },
                    enps: { label: "몰입도 (eNPS)", value: "-", diff: "0" },
                    growth: { label: "성장 비전 공감", value: "-", diff: "0" }
                };

                if (currentDocs.length === 0) {
                    await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'global_stats', period), emptyMetrics);

                    const chartRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'chart_stats', 'current');
                    const chartSnap = await getDoc(chartRef);
                    const currentTrend = chartSnap.exists() ? (chartSnap.data().trend || []) : [];
                    await setDoc(chartRef, { trend: currentTrend.filter(t => t.label !== period) }, { merge: true });

                    const resetPromises = effectiveTeams.map((team) =>
                        updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'team_stats', team.id), {
                            status: '양호',
                            workload: '적정',
                            conflict: '낮음',
                            leadership: '보통',
                            diagnosisScores: {},
                            diagnosisDrivers: [],
                            keywords: [],
                            calculatedAt: serverTimestamp()
                        })
                    );
                    await Promise.all(resetPromises);

                    if(!silent) alert(`현재 기간(${period})에 데이터가 없어 통계가 초기화되었습니다.`);
                    return;
                }

                const totals = PULSE_FIELDS.reduce((acc, field) => ({ ...acc, [field.id]: 0 }), {});
                currentDocs.forEach(d => {
                    const data = d.data();
                    PULSE_FIELDS.forEach(field => {
                        totals[field.id] += getPulseScore(data, field.id);
                    });
                });
                const count = currentDocs.length;

                const averages = PULSE_FIELDS.reduce((acc, field) => ({ ...acc, [field.id]: totals[field.id] / count }), {});
                const burnout = scoreToRiskPercent(averages.workload);
                const safety = averages.safety.toFixed(1);
                const growth = scoreToPercent(averages.growth);
                
                let enps = Math.round((averages.engagement - 3) * 50);
                let enpsStr = String(enps);
                if(enps > 0) enpsStr = "+" + enps;

                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'global_stats', period), {
                    burnout: { label: "번아웃 리스크", value: `${burnout}%`, diff: "0" },
                    safety: { label: "심리적 안전감", value: String(safety), diff: "0" },
                    enps: { label: "몰입도 (eNPS)", value: enpsStr, diff: "0" },
                    growth: { label: "성장 비전 공감", value: `${growth}%`, diff: "0" }
                });

                const chartRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'chart_stats', 'current');
                const chartSnap = await getDoc(chartRef);
                let currentTrend = [];
                if (chartSnap.exists()) {
                    currentTrend = chartSnap.data().trend || [];
                }
                
                const newTrendItem = { label: period, value: String(enps) };
                
                const updatedTrend = [...currentTrend.filter(t => t.label !== period), newTrendItem].sort((a,b) => a.label.localeCompare(b.label));
                await setDoc(chartRef, { trend: updatedTrend }, { merge: true });

                const updatePromises = effectiveTeams.map(async (team) => {
                    const teamResponses = currentDocs.filter(d => d.data().teamId === team.id);
                    if(teamResponses.length === 0) {
                        await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'team_stats', team.id), {
                            status: '양호',
                            workload: '적정',
                            conflict: '낮음',
                            leadership: '보통',
                            diagnosisScores: {},
                            diagnosisDrivers: [],
                            keywords: [],
                            calculatedAt: serverTimestamp()
                        });
                        return;
                    }

                    const teamTotals = PULSE_FIELDS.reduce((acc, field) => ({ ...acc, [field.id]: 0 }), {});
                    teamResponses.forEach(d => {
                        const dat = d.data();
                        PULSE_FIELDS.forEach(field => {
                            teamTotals[field.id] += getPulseScore(dat, field.id);
                        });
                    });
                    const tc = teamResponses.length;
                    const diagnosisScores = PULSE_FIELDS.reduce((acc, field) => ({
                        ...acc,
                        [field.id]: Number((teamTotals[field.id] / tc).toFixed(1))
                    }), {});
                    const teamKeywords = [...new Set(
                        teamResponses
                            .flatMap(d => String(d.data().keywords || '').split(','))
                            .map(k => k.trim())
                            .filter(Boolean)
                    )];

                    const diagnosisDrivers = [];
                    if (diagnosisScores.workload <= 2.5) diagnosisDrivers.push('업무부하');
                    if (diagnosisScores.relationship <= 2.5) diagnosisDrivers.push('협업관계');
                    if (diagnosisScores.leadership <= 2.5) diagnosisDrivers.push('리더십');
                    if (diagnosisScores.safety <= 2.5) diagnosisDrivers.push('심리적 안전감');
                    if (diagnosisScores.growth <= 2.5) diagnosisDrivers.push('성장감');
                    if (diagnosisScores.fairness <= 2.5) diagnosisDrivers.push('공정성');
                    if (diagnosisScores.clarity <= 2.5) diagnosisDrivers.push('역할명확성');
                    if (diagnosisScores.engagement <= 2.5) diagnosisDrivers.push('몰입/추천의향');

                    let newStatus = '양호';
                    if (diagnosisDrivers.length >= 3 || diagnosisScores.engagement <= 2.2) newStatus = '심각';
                    else if (diagnosisDrivers.length > 0) newStatus = '위험';

                    await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'team_stats', team.id), {
                        status: newStatus,
                        workload: diagnosisScores.workload <= 2.5 ? '과부하' : '적정',
                        conflict: diagnosisScores.relationship <= 2.5 ? '높음' : '낮음',
                        leadership: diagnosisScores.leadership <= 2.5 ? '부족' : '보통',
                        safetyStatus: diagnosisScores.safety <= 2.5 ? '낮음' : '양호',
                        growthStatus: diagnosisScores.growth <= 2.5 ? '정체' : '양호',
                        fairnessStatus: diagnosisScores.fairness <= 2.5 ? '주의' : '양호',
                        clarityStatus: diagnosisScores.clarity <= 2.5 ? '불명확' : '양호',
                        diagnosisScores,
                        diagnosisDrivers,
                        keywords: teamKeywords,
                        calculatedAt: serverTimestamp()
                    });
                });
                await Promise.all(updatePromises);

                if(!silent) alert(`데이터 산출 완료! (총 ${count}건 반영)\n팀 상태가 자동 업데이트되었습니다.`);
                console.log(`[Auto-Calc] Metrics updated for ${period}. Count: ${count}`);

            } catch(e) {
                console.error("Auto Calc Error:", e);
                if(!silent) alert("자동 산출 중 오류: " + e.message);
            }
        };

        // 관리자 인증은 Firebase Auth 이메일 로그인으로 처리한다.
        // 예전에는 비밀번호 해시를 브라우저에서 상수와 비교했는데, 그 방식은
        // 콘솔에서 우회할 수 있을 뿐 아니라 Firestore 규칙이 관리자를 구분할
        // 근거가 없어서 고충 내역을 잠글 수가 없었다.
        // 이제 관리자 여부는 admins/{uid} 문서의 존재로 판정하고, 같은 조건을
        // 보안 규칙에서도 검사한다.
        const AdminLoginModal = ({ onClose, onSuccess }) => {
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [error, setError] = useState("");
            const [busy, setBusy] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (busy) return;
                setError("");
                setBusy(true);
                try {
                    const cred = await window.firebaseAuth.signInWithEmailAndPassword(window.auth, email.trim(), password);
                    const adminDoc = await window.firestore.getDoc(
                        window.firestore.doc(window.db, 'admins', cred.user.uid)
                    );
                    if (!adminDoc.exists()) {
                        // 로그인은 됐지만 관리자 명단에 없는 계정. 익명으로 되돌린다.
                        await window.firebaseAuth.signOut(window.auth);
                        await window.firebaseAuth.signInAnonymously(window.auth);
                        setError("관리자 권한이 없는 계정입니다.");
                        return;
                    }
                    onSuccess();
                    onClose();
                } catch (err) {
                    const code = err?.code || "";
                    setError(
                        code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")
                            ? "이메일 또는 비밀번호가 올바르지 않습니다."
                            : code.includes("too-many-requests")
                                ? "시도가 너무 잦습니다. 잠시 후 다시 시도해주세요."
                                : "로그인에 실패했습니다. " + (err?.message || "")
                    );
                } finally {
                    setBusy(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[100] p-4 fade-in backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full p-8 border border-slate-200">
                        <div className="text-center mb-6">
                            <div className="w-12 h-12 bg-brand-50 border border-brand-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                <Icon name="lock" size={24} className="text-brand-600" />
                            </div>
                            <h2 className="text-xl font-bold text-slate-800">관리자 인증</h2>
                            <p className="text-xs text-slate-500 mt-1.5">HR 담당자 계정으로 로그인해주세요.</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <input
                                type="email"
                                value={email}
                                onChange={(e) => { setEmail(e.target.value); setError(""); }}
                                className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200"
                                placeholder="이메일"
                                autoComplete="username"
                                autoFocus
                                required
                            />
                            <input
                                type="password"
                                value={password}
                                onChange={(e) => { setPassword(e.target.value); setError(""); }}
                                className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200"
                                placeholder="비밀번호"
                                autoComplete="current-password"
                                required
                            />
                            {error && <p className="text-red-700 text-xs text-center font-medium bg-red-50 border border-red-100 rounded-lg px-3 py-2">{error}</p>}
                            <div className="flex gap-2 pt-1">
                                <button type="button" onClick={onClose} className="flex-1 py-3 font-bold text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors">취소</button>
                                <button type="submit" disabled={busy} className="flex-1 py-3 font-bold text-white bg-brand-600 rounded-lg hover:bg-brand-700 shadow-brand transition-colors disabled:opacity-50">
                                    {busy ? "확인 중…" : "로그인"}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const ActionBoardWidget = ({ user }) => {
            const [actions, setActions] = useState([]);
            const [input, setInput] = useState("");
            const [editingId, setEditingId] = useState(null);
            const [editText, setEditText] = useState("");
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);

            useEffect(() => { 
                if(!user || !window.db) return; 
                const q = window.firestore.query(window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'action_items')); 
                return window.firestore.onSnapshot(q, (snapshot) => { 
                    const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    setActions(list); 
                }); 
            }, [user]);

            const handleAdd = async (e) => { 
                e.preventDefault(); if(!input.trim()) return; 
                await window.firestore.addDoc(window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'action_items'), { text: input, completed: false, createdAt: window.firestore.serverTimestamp(), createdBy: user.uid }); setInput(""); 
            };
            const handleDelete = async (id) => { await window.firestore.deleteDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'action_items', id)); setDeleteConfirmId(null); };
            const handleRequestDelete = (id) => { if (deleteConfirmId === id) { handleDelete(id); } else { setDeleteConfirmId(id); setTimeout(() => setDeleteConfirmId(null), 3000); } };
            const toggleStatus = async (action) => { await window.firestore.updateDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'action_items', action.id), { completed: !action.completed }); };
            const startEdit = (action) => { setEditingId(action.id); setEditText(action.text); };
            const saveEdit = async () => { if(!editText.trim()) return; await window.firestore.updateDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'action_items', editingId), { text: editText }); setEditingId(null); setEditText(""); };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 h-full flex flex-col">
                    <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-xl">
                        <h3 className="font-bold text-slate-800 text-sm">실행 과제 (Action Items)</h3>
                        <div className="flex gap-2"><span className="text-xs bg-white px-2 py-1 rounded border text-slate-600">전체: {actions.length}건</span><span className="text-xs bg-brand-100 text-brand-700 px-2 py-1 rounded border border-brand-200">진행 중: {actions.filter(a => !a.completed).length}건</span></div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-2 max-h-[300px]">
                        {actions.length === 0 && <p className="text-xs text-slate-400 text-center py-4">등록된 실행 과제가 없습니다.</p>}
                        {actions.map(action => (
                            <div key={action.id} className={`action-item flex gap-3 items-start p-3 border rounded-lg transition-all ${action.completed ? 'bg-slate-50 border-slate-100' : 'bg-white border-slate-200 hover:border-brand-300'}`}>
                                <button onClick={() => toggleStatus(action)} className={`mt-0.5 flex-shrink-0 w-4 h-4 rounded border flex items-center justify-center transition-colors ${action.completed ? 'bg-green-500 border-green-500' : 'bg-white border-slate-300 hover:border-brand-400'}`} title={action.completed ? "완료됨 (다시 클릭하여 취소)" : "완료 처리"}>{action.completed && <Icon name="check" size={12} className="text-white" />}</button>
                                <div className="flex-1 min-w-0">{editingId === action.id ? (<div className="flex gap-2 items-center animate-fade-in"><input value={editText} onChange={e => setEditText(e.target.value)} className="flex-1 text-xs border border-brand-300 rounded px-2 py-1 outline-none shadow-sm" autoFocus onKeyDown={e => { if(e.key === 'Enter') saveEdit(); else if(e.key === 'Escape') setEditingId(null); }} /><button onClick={saveEdit} className="text-green-600 hover:bg-green-50 p-1 rounded"><Icon name="check" size={14} /></button><button onClick={() => setEditingId(null)} className="text-red-500 hover:bg-red-50 p-1 rounded"><Icon name="x" size={14} /></button></div>) : (<p className={`text-xs break-words leading-relaxed cursor-pointer select-none ${action.completed ? 'text-slate-400 line-through' : 'text-slate-700'}`} onClick={() => startEdit(action)} title="클릭하여 수정">{action.text}</p>)}</div>
                                {editingId !== action.id && (<div className="action-tools flex gap-1"><button onClick={() => startEdit(action)} className="text-slate-400 hover:text-brand-500 p-1 rounded hover:bg-brand-50 transition-colors" title="수정"><Icon name="pencil" size={14} /></button><button onClick={() => handleRequestDelete(action.id)} className={`p-1 rounded transition-colors ${deleteConfirmId === action.id ? 'bg-red-100 text-red-600' : 'text-slate-400 hover:text-red-500 hover:bg-red-50'}`} title={deleteConfirmId === action.id ? "삭제 확인 (한번 더 클릭)" : "삭제"}><Icon name={deleteConfirmId === action.id ? "alert-circle" : "trash-2"} size={14} /></button></div>)}
                            </div>
                        ))}
                    </div>
                    <form onSubmit={handleAdd} className="p-3 border-t bg-slate-50 rounded-b-xl flex gap-2"><input value={input} onChange={e => setInput(e.target.value)} placeholder="새로운 실행 과제 입력..." className="flex-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:border-brand-400 bg-white" /><button className="bg-brand-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-brand-700 transition-colors shadow-sm">추가</button></form>
                </div>
            );
        };

        const COMPLAINT_CATEGORIES = [
            { value: "workload", label: "업무량/근로시간" },
            { value: "leadership", label: "상급자/리더십" },
            { value: "relationship", label: "동료관계/조직문화" },
            { value: "harassment", label: "직장 내 괴롭힘 의심" },
            { value: "sexual", label: "성희롱/차별 가능성" },
            { value: "safety", label: "안전/건강 위험" },
            { value: "pay", label: "임금/보상/평가" },
            { value: "other", label: "기타" }
        ];

        const URGENCY_OPTIONS = [
            { value: "low", label: "낮음" },
            { value: "normal", label: "보통" },
            { value: "high", label: "높음" },
            { value: "critical", label: "긴급" }
        ];

        const CASE_STATUS_OPTIONS = ["접수", "검토중", "조사중", "조치중", "종결", "보류"];

        const getTeamName = (teamStats, teamId) => {
            const team = (teamStats || []).find(t => t.id === teamId);
            return team ? team.name : "미지정";
        };

        const getCategoryLabel = (value) => COMPLAINT_CATEGORIES.find(c => c.value === value)?.label || value || "-";
        const getUrgencyLabel = (value) => URGENCY_OPTIONS.find(u => u.value === value)?.label || value || "-";

        const formatDateTime = (value) => {
            if (!value) return "-";
            if (value.seconds) return new Date(value.seconds * 1000).toLocaleString();
            // 처리 이력·대화는 ISO 문자열로 저장되므로 사람이 읽는 형식으로 바꿔준다.
            if (typeof value === "string") {
                const parsed = new Date(value);
                if (!Number.isNaN(parsed.getTime())) return parsed.toLocaleString();
            }
            return String(value);
        };

        const assessComplaintRisk = (data) => {
            const flags = [];
            let score = 0;
            if (["harassment", "sexual", "safety"].includes(data.category)) {
                score += 35;
                flags.push("법정/보호조치 검토 필요");
            }
            if (data.urgency === "critical") {
                score += 35;
                flags.push("긴급 대응");
            } else if (data.urgency === "high") {
                score += 20;
                flags.push("우선 검토");
            }
            if (data.protectionRequest === "yes") {
                score += 25;
                flags.push("보호조치 요청");
            }
            if (String(data.details || "").length >= 300) {
                score += 5;
                flags.push("상세 진술");
            }
            const riskLevel = score >= 70 ? "high" : score >= 35 ? "medium" : "low";
            return { riskScore: score, riskLevel, riskFlags: flags };
        };

        const RiskBadge = ({ level }) => {
            const map = {
                high: "bg-red-600 text-white border-red-600 shadow-sm",
                medium: "bg-amber-100 text-amber-700 border-amber-200",
                low: "bg-green-100 text-green-700 border-green-200"
            };
            const label = level === "high" ? "높음" : level === "medium" ? "보통" : "낮음";
            return <span className={`px-2.5 py-1 rounded-full text-xs font-bold border ${map[level] || map.low}`}>리스크 {label}</span>;
        };

        const SurveyView = ({ teamStats, currentPeriod, mode }) => {
            const activeTab = mode === "pulse-survey" ? "pulse" : "complaint";
            const [surveyData, setSurveyData] = useState({ ...DEFAULT_SURVEY_DATA });
            const [copied, setCopied] = useState(false);
            const [complaintData, setComplaintData] = useState({
                reporterMode: "anonymous",
                reporterName: "",
                contact: "",
                teamId: "",
                category: "workload",
                urgency: "normal",
                incidentDate: "",
                relatedParty: "",
                subject: "",
                details: "",
                desiredAction: "",
                protectionRequest: "no",
                allowContact: "no",
                lookupPin: "",
                privacyConsent: false
            });
            const [submitted, setSubmitted] = useState(null);
            const [keywordInput, setKeywordInput] = useState("");
            const [touchedFields, setTouchedFields] = useState({});
            const [pulseComments, setPulseComments] = useState({});
            const pulseProgress = useMemo(() => {
                const touchedCount = PULSE_FIELDS.filter(f => touchedFields[f.id]).length;
                const total = PULSE_FIELDS.length + 1; // +1 for 소속 부서
                const done = touchedCount + (surveyData.teamId ? 1 : 0);
                return { done, total, percent: Math.round((done / total) * 100) };
            }, [touchedFields, surveyData.teamId]);
            const keywordList = useMemo(() => {
                const items = String(surveyData.keywords || "")
                    .split(',')
                    .map(k => k.trim())
                    .filter(Boolean);
                return [...new Set(items)];
            }, [surveyData.keywords]);

            const setKeywordList = (nextList) => {
                const cleaned = [...new Set(nextList.map(k => String(k || '').trim()).filter(Boolean))];
                setSurveyData(prev => ({ ...prev, keywords: cleaned.join(', ') }));
            };

            const addKeywordFromInput = () => {
                const v = String(keywordInput || '').trim();
                if (!v) return;
                setKeywordList([...keywordList, v]);
                setKeywordInput("");
            };

            const removeKeyword = (target) => {
                setKeywordList(keywordList.filter(k => k !== target));
            };

            const handleSurveySubmit = async (e) => {
                e.preventDefault();
                if(!surveyData.teamId) return alert("소속 팀을 선택해주세요.");
                try {
                    const lowScoreComments = PULSE_FIELDS.reduce((acc, field) => {
                        const score = Number(surveyData[field.id]);
                        const note = String(pulseComments[field.id] || '').trim();
                        if (score <= 2 && note) acc[field.id] = note;
                        return acc;
                    }, {});
                    await window.firestore.addDoc(window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'survey_responses'), {
                        teamId: surveyData.teamId,
                        period: currentPeriod,
                        ...PULSE_FIELDS.reduce((acc, field) => ({ ...acc, [field.id]: Number(surveyData[field.id]) }), {}),
                        keywords: surveyData.keywords, // Added to save raw keywords with response
                        comments: lowScoreComments,
                        createdAt: window.firestore.serverTimestamp()
                    });

                    await calculatePeriodStats(window.db, currentPeriod, teamStats, true); 

                    setSubmitted({ type: "survey" });
                } catch(e) { console.error(e); alert("제출 오류: " + e.message); }
            };

            const resetComplaintForm = () => {
                setComplaintData({
                    reporterMode: "anonymous",
                    reporterName: "",
                    contact: "",
                    teamId: "",
                    category: "workload",
                    urgency: "normal",
                    incidentDate: "",
                    relatedParty: "",
                    subject: "",
                    details: "",
                    desiredAction: "",
                    protectionRequest: "no",
                    allowContact: "no",
                    lookupPin: "",
                    privacyConsent: false
                });
            };

            const handleComplaintSubmit = async (e) => {
                e.preventDefault();
                if (complaintData.reporterMode === "named" && !complaintData.teamId) return alert("소속 부서를 선택해주세요.");
                if (!complaintData.subject.trim()) return alert("제목을 입력해주세요.");
                if (!complaintData.details.trim()) return alert("상세 내용을 입력해주세요.");
                if (complaintData.reporterMode === "named" && !complaintData.reporterName.trim()) return alert("기명 접수 시 성명을 입력해주세요.");
                if (!/^[0-9]{4,8}$/.test(complaintData.lookupPin)) return alert("조회 PIN을 숫자 4~8자리로 입력해주세요.");
                if (!complaintData.privacyConsent) return alert("개인정보 수집·이용 안내 확인이 필요합니다.");

                const risk = assessComplaintRisk(complaintData);

                // PIN 원문은 절대 저장하지 않는다. 해시만 남기고 폼 데이터에서 걷어낸다.
                const { lookupPin, ...complaintFields } = complaintData;

                // 접수번호와 PIN 이 모두 겹치면 같은 문서 ID 가 되어 덮어쓰기가 난다.
                // 확률은 극히 낮지만 기존 접수 건이 사라지는 사고라, 빈자리를 확인하고 쓴다.
                let caseNo, lookupHash;
                try {
                    const casesPath = ['artifacts', APP_ID, 'public', 'data', 'complaint_cases'];
                    for (let attempt = 0; attempt < 5; attempt++) {
                        caseNo = makeCaseNo();
                        lookupHash = await makeLookupHash(caseNo, lookupPin);
                        const taken = await window.firestore.getDoc(
                            window.firestore.doc(window.db, ...casesPath, lookupHash)
                        );
                        if (!taken.exists()) break;
                        lookupHash = null;
                    }
                    if (!lookupHash) return alert("접수번호 생성에 실패했습니다. 잠시 후 다시 시도해주세요.");
                } catch (err) {
                    return alert(err.message);
                }

                const payload = {
                    // 문서 ID 자체를 lookupHash 로 쓴다. 그래야 보안 규칙에서
                    // "ID 를 아는 사람만 get 허용, 목록 조회(list)는 관리자만" 을 표현할 수 있다.
                    // 필드로 갖고 있으면 결국 조회를 위해 목록 권한을 열어줘야 한다.
                    ...complaintFields,
                    thread: [],
                    caseNo,
                    period: currentPeriod,
                    teamNameSnapshot: getTeamName(teamStats, complaintData.teamId),
                    status: "접수",
                    handler: "",
                    adminMemo: "",
                    outcome: "",
                    riskScore: risk.riskScore,
                    riskLevel: risk.riskLevel,
                    riskFlags: risk.riskFlags,
                    history: [
                        { at: new Date().toISOString(), actor: "구성원", action: "고충 접수", note: "신규 접수" }
                    ],
                    createdAt: window.firestore.serverTimestamp(),
                    updatedAt: window.firestore.serverTimestamp()
                };
                try {
                    await window.firestore.setDoc(
                        window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'complaint_cases', lookupHash),
                        payload
                    );
                    setSubmitted({ type: "complaint", caseNo, pin: lookupPin, riskLevel: risk.riskLevel });
                    resetComplaintForm();
                } catch(e) {
                    console.error(e);
                    alert("접수 오류: " + e.message);
                }
            };

            if(submitted) return (
                <div className="flex flex-col items-center justify-center h-full p-4 md:p-8 text-center animate-fade-in">
                    <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-4"><Icon name="check" size={32} className="text-green-600" /></div>
                    <h2 className="text-2xl font-bold text-slate-800 mb-2">{submitted.type === "complaint" ? "접수 완료" : "제출 완료"}</h2>
                    <p className="text-slate-500 mb-6">{submitted.type === "complaint" ? "고충·의견이 관리자 처리함에 접수되었습니다." : "소중한 의견이 안전하게 저장되었습니다."}</p>

                    {submitted.type === "complaint" && (
                        <div className="w-full max-w-md text-left">
                            {/* 이 화면을 벗어나면 접수번호를 다시 볼 수 없으므로 최대한 눈에 띄게 안내한다. */}
                            <div className="bg-white border-2 border-brand-300 rounded-2xl p-5 shadow-card">
                                <p className="text-xs font-bold text-brand-700 mb-3">아래 정보를 반드시 저장해주세요</p>
                                <div className="flex items-center justify-between gap-3 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 mb-2">
                                    <div className="min-w-0">
                                        <p className="text-[11px] text-slate-500 font-bold">접수번호</p>
                                        <p className="text-lg font-extrabold text-slate-900 truncate tracking-tight">{submitted.caseNo}</p>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            const text = `접수번호: ${submitted.caseNo} / PIN: ${submitted.pin}`;
                                            const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
                                            if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(() => alert(text));
                                            else alert(text);
                                        }}
                                        className="flex-shrink-0 flex items-center gap-1.5 border border-brand-200 bg-brand-50 text-brand-700 px-3 py-2 rounded-lg text-xs font-bold hover:bg-brand-600 hover:border-brand-600 hover:text-white transition-colors"
                                    >
                                        <Icon name={copied ? "check" : "copy"} size={14} /> {copied ? "복사됨" : "복사"}
                                    </button>
                                </div>
                                <div className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
                                    <p className="text-[11px] text-slate-500 font-bold">조회 PIN</p>
                                    <p className="font-mono text-base font-bold text-slate-800 tracking-[0.3em]">{submitted.pin}</p>
                                </div>
                                <p className="text-xs text-red-700 font-bold mt-3 flex items-start gap-1.5">
                                    <Icon name="alert-circle" size={14} />
                                    <span>이 화면을 벗어나면 다시 볼 수 없습니다. 분실 시 조회와 답변 확인이 불가능합니다.</span>
                                </p>
                            </div>
                            <p className="text-xs text-slate-500 mt-3 text-center">
                                왼쪽 메뉴의 <span className="font-bold text-slate-700">‘내 접수 조회’</span> 에서 처리 상태와 담당자 답변을 확인하실 수 있습니다.
                            </p>
                        </div>
                    )}

                    <button onClick={() => { setSubmitted(null); setSurveyData({ ...DEFAULT_SURVEY_DATA }); setKeywordInput(""); setTouchedFields({}); setPulseComments({}); }} className="text-brand-600 font-bold hover:underline mt-6">추가 작성하기</button>
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto animate-fade-in my-4 md:my-8">
                    <div className="bg-white rounded-2xl shadow-md border border-slate-100 p-4 md:p-8">
                        <div className="mb-6">
                            <h1 className="text-xl md:text-2xl font-bold text-slate-800">{activeTab === "pulse" ? "조직 진단" : "고충 접수"}</h1>
                            <p className="text-xs md:text-sm text-slate-500 mt-2">{activeTab === "pulse" ? "8개 핵심 지표를 진단하고, 개선 키워드를 태그로 추가해주세요." : "접수 내용은 목적 범위 내에서만 확인하며, 조사·보호조치가 필요한 경우 추가 확인이 필요할 수 있습니다."}</p>
                        </div>

                        {activeTab === "complaint" && (
                            <form onSubmit={handleComplaintSubmit} className="space-y-6 pb-20 md:pb-0">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-2">접수 방식</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        {[{ value: "anonymous", label: "익명" }, { value: "named", label: "기명" }].map(opt => (
                                            <button key={opt.value} type="button" onClick={() => setComplaintData({...complaintData, reporterMode: opt.value, teamId: opt.value === "anonymous" ? "" : complaintData.teamId})} className={`py-3 rounded-xl border text-sm font-bold ${complaintData.reporterMode === opt.value ? "bg-brand-600 text-white border-brand-600" : "bg-white text-slate-600 border-slate-200 hover:border-brand-300"}`}>{opt.label}</button>
                                        ))}
                                    </div>
                                    {complaintData.reporterMode === "anonymous" && (
                                        <p className="text-xs text-slate-400 mt-2">익명 접수는 소속 부서를 포함한 신원 정보를 수집하지 않습니다.</p>
                                    )}
                                </div>

                                {complaintData.reporterMode === "named" && (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-2">소속 부서</label>
                                            <select value={complaintData.teamId} onChange={e => setComplaintData({...complaintData, teamId: e.target.value})} className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-200" required>
                                                <option value="">부서를 선택해주세요</option>
                                                {teamStats.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-2">성명</label>
                                            <input value={complaintData.reporterName} onChange={e => setComplaintData({...complaintData, reporterName: e.target.value})} className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-brand-200" placeholder="성명" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-2">연락처 또는 이메일</label>
                                            <input value={complaintData.contact} onChange={e => setComplaintData({...complaintData, contact: e.target.value})} className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-brand-200" placeholder="후속 확인 가능 연락처" />
                                        </div>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">고충 유형</label>
                                        <select value={complaintData.category} onChange={e => setComplaintData({...complaintData, category: e.target.value})} className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-brand-200">
                                            {COMPLAINT_CATEGORIES.map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">긴급도</label>
                                        <select value={complaintData.urgency} onChange={e => setComplaintData({...complaintData, urgency: e.target.value})} className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-brand-200">
                                            {URGENCY_OPTIONS.map(u => <option key={u.value} value={u.value}>{u.label}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">발생일</label>
                                        <input type="date" value={complaintData.incidentDate} onChange={e => setComplaintData({...complaintData, incidentDate: e.target.value})} className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-brand-200" />
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">제목</label>
                                        <input value={complaintData.subject} onChange={e => setComplaintData({...complaintData, subject: e.target.value})} className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-brand-200" placeholder="예: 반복 야근과 업무 배분 문제" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">관련자/관련부서</label>
                                        <input value={complaintData.relatedParty} onChange={e => setComplaintData({...complaintData, relatedParty: e.target.value})} className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-brand-200" placeholder="특정이 어렵다면 비워두세요" />
                                    </div>
                                </div>

                                {/* 넓은 화면에서 한 줄이 지나치게 길어지지 않도록 서술형 필드를 나란히 둔다 */}
                                <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">상세 내용</label>
                                            <textarea value={complaintData.details} onChange={e => setComplaintData({...complaintData, details: e.target.value})} rows="8" className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-brand-200 resize-none" placeholder="발생 경위, 빈도, 영향, 이미 요청한 사항 등을 적어주세요." required />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">희망 조치</label>
                                            <textarea value={complaintData.desiredAction} onChange={e => setComplaintData({...complaintData, desiredAction: e.target.value})} rows="8" className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-brand-200 resize-none" placeholder="예: 업무 조정, 면담, 분리 조치, 제도 개선 등" />
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <label className="flex items-start gap-3 p-4 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer">
                                        <input type="checkbox" checked={complaintData.protectionRequest === "yes"} onChange={e => setComplaintData({...complaintData, protectionRequest: e.target.checked ? "yes" : "no"})} className="mt-1" />
                                        <span>
                                            <span className="block text-sm font-bold text-slate-800">보호조치 검토 요청</span>
                                            <span className="block text-xs text-slate-500 mt-1">근무장소 변경, 분리, 유급휴가 등은 사실관계와 내부 절차에 따라 검토됩니다.</span>
                                        </span>
                                    </label>
                                    <label className="flex items-start gap-3 p-4 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer">
                                        <input type="checkbox" checked={complaintData.allowContact === "yes"} onChange={e => setComplaintData({...complaintData, allowContact: e.target.checked ? "yes" : "no"})} className="mt-1" />
                                        <span>
                                            <span className="block text-sm font-bold text-slate-800">추가 확인 연락 동의</span>
                                            <span className="block text-xs text-slate-500 mt-1">기명 접수 또는 연락처 기재 시에만 후속 확인이 가능합니다.</span>
                                        </span>
                                    </label>
                                </div>

                                {/* 익명 접수는 신원 정보를 받지 않으므로, 이 PIN 이 본인 확인의 유일한 수단이 된다. */}
                                <div className="p-4 rounded-xl border border-slate-200 bg-slate-50">
                                    <label className="block text-sm font-bold text-slate-700 mb-1">조회 PIN <span className="text-brand-600">*</span></label>
                                    <p className="text-xs text-slate-500 mb-3">
                                        접수 후 <span className="font-bold text-slate-700">접수번호 + PIN</span> 으로 처리 상태와 담당자 답변을 확인할 수 있습니다.
                                        {complaintData.reporterMode === "anonymous" && " 익명 접수는 연락처를 받지 않으므로, 이 PIN 이 답변을 받을 수 있는 유일한 방법입니다."}
                                    </p>
                                    <input
                                        type="password"
                                        inputMode="numeric"
                                        autoComplete="new-password"
                                        maxLength={8}
                                        value={complaintData.lookupPin}
                                        onChange={e => setComplaintData({...complaintData, lookupPin: e.target.value.replace(/[^0-9]/g, "")})}
                                        className="w-full md:w-52 px-4 py-3 border border-slate-200 rounded-xl bg-white tracking-[0.4em] text-center focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200"
                                        placeholder="숫자 4~8자리"
                                        required
                                    />
                                    <p className="text-xs text-slate-400 mt-2">PIN 은 암호화되어 저장되며, 관리자도 볼 수 없습니다. 분실 시 재발급이 불가능합니다.</p>
                                </div>

                                <label className="flex items-start gap-3 p-4 rounded-xl border border-brand-100 bg-brand-50 cursor-pointer">
                                    <input type="checkbox" checked={complaintData.privacyConsent} onChange={e => setComplaintData({...complaintData, privacyConsent: e.target.checked})} className="mt-1" required />
                                    <span className="text-xs md:text-sm text-brand-900 leading-relaxed">
                                        고충 접수·처리 목적의 개인정보 수집·이용 안내를 확인했습니다. 민감하거나 제3자를 특정할 수 있는 정보는 필요한 범위에서만 입력하며, 접수 내용은 담당자 확인·조사·조치·기록 보관 목적에 한해 사용됩니다.
                                    </span>
                                </label>

                                <div className="sticky bottom-0 -mx-4 px-4 py-3 bg-white/95 backdrop-blur border-t border-slate-100 md:static md:mx-0 md:px-0 md:py-0 md:bg-transparent md:border-0">
                                    <button type="submit" className="w-full bg-brand-600 text-white py-4 rounded-xl font-bold hover:bg-brand-700 transition shadow-lg shadow-brand-200">고충·의견 접수</button>
                                </div>
                            </form>
                        )}

                        {activeTab === "pulse" && (
                            <div>
                                <div className="text-center mb-4">
                                    <h2 className="text-lg md:text-xl font-bold text-slate-800">주간 조직 진단 (Weekly Pulse Survey)</h2>
                                    <p className="text-xs md:text-sm text-slate-400 mt-2">8개 핵심 지표를 5점 척도로 진단하고, 개선 키워드는 태그로 추가하세요.</p>
                                </div>
                                <div className="mb-6 md:mb-8">
                                    <div className="flex justify-between items-center text-xs font-bold text-slate-500 mb-1.5">
                                        <span>진행률</span>
                                        <span className="text-brand-600">{pulseProgress.done} / {pulseProgress.total}</span>
                                    </div>
                                    <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                        <div className="h-full bg-brand-500 rounded-full transition-all duration-300" style={{ width: `${pulseProgress.percent}%` }}></div>
                                    </div>
                                </div>
                                <form onSubmit={handleSurveySubmit} className="space-y-7 pb-20 md:pb-0">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">소속 부서</label>
                                        <select value={surveyData.teamId} onChange={e => setSurveyData({...surveyData, teamId: e.target.value})} className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-200" required>
                                            <option value="">부서를 선택해주세요</option>
                                            {teamStats.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                        </select>
                                    </div>
                                    {PULSE_CATEGORIES.map(cat => (
                                        <div key={cat.id} className="space-y-4">
                                            <h3 className="text-sm font-bold text-brand-700 flex items-center gap-2 pt-1">
                                                <span className="w-1.5 h-1.5 rounded-full bg-brand-500"></span>{cat.label}
                                            </h3>
                                            {/* 문항 카드가 가로로 늘어나면 오른쪽이 통째로 비어, 넓은 화면에서는 2열로 둔다 */}
                                            <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">
                                            {PULSE_FIELDS.filter(f => f.category === cat.id).map(f => (
                                                <div key={f.id} className="bg-slate-50 p-5 rounded-xl border border-slate-100 shadow-sm">
                                                    <div className="flex items-center justify-between mb-3">
                                                        <label className="block text-base font-extrabold text-slate-800">{f.label}</label>
                                                        <span className="text-sm font-bold text-brand-700 bg-brand-50 px-2.5 py-1 rounded-full">{surveyData[f.id]}점</span>
                                                    </div>
                                                    <p className="text-xs text-slate-400 mb-3">{f.desc}</p>
                                                    <div className="flex gap-2 overflow-x-auto pb-1">
                                                        {[1, 2, 3, 4, 5].map(num => {
                                                            const selected = String(surveyData[f.id]) === String(num);
                                                            const levelLabel = ['전혀 아님', '아님', '보통', '그렇다', '매우 그렇다'][num - 1];
                                                            const selectedTone = num <= 2
                                                                ? 'border-red-500 bg-red-500 text-white shadow-red-200'
                                                                : num === 3
                                                                    ? 'border-amber-500 bg-amber-500 text-white shadow-amber-200'
                                                                    : 'border-green-500 bg-green-500 text-white shadow-green-200';
                                                            return (
                                                                <button
                                                                    key={num}
                                                                    type="button"
                                                                    onClick={() => { setSurveyData({ ...surveyData, [f.id]: String(num) }); setTouchedFields(prev => ({ ...prev, [f.id]: true })); }}
                                                                    className={`flex-1 min-w-[76px] rounded-xl border px-2 py-3 text-center transition-all ${
                                                                        selected
                                                                            ? `${selectedTone} shadow-md`
                                                                            : 'border-slate-200 bg-white text-slate-600 hover:border-brand-300 hover:bg-brand-50'
                                                                    }`}
                                                                    aria-label={`${f.label} ${num}점`}
                                                                >
                                                                    <div className={`text-lg font-black ${selected ? 'text-white' : 'text-slate-800'}`}>{num}</div>
                                                                    <div className={`mt-1 text-[11px] font-semibold ${selected ? 'text-white/90' : 'text-slate-400'}`}>{levelLabel}</div>
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                    {Number(surveyData[f.id]) <= 2 && (
                                                        <div className="mt-3 animate-fade-in">
                                                            <textarea
                                                                value={pulseComments[f.id] || ''}
                                                                onChange={e => setPulseComments(prev => ({ ...prev, [f.id]: e.target.value }))}
                                                                rows="2"
                                                                placeholder="구체적인 사유를 남겨주시면 개선에 큰 도움이 됩니다 (선택)"
                                                                className="w-full px-3 py-2 text-xs border border-red-200 rounded-lg bg-red-50/50 focus:outline-none focus:ring-2 focus:ring-red-200 resize-none"
                                                            />
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                            </div>
                                        </div>
                                    ))}
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-3">키워드 태그</label>
                                        <div className="w-full px-4 py-4 border border-slate-200 rounded-xl bg-white">
                                            <div className="flex flex-wrap gap-2.5 mb-3 min-h-10 items-center">
                                                {keywordList.length === 0 && <span className="text-sm text-slate-400">예: 소통 부재, 야근, 협업 개선</span>}
                                                {keywordList.map((tag) => (
                                                    <span key={tag} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-brand-50 text-brand-700 text-sm font-semibold border border-brand-100">
                                                        {tag}
                                                        <button type="button" className="text-brand-500 hover:text-brand-700" onClick={() => removeKeyword(tag)} aria-label={`${tag} 삭제`}>
                                                            <Icon name="x" size={12} />
                                                        </button>
                                                    </span>
                                                ))}
                                            </div>
                                            <input
                                                type="text"
                                                placeholder="입력 후 Enter 또는 쉼표(,)로 추가"
                                                value={keywordInput}
                                                onChange={e => setKeywordInput(e.target.value)}
                                                onKeyDown={e => {
                                                    if (e.key === 'Enter' || e.key === ',') {
                                                        e.preventDefault();
                                                        addKeywordFromInput();
                                                    } else if (e.key === 'Backspace' && !keywordInput && keywordList.length > 0) {
                                                        removeKeyword(keywordList[keywordList.length - 1]);
                                                    }
                                                }}
                                                onBlur={addKeywordFromInput}
                                                className="w-full px-2 py-2.5 text-base outline-none"
                                            />
                                        </div>
                                    </div>
                                    <div className="sticky bottom-0 -mx-4 px-4 py-3 bg-white/95 backdrop-blur border-t border-slate-100 md:static md:mx-0 md:px-0 md:py-0 md:bg-transparent md:border-0">
                                        <button type="submit" className="w-full bg-brand-600 text-white py-4 rounded-xl font-bold hover:bg-brand-700 transition shadow-lg shadow-brand-200">익명 제출</button>
                                    </div>
                                </form>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 익명 신고자가 접수번호 + PIN 으로 본인 건을 열어보는 화면.
        // 내부 판단 자료(관리 메모·리스크 점수)는 노출하지 않고, 상태·결과·대화만 보여준다.
        const ComplaintLookupView = () => {
            const [caseNoInput, setCaseNoInput] = useState("");
            const [pinInput, setPinInput] = useState("");
            const [checking, setChecking] = useState(false);
            const [error, setError] = useState("");
            const [foundId, setFoundId] = useState(null);
