                        <h2 className="text-lg font-bold text-slate-800">고충 접수는 이렇게 진행됩니다</h2>
                        <p className="text-sm text-slate-500 mt-1 mb-6">사내 카카오톡 채널에서 담당자와 직접 주고받습니다.</p>
                        <ol className="space-y-4 lg:space-y-0 lg:grid lg:grid-cols-4 lg:gap-6">
                            {steps.map(st => (
                                <li key={st.n} className="flex gap-3.5 lg:flex-col lg:gap-2.5">
                                    <span className="flex-shrink-0 w-7 h-7 rounded-full bg-brand-600 text-white text-xs font-bold flex items-center justify-center">{st.n}</span>
                                    <div className="pt-0.5">
                                        <p className="font-bold text-slate-800 text-sm">{st.title}</p>
                                        <p className="text-sm text-slate-600 mt-1 leading-relaxed">{st.desc}</p>
                                    </div>
                                </li>
                            ))}
                        </ol>
                    </div>

                    {/* 익명 보장의 근거 — 추상적인 약속 대신 구체적인 방식 */}
                    <div className="bg-white rounded-2xl shadow-card border border-slate-100 p-6 md:p-8">
                        <h2 className="text-lg font-bold text-slate-800">게시판과 조직 진단의 익명은 이렇게 지켜집니다</h2>
                        <p className="text-sm text-slate-500 mt-1 mb-5">‘믿어주세요’ 대신, 실제로 어떻게 처리되는지 알려드립니다.</p>
                        {/* 바로 위가 카카오톡 접수 흐름이라, 여기까지 익명인 것으로
                            읽히기 쉽다. 아래 카드를 읽기 전에 선을 그어둔다. */}
                        <div className="ch-ink flex items-start gap-2.5 rounded-xl px-4 py-3 mb-6"
                             style={{ background: 'var(--ch-soft)', border: '1px solid var(--ch-line-soft)' }}>
                            <Icon name="alert-circle" size={15} className="mt-0.5 flex-shrink-0 ch-tag" />
                            <p className="text-xs leading-relaxed text-slate-700">
                                <span className="font-bold">아래 내용은 게시판과 조직 진단에만 해당합니다.</span>{' '}
                                고충 접수는 사내 카카오톡 채널로 받기 때문에 익명이 아닙니다. 담당자에게 프로필 이름과 사진이 보입니다.
                            </p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
                            {privacy.map(item => (
                                <div key={item.title} className="bg-slate-50 border border-slate-200 rounded-xl p-4">
                                    <div className="flex items-center gap-2 mb-2">
                                        <Icon name={item.icon} size={16} className="text-brand-600" />
                                        <p className="font-bold text-slate-800 text-sm">{item.title}</p>
                                    </div>
                                    <p className="text-xs text-slate-600 leading-relaxed">{item.desc}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 트러블이 생기기 쉬운 지점을 미리 알린다 */}
                    <div className="bg-white rounded-2xl border border-red-200 p-6 md:p-8">
                        <div className="flex items-center gap-2 mb-4">
                            <Icon name="alert-circle" size={18} className="text-red-600" />
                            <h2 className="text-lg font-bold text-slate-800">먼저 알아두실 점</h2>
                        </div>
                        <ul className="space-y-3 lg:space-y-0 lg:grid lg:grid-cols-2 lg:gap-x-8 lg:gap-y-3">
                            <li className="text-sm text-slate-700 leading-relaxed">
                                <span className="font-bold">게시판 글은 내용만으로 신원이 드러날 수 있습니다.</span> 시스템은 신원을 수집하지 않지만, 날짜·부서·상황을 자세히 적으시면 내용만으로 특정될 수 있습니다. 필요한 만큼만 적어주세요.
                            </li>
                            <li className="text-sm text-slate-700 leading-relaxed">
                                <span className="font-bold">게시판 글은 쓰신 브라우저에서만 삭제할 수 있습니다.</span> 익명 유지를 위해 작성자 정보를 저장하지 않고, 대신 글을 쓴 브라우저만 본인임을 증명할 수 있게 해두었기 때문입니다.
                            </li>
                            <li className="text-sm text-slate-700 leading-relaxed">
                                <span className="font-bold">긴급한 상황은 고충 접수를 이용해주세요.</span> 게시판은 전체에게 공개되며, 조사나 보호조치로 이어지지 않습니다.
                            </li>
                            <li className="text-sm text-slate-700 leading-relaxed">
                                <span className="font-bold">카카오톡 채널은 익명이 아닙니다.</span> 프로필 이름과 사진이 담당자에게 보입니다(전화번호·사번은 보이지 않습니다). 접수 전에 프로필을 바꿔두는 방법을 ‘고충 접수’ 화면에서 안내하고 있습니다.
                            </li>
                            <li className="text-sm text-slate-700 leading-relaxed">
                                <span className="font-bold">조직 진단 결과는 팀 단위로만 공개됩니다.</span> 응답이 {PULSE_MIN_N}명 미만인 팀은 응답자가 특정될 수 있어 점수를 아예 산출하지 않습니다.
                            </li>
                        </ul>
                    </div>

                    <div className="bg-slate-900 rounded-2xl p-6 md:p-8 text-center">
                        <p className="text-white font-bold text-lg">지금 바로 시작하실 수 있습니다</p>
                        <p className="text-slate-300 text-sm mt-2">게시판과 조직 진단은 익명으로, 고충 접수는 담당자와 1:1 로 진행됩니다.</p>
                        <div className="flex flex-wrap gap-2 justify-center mt-5">
                            <button onClick={() => setView('board')} className="bg-brand-600 text-white px-5 py-3 rounded-xl text-sm font-bold hover:bg-brand-700 transition-colors">게시판 둘러보기</button>
                            <button onClick={() => setView('complaint')} className="bg-white/10 text-white border border-white/20 px-5 py-3 rounded-xl text-sm font-bold hover:bg-white/20 transition-colors">고충 접수 안내</button>
                            <button onClick={() => setView('pulse-survey')} className="bg-white/10 text-white border border-white/20 px-5 py-3 rounded-xl text-sm font-bold hover:bg-white/20 transition-colors">조직 진단 참여</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ── 대나무숲 게시판 ──────────────────────────────────────────
        // 고충 접수가 '관리자에게만' 가는 1:1 창구라면, 이 게시판은 구성원 모두가 읽는
        // 공개 공간이다. 그래서 익명성 설계가 다르다.
        //
        //  - 작성자 uid 를 저장하지 않는다. 글마다 다른 nonce 와 섞은 해시(익명 태그)만 남긴다.
        //    태그가 글마다 달라지므로, 같은 사람이 쓴 다른 글끼리 묶어낼 수 없다.
        //    (전체 공통 태그를 쓰면 글 여러 개를 모아 글쓴이를 추정할 수 있다)
        //  - 소속 부서를 받지 않는다. 인원이 적은 팀에서는 부서만으로 사람이 특정된다.
        //  - 대신 공개 공간인 만큼 신고와 관리자 조치 수단을 둔다.
        const BOARD_CATEGORIES = [
            { value: 'free',       label: '자유' },
            { value: 'suggestion', label: '제안' },
            { value: 'praise',     label: '칭찬' },
            { value: 'question',   label: '질문' }
        ];
        const BOARD_SALT = 'bambooforest-board-v1';
        // 전사 300명 기준. 3건이면 세 명이 짜고 불편한 글을 가릴 수 있어 신고가
        // 오히려 입막음 수단이 된다. 읽는 사람이 수십 명인 글에서 '이건 선을 넘었다'는
        // 신호가 되려면 그보다 두터워야 해서 5건으로 둔다.
        // (인원이 크게 늘거나 오남용이 보이면 이 숫자만 조정하면 된다)
        const BOARD_BLIND_THRESHOLD = 5;
        const BOARD_PAGE_SIZE = 10;        // 한 번에 불러오는 글 수
        const BOARD_TITLE_MAX = 40;        // 제목 길이 상한
        // Firestore 는 전문 검색을 못 한다. 검색할 때만 최근 글을 이만큼
        // 한 번 받아와 브라우저에서 훑는다. 300명 규모에서 한 세션에 한 번
        // 500건이면 읽기 비용도 체감 속도도 문제되지 않는다.
        const BOARD_SEARCH_LIMIT = 500;

        // 제목이 없던 시절의 글이 남아 있다. 그때는 본문 첫 줄을 제목으로 쓴다.
        const postTitle = (post) => {
            const t = (post.title || '').trim();
            if (t) return t;
            const first = (post.content || '').split('\n').find(l => l.trim());
            return (first || '').trim().slice(0, BOARD_TITLE_MAX) || '(제목 없음)';
        };

        const getBoardCategory = (value) => BOARD_CATEGORIES.find(c => c.value === value) || BOARD_CATEGORIES[0];

        // 익명 표식의 색은 글의 authorTag 에서 뽑는다. 태그가 글마다 다르므로
        // 색도 글마다 달라진다. 같은 사람이 쓴 글이라도 묶이지 않는다.
        const tagHue = (tag) => parseInt(String(tag || '0').slice(0, 4), 16) % 360;
        const tagName = (tag) => `익명 ${String(tag || '').slice(0, 4) || '----'}`;

        // 사이드바 바닥의 대나무 숲. 굵기·높이·진하기를 달리해 앞뒤가 있게
        // 보이도록 했다. 진한 줄기가 앞, 옅고 가는 줄기가 뒤다.
        const GROVE_STALKS = [
            { x: 10,  w: 9,  h: 186, op: .05 },
            { x: 36,  w: 13, h: 262, op: .085 },
            { x: 62,  w: 7,  h: 142, op: .04 },
            { x: 82,  w: 15, h: 292, op: .095 },
            { x: 112, w: 10, h: 214, op: .06 },
            { x: 136, w: 6,  h: 118, op: .035 },
            { x: 156, w: 13, h: 250, op: .08 },
            { x: 184, w: 8,  h: 160, op: .046 },
            { x: 206, w: 14, h: 278, op: .09 },
            { x: 234, w: 9,  h: 196, op: .052 }
        ];
        const GROVE_H = 292;
        // 줄기만 있으면 대나무가 아니라 관처럼 보인다. 윗동이 흐려지지 않는
        // 낮은 줄기에만 잎을 붙인다(높은 줄기의 끝은 어차피 안 보인다).
        const GROVE_LEAF = "M20 3c0 8.5-5 15-12.5 15C6 18 4.5 17.5 3.5 17 6 10 12 4.5 20 3Z";

        const BambooGrove = () => (
            <svg className="grove" viewBox={`0 0 256 ${GROVE_H}`} preserveAspectRatio="xMidYMax slice" aria-hidden="true">
                {GROVE_STALKS.map((s, i) => {
                    const top = GROVE_H - s.h;
                    // 마디. 위로 갈수록 간격이 좁아져야 대나무처럼 보인다.
                    const nodes = [];
                    let gap = 42;
                    for (let y = GROVE_H - 30; y > top + 12; y -= gap, gap = Math.max(22, gap - 4)) nodes.push(y);
                    return (
                        <g key={i} fill="var(--brand-700)">
                            <rect x={s.x} y={top} width={s.w} height={s.h} rx={s.w * 0.26} opacity={s.op} />
                            <rect x={s.x - 1.6} y={top + 5} width={s.w + 3.2} height={2.6} rx={1.3}
                                  opacity={Math.min(s.op * 2.1, .2)} />
                            {nodes.map(y => (
                                <rect key={y} x={s.x - 1.6} y={y} width={s.w + 3.2} height={2.6} rx={1.3}
                                      opacity={Math.min(s.op * 2.1, .2)} />
                            ))}
                            {s.h <= 200 && [{ r: -18, sc: 1.15 }, { r: -112, sc: .95 }].map((lf, k) => (
                                <path key={k} d={GROVE_LEAF} opacity={Math.min(s.op * 1.5, .15)}
                                      transform={`translate(${s.x + s.w / 2} ${top + 10}) rotate(${lf.r}) scale(${lf.sc}) translate(-4 -17)`} />
                            ))}
                        </g>
                    );
                })}
            </svg>
        );

        // 게시판 배경에 날리는 잎.
        //   x     … 떨어지기 시작하는 가로 위치. 좌측 메뉴(256px)에 가리지
        //           않도록 넉넉히 안쪽부터 잡는다.
        //   drift … 한 번 떨어지는 동안 바람에 밀리는 거리. 전부 오른쪽으로
        //           밀어야 한 방향에서 부는 바람처럼 보인다.
        //   dur   … 큰 잎(가까운 잎)일수록 빨리 떨어뜨려 원근을 만든다.
        //   delay … 전부 음수라 화면을 열자마자 이미 흩어져 있다. 한 줄로
        //           내려오지 않도록 값을 서로 어긋나게 둔다.
        //   sy/sr … 움직임을 끈 사용자에게 보여줄 제자리 위치와 각도.
        const BOARD_LEAVES = [
            { x: '24%', size: 96,  op: .075, dur: '26s', delay: '-3s',  drift: '90px',  swing: '24px', flip: '7.4s',  sy: '12%', sr: '-18deg' },
            { x: '38%', size: 44,  op: .05,  dur: '34s', delay: '-19s', drift: '140px', swing: '34px', flip: '9.1s',  sy: '64%', sr: '34deg' },
            { x: '52%', size: 128, op: .07,  dur: '22s', delay: '-11s', drift: '60px',  swing: '18px', flip: '6.2s',  sy: '34%', sr: '-8deg' },
            { x: '66%', size: 60,  op: .06,  dur: '30s', delay: '-26s', drift: '120px', swing: '30px', flip: '8.3s',  sy: '78%', sr: '22deg' },
            { x: '80%', size: 84,  op: .065, dur: '25s', delay: '-7s',  drift: '75px',  swing: '22px', flip: '7.0s',  sy: '20%', sr: '-30deg' },
            { x: '30%', size: 36,  op: .045, dur: '38s', delay: '-31s', drift: '160px', swing: '38px', flip: '10.2s', sy: '88%', sr: '14deg' },
            { x: '90%', size: 110, op: .07,  dur: '28s', delay: '-15s', drift: '55px',  swing: '20px', flip: '7.8s',  sy: '52%', sr: '-24deg' },
            { x: '58%', size: 52,  op: .055, dur: '32s', delay: '-23s', drift: '130px', swing: '32px', flip: '8.8s',  sy: '6%',  sr: '40deg' }
        ];

        // 겹마다 다른 주기를 줘야 잎이 한 덩어리로 움직이지 않는다.
        // 흔들림 주기는 떨어지는 주기와 약수 관계가 되지 않게 잡았다.
        const LeafField = () => (
            <div className="leaf-field" aria-hidden="true">
                {BOARD_LEAVES.map((l, i) => (
                    <span key={i} className="leaf" style={{
                        '--x': l.x, '--op': l.op, '--dur': l.dur, '--delay': l.delay,
                        '--drift': l.drift, '--swing': l.swing, '--flip': l.flip,
                        '--sway': `${(parseFloat(l.flip) * 0.63).toFixed(2)}s`,
                        '--sy': l.sy, '--sr': l.sr
                    }}>
                        <span className="leaf-sway">
                            <span className="leaf-flip">
                                <BambooLeaf size={l.size} />
                            </span>
                        </span>
                    </span>
                ))}
            </div>
        );

        const BambooLeaf = ({ size = 16, className = '' }) => (
            <svg viewBox="0 0 24 24" width={size} height={size} className={className} aria-hidden="true">
                <path d="M20 3c0 8.5-5 15-12.5 15C6 18 4.5 17.5 3.5 17 6 10 12 4.5 20 3Z"
                      fill="currentColor" opacity=".9" />
                <path d="M20 3C13.5 6.5 8.5 11.5 5 18" fill="none" stroke="#fff"
                      strokeOpacity=".5" strokeWidth="1.3" strokeLinecap="round" />
            </svg>
        );

        // 블라인드 여부는 저장된 플래그가 아니라 신고 배열에서 파생한다.
        // 두 사람이 동시에 신고해 임계치를 같이 넘기면, 플래그를 각자 계산해
        // 쓰는 방식에서는 아무도 켜지 못한 채 넘어가기 때문이다.
        //  · hidden === true   → 관리자가 직접 가림
        //  · blindCleared      → 관리자가 신고 누적 블라인드를 해제함
        const isBlinded = (post) => post.hidden === true
            || (!post.blindCleared && (post.reportedBy || []).length >= BOARD_BLIND_THRESHOLD);

        const makeNonce = () => {
            const bytes = new Uint8Array(16);
            window.crypto.getRandomValues(bytes);
            return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
        };

        const makeAnonTag = async (nonce, uid) => {
            if (!window.crypto?.subtle) throw new Error('보안 연결(HTTPS)에서만 게시판을 사용할 수 있습니다.');
            const data = new TextEncoder().encode(`${BOARD_SALT}:${nonce}:${uid}`);
            const buf = await window.crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
        };

        const timeAgo = (value) => {
            const ms = value?.seconds ? value.seconds * 1000 : Date.parse(value);
            if (!ms || Number.isNaN(ms)) return "-";
            const diff = Math.floor((Date.now() - ms) / 1000);
            if (diff < 60) return "방금";
            if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
            if (diff < 604800) return `${Math.floor(diff / 86400)}일 전`;
            return new Date(ms).toLocaleDateString();
        };

        const BoardView = ({ user, role, setView }) => {
            const isAdmin = role === 'admin';
            const [posts, setPosts] = useState([]);
            const [comments, setComments] = useState([]);
            const [selectedId, setSelectedId] = useState(null);
            const [myTags, setMyTags] = useState({});      // postId -> 내 익명 태그
            const [composing, setComposing] = useState(false);
            const [draft, setDraft] = useState({ category: 'free', title: '', content: '' });
            const [sending, setSending] = useState(false);
            const [sort, setSort] = useState('new');
            const [pageSize, setPageSize] = useState(BOARD_PAGE_SIZE);
            const [reachedEnd, setReachedEnd] = useState(false);
            const [filter, setFilter] = useState('all');
            const [commentDraft, setCommentDraft] = useState("");
            const [searchInput, setSearchInput] = useState("");   // 입력칸 값
            const [searchTerm, setSearchTerm] = useState("");     // 실제로 검색에 쓰는 값
            const [searchPool, setSearchPool] = useState(null);   // 훑을 대상. null 이면 아직 못 받음
            const [searching, setSearching] = useState(false);

            const col = (name) => window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', name);
            const ref = (name, id) => window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', name, id);

            // 전부 내려받으면 글이 쌓일수록 그대로 느려진다.
            // 정렬·필터·개수 제한을 모두 서버에 맡기고, '더 보기' 로 한도만 늘린다.
            useEffect(() => { setPageSize(BOARD_PAGE_SIZE); }, [sort, filter]);

            useEffect(() => {
                if (!window.db) return;
                const parts = [];
                if (filter !== 'all') parts.push(window.firestore.where("category", "==", filter));
                parts.push(window.firestore.orderBy(sort === 'like' ? "likeCount" : "createdAt", "desc"));
                parts.push(window.firestore.limit(pageSize));
                return window.firestore.onSnapshot(
                    window.firestore.query(col('board_posts'), ...parts),
                    (snap) => {
                        const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        setPosts(rows);
                        setReachedEnd(rows.length < pageSize);   // 요청한 만큼 못 채웠으면 끝
                    }
                );
            }, [sort, filter, pageSize]);

            // 글자를 칠 때마다 훑으면 입력이 버벅인다. 잠깐 멈추면 검색한다.
            useEffect(() => {
                const t = setTimeout(() => setSearchTerm(searchInput.trim()), 250);
                return () => clearTimeout(t);
            }, [searchInput]);

            // 검색을 시작할 때 한 번만 받아 온다. 지우고 다시 검색해도 다시
            // 받지 않는다(같은 세션에서 500건을 거듭 읽을 이유가 없다).
            useEffect(() => {
                if (!window.db || !searchTerm || searchPool) return;
                let alive = true;
                setSearching(true);
                (async () => {
                    try {
                        const snap = await window.firestore.getDocs(window.firestore.query(
                            col('board_posts'),
                            window.firestore.orderBy("createdAt", "desc"),
                            window.firestore.limit(BOARD_SEARCH_LIMIT)
                        ));
                        if (alive) setSearchPool(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    } catch (e) {
                        console.error(e);
                        if (alive) setSearchPool([]);
                    } finally {
                        if (alive) setSearching(false);
                    }
                })();
                return () => { alive = false; };
            }, [searchTerm, searchPool]);

            // 댓글은 열어본 글의 것만 받는다. 목록 카드의 댓글 수는 글 문서에
            // 함께 저장해 둔 commentCount 를 쓴다(전체 댓글을 받지 않기 위해).
            useEffect(() => {
                if (!window.db || !selectedId) { setComments([]); return; }
                return window.firestore.onSnapshot(
                    window.firestore.query(col('board_comments'), window.firestore.where("postId", "==", selectedId)),
                    (snap) => setComments(snap.docs.map(d => ({ id: d.id, ...d.data() })))
                );
            }, [selectedId]);

            // 글마다 태그가 다르므로, 손에 들고 있는 글들의 내 태그를 한 번에
            // 계산해 둔다. 검색으로 받아온 글도 '내 글' 로 보이고 지울 수
            // 있어야 하므로 검색 풀까지 포함한다.
            const tagTargets = useMemo(() => {
                const seen = new Map();
                for (const p of posts) seen.set(p.id, p);
                for (const p of (searchPool || [])) if (!seen.has(p.id)) seen.set(p.id, p);
                return [...seen.values()];
            }, [posts, searchPool]);

            useEffect(() => {
                if (!user || tagTargets.length === 0) return;
                let alive = true;
                (async () => {
                    const next = {};
                    for (const post of tagTargets) {
                        if (!post.nonce) continue;
                        try { next[post.id] = await makeAnonTag(post.nonce, user.uid); } catch { /* HTTPS 아님 */ }
                    }
                    if (alive) setMyTags(next);
                })();
                return () => { alive = false; };
            }, [tagTargets, user]);

            // 검색 결과에서 연 글은 posts 에 없을 수 있다.
            const selected = tagTargets.find(p => p.id === selectedId) || null;

            // 정렬·필터·개수는 서버 쿼리가 이미 처리했다.
            // 여기서는 블라인드된 글만 걷어낸다(관리자와 작성자 본인에게는 남긴다).
            const readable = (p) => !isBlinded(p) || isAdmin || myTags[p.id] === p.authorTag;

            // 검색 중에는 서버가 걸러 준 목록 대신 받아둔 풀을 쓴다.
            // 말머리와 정렬은 서버가 해 주던 일을 여기서 그대로 대신한다.
            const searchHits = useMemo(() => {
                if (!searchTerm || !searchPool) return null;
                const q = searchTerm.toLowerCase();
                return searchPool
                    .filter(readable)
                    .filter(p => filter === 'all' || p.category === filter)
                    .filter(p => `${postTitle(p)}\n${p.content || ''}`.toLowerCase().includes(q))
                    .sort((a, b) => sort === 'like'
                        ? (b.likeCount || 0) - (a.likeCount || 0)
                        : (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            }, [searchTerm, searchPool, filter, sort, isAdmin, myTags]);

            const visiblePosts = useMemo(
                () => searchHits || posts.filter(readable),
                [searchHits, posts, isAdmin, myTags]
            );

            // 머리말에 보여줄 숫자. 서버에서 가져온 '지금 목록'만 센다.
            const boardStats = useMemo(() => {
                const dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
                const t0 = dayStart.getTime() / 1000;
                let today = 0, likes = 0;
                for (const p of visiblePosts) {
                    if ((p.createdAt?.seconds || 0) >= t0) today++;
                    likes += (p.likedBy || []).length;
                }
                return { total: visiblePosts.length, today, likes };
            }, [visiblePosts]);

            const submitPost = async (e) => {
                e.preventDefault();
                const title = draft.title.trim().slice(0, BOARD_TITLE_MAX);
                const content = draft.content.trim();
                if (!title || !content || sending) return;
                setSending(true);
                try {
                    const nonce = makeNonce();
                    await window.firestore.addDoc(col('board_posts'), {
                        title,
                        content,
                        category: draft.category,
                        nonce,
                        authorTag: await makeAnonTag(nonce, user.uid),
                        likedBy: [],
                        // likedBy 배열 길이로는 서버 정렬을 할 수 없어 개수를 따로 둔다.
                        likeCount: 0,
                        commentCount: 0,
                        reportedBy: [],
                        // 배열 길이로는 서버에서 '신고 N건 이상' 을 찾을 수 없어,
                        // 관리자 검토 대기 목록을 위해 개수를 따로 둔다.
                        reportCount: 0,
                        hidden: false,
                        blindCleared: false,
                        createdAt: window.firestore.serverTimestamp()
                    });
                    setDraft({ category: 'free', title: '', content: '' });
                    setComposing(false);
                } catch (err) {
                    alert("등록 실패: " + err.message);
                } finally {
                    setSending(false);
                }
            };

            const submitComment = async (e) => {
                e.preventDefault();
                const content = commentDraft.trim();
                if (!content || !selected || sending) return;
                setSending(true);
                try {
                    await window.firestore.addDoc(col('board_comments'), {
                        postId: selected.id,
                        content,
                        // 댓글도 같은 글의 nonce 를 쓰므로, 같은 글 안에서만 동일인이 식별된다.
                        authorTag: await makeAnonTag(selected.nonce, user.uid),
                        createdAt: window.firestore.serverTimestamp()
                    });
                    await window.firestore.updateDoc(ref('board_posts', selected.id), {
                        commentCount: window.firestore.increment(1)
                    });
                    setCommentDraft("");
                } catch (err) {
                    alert("등록 실패: " + err.message);
                } finally {
                    setSending(false);
                }
            };

            // 화면에서 읽은 배열을 통째로 다시 쓰면, 같은 순간 다른 사람이 누른 공감이
            // 지워진다. 300명이 같은 글을 보는 상황에서는 실제로 부딪힌다.
            // 그래서 배열과 카운터 모두 서버 측 원자 연산으로 넘긴다.
            const toggleLike = async (post) => {
                const tag = myTags[post.id];
                if (!tag) return;
                const liked = (post.likedBy || []).includes(tag);
                await window.firestore.updateDoc(ref('board_posts', post.id), {
                    likedBy: liked ? window.firestore.arrayRemove(tag) : window.firestore.arrayUnion(tag),
                    likeCount: window.firestore.increment(liked ? -1 : 1)
                });
            };

            const reportPost = async (post) => {
                const tag = myTags[post.id];
                if (!tag) return;
                const reportedBy = post.reportedBy || [];
                if (reportedBy.includes(tag)) return alert("이미 신고하신 글입니다.");
                if (!confirm("이 글을 신고하시겠습니까? 신고가 누적되면 자동으로 가려지고 관리자가 검토합니다.")) return;
                await window.firestore.updateDoc(ref('board_posts', post.id), {
                    reportedBy: window.firestore.arrayUnion(tag),
                    reportCount: window.firestore.increment(1)
                });
                alert("신고가 접수되었습니다.");
            };

            // 삭제는 서버 함수가 맡는다. 함수가 호출자 uid 로 익명 태그를 다시 계산해
            // 작성자 본인인지 확인하므로, 화면 코드를 고쳐도 남의 글은 지울 수 없다.
            const removePost = async (post) => {
                if (!confirm("이 글을 삭제하시겠습니까? 삭제된 글은 복구할 수 없습니다.")) return;
                try {
                    await window.callFn('deleteBoardPost', { postId: post.id });
                    setSelectedId(null);
                } catch (e) {
                    alert(e.code === 'functions/permission-denied'
                        ? "본인이 쓴 글만 삭제할 수 있습니다."
                        : "삭제 실패: " + (e.message || e));
                }
            };

            // 해제는 관리자가 신고 누적 결과를 뒤집는 행위라, 플래그를 내리는 것만으로는
            // 부족하다(신고 건수는 그대로 남아 다시 가려진다). 해제 사실을 따로 남긴다.
            const setHidden = async (post, hidden) => {
                await window.firestore.updateDoc(ref('board_posts', post.id),
                    hidden ? { hidden: true, blindCleared: false }
                           : { hidden: false, blindCleared: true });
            };

            const removeComment = async (comment) => {
                if (!confirm("이 댓글을 삭제하시겠습니까?")) return;
                try {
                    await window.callFn('deleteBoardComment', { commentId: comment.id });
                } catch (e) {
                    alert(e.code === 'functions/permission-denied'
                        ? "본인이 쓴 댓글만 삭제할 수 있습니다."
                        : "삭제 실패: " + (e.message || e));
                }
            };

            // ── 글 상세 ──────────────────────────────────────────────
            if (selected) {
                const myTag = myTags[selected.id];
                const mine = myTag && myTag === selected.authorTag;
                const liked = myTag && (selected.likedBy || []).includes(myTag);
                const sorted = comments.slice().sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
                // 같은 글 안에서 등장 순서대로 익명1, 익명2… 를 붙인다.
                const order = [];
                sorted.forEach(c => { if (c.authorTag && !order.includes(c.authorTag)) order.push(c.authorTag); });
                const nameOf = (tag) => tag === selected.authorTag ? '작성자' : `익명${order.indexOf(tag) + 1}`;

                // 목록에서 가려도 상세로 들어오면 그대로 읽히면 안 된다.
                // (글을 열어둔 채로 블라인드된 경우도 여기서 막힌다)
                if (isBlinded(selected) && !isAdmin && !mine) {
                    return (
                        <div className="max-w-6xl mx-auto animate-fade-in my-4 md:my-8 space-y-4">
                            <button onClick={() => setSelectedId(null)} className="text-sm text-slate-500 hover:text-brand-600 font-bold">← 목록으로</button>
                            <div className="bg-white rounded-2xl shadow-card border border-slate-100 p-10 text-center">
                                <div className="w-12 h-12 bg-red-50 border border-red-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                    <Icon name="eye-off" size={22} className="text-red-600" />
                                </div>
                                <p className="font-bold text-slate-800">가려진 글입니다</p>
                                <p className="text-sm text-slate-500 mt-1.5">신고가 누적되어 관리자 검토 중입니다.</p>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="max-w-6xl mx-auto animate-fade-in my-4 md:my-8 space-y-4">
                        <button onClick={() => setSelectedId(null)} className="text-sm text-slate-500 hover:text-brand-600 font-bold">← 목록으로</button>

                        {/* 넓은 화면에서는 본문과 댓글을 나란히 놓아 스크롤을 줄인다. */}
                        <div className="grid grid-cols-1 xl:grid-cols-5 gap-4 items-start">
                        <div className="xl:col-span-3 bg-white rounded-2xl shadow-card border border-slate-100 p-5 md:p-7">
                            {isBlinded(selected) && (
                                <div className="mb-4 bg-red-50 border border-red-100 rounded-xl px-4 py-3 text-sm text-red-700 font-bold">
                                    신고 누적으로 가려진 글입니다. {isAdmin ? "관리자에게만 보입니다." : ""}
                                </div>
                            )}
                            <div className={`flex items-center gap-3 mb-4 flex-wrap cat-${getBoardCategory(selected.category).value}`}>
                                <span className="anon-badge" style={{ '--h': tagHue(selected.authorTag) }}>
                                    <BambooLeaf size={16} />
                                </span>
                                <div className="flex items-center gap-2 flex-wrap">
                                    <span className="cat-chip px-2.5 py-0.5 rounded-full text-[11px] font-bold">{getBoardCategory(selected.category).label}</span>
                                    <span className="text-xs text-slate-400 font-medium">{tagName(selected.authorTag)}</span>
                                    <span className="text-slate-300 text-xs">·</span>
                                    <span className="text-xs text-slate-400">{timeAgo(selected.createdAt)}</span>
                                    {mine && <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600">내 글</span>}
                                </div>
                            </div>
                            <h1 className="text-lg md:text-xl font-extrabold text-slate-900 leading-snug break-words mb-3">{postTitle(selected)}</h1>
                            <p className="text-[15px] text-slate-800 whitespace-pre-wrap break-words leading-relaxed">{selected.content}</p>

                            <div className="flex items-center gap-2 mt-5 pt-4 border-t border-slate-100 flex-wrap">
                                <button onClick={() => toggleLike(selected)} className={`lift flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-bold border transition-colors ${liked ? 'bg-brand-600 text-white border-brand-600' : 'bg-white text-slate-600 border-slate-200 hover:border-brand-300 hover:text-brand-600'}`}>
                                    <span key={liked ? 'on' : 'off'} className={liked ? 'pop' : ''}><Icon name="heart" size={15} /></span> 공감 {(selected.likedBy || []).length}
                                </button>
                                <span className="flex items-center gap-1.5 px-3 py-2 text-sm font-bold text-slate-500">
                                    <Icon name="message-circle" size={15} /> 댓글 {sorted.length}
                                </span>
                                <div className="flex-1"></div>
                                {!mine && (
                                    <button onClick={() => reportPost(selected)} className="text-xs font-bold text-slate-400 hover:text-red-600 px-2 py-2">신고</button>
                                )}
                                {(mine || isAdmin) && (
                                    <button onClick={() => removePost(selected)} className="text-xs font-bold text-red-700 border border-red-200 px-3 py-2 rounded-lg hover:bg-red-600 hover:text-white hover:border-red-600 transition-colors">삭제</button>
                                )}
                                {isAdmin && (
                                    <button onClick={() => setHidden(selected, !isBlinded(selected))} className="text-xs font-bold text-slate-600 border border-slate-200 px-3 py-2 rounded-lg hover:bg-slate-100">
                                        {isBlinded(selected) ? "숨김 해제" : "숨기기"}
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="xl:col-span-2 bg-white rounded-2xl shadow-card border border-slate-100 p-5 md:p-7">
                            <h3 className="font-bold text-slate-800 mb-4">댓글 {sorted.length}</h3>
                            <div className="space-y-3 mb-4">
                                {sorted.length === 0 && <p className="text-sm text-slate-500">첫 댓글을 남겨보세요.</p>}
                                {sorted.map(c => {
                                    const isMine = myTag && c.authorTag === myTag;
                                    return (
                                        <div key={c.id} className="border border-slate-100 bg-slate-50 rounded-xl px-4 py-3">
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className={`text-xs font-bold ${c.authorTag === selected.authorTag ? 'text-brand-700' : 'text-slate-600'}`}>{nameOf(c.authorTag)}</span>
                                                <span className="text-[11px] text-slate-400">{timeAgo(c.createdAt)}</span>
                                                <div className="flex-1"></div>
                                                {(isMine || isAdmin) && (
                                                    <button onClick={() => removeComment(c)} className="text-[11px] font-bold text-slate-400 hover:text-red-600">삭제</button>
                                                )}
                                            </div>
                                            <p className="text-sm text-slate-700 whitespace-pre-wrap break-words leading-relaxed">{c.content}</p>
                                        </div>
                                    );
                                })}
                            </div>
                            <form onSubmit={submitComment} className="flex gap-2">
                                <input value={commentDraft} onChange={e => setCommentDraft(e.target.value)} placeholder="익명으로 댓글 남기기…" className="flex-1 border border-slate-200 rounded-lg px-3 py-2.5 text-sm bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200" />
                                <button type="submit" disabled={!commentDraft.trim() || sending} className="bg-brand-600 text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-brand-700 disabled:opacity-40 transition-colors">등록</button>
                            </form>
                        </div>
                        </div>
                    </div>
                );
            }

            // ── 목록 ─────────────────────────────────────────────────
            // 검색 결과가 적은 건 글이 적어서가 아니다. 그때는 유도 카드를 넣지 않는다.
            const showWritePrompt = !searchTerm && visiblePosts.length > 0 && visiblePosts.length < 3 && !composing;
            return (
                <div className="max-w-6xl mx-auto animate-fade-in my-4 md:my-8 space-y-4">
                    <div className="board-hero rounded-2xl shadow-card p-5 md:p-7">
                        <div aria-hidden="true">
                            <span className="hero-leaf" style={{ top: '-14px', right: '28px', animationDelay: '0s' }}><BambooLeaf size={96} /></span>
                            <span className="hero-leaf" style={{ bottom: '-28px', right: '136px', animationDelay: '-4.5s' }}><BambooLeaf size={62} /></span>
                            <span className="hero-leaf" style={{ top: '46px', right: '206px', animationDelay: '-8.5s' }}><BambooLeaf size={38} /></span>
                        </div>
                        <div className="relative flex items-start justify-between gap-3 flex-wrap">
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold text-slate-800">대나무숲 게시판</h1>
                                <p className="text-sm text-slate-500 mt-1.5 leading-relaxed">
                                    누구나 익명으로 쓰고 함께 읽는 공간입니다. 작성자 정보는 저장하지 않으며, 글마다 다른 익명 표식이 부여됩니다.
                                </p>
                                <div className="flex items-center gap-2.5 mt-3 text-xs text-slate-500">
                                    <span>지금 보이는 글 <b className="text-slate-800">{boardStats.total}</b></span>
                                    <span className="text-slate-300">·</span>
                                    <span>오늘 <b className="text-brand-600">{boardStats.today}</b></span>
                                    <span className="text-slate-300">·</span>
                                    <span>받은 공감 <b className="text-slate-800">{boardStats.likes}</b></span>
                                </div>
                                {/* 관리자에게는 구성원용 화면으로 가는 링크가 되지 않는다(라우팅이 되돌린다) */}
                                {setView && !isAdmin && (
                                    <div className="flex flex-wrap gap-x-4 gap-y-1 mt-3">
                                        <button onClick={() => setView('guide')} className="text-xs font-bold text-brand-600 hover:text-brand-700 flex items-center gap-1">
                                            <Icon name="info" size={13} /> 처음이신가요? 이용 안내 보기
                                        </button>
                                        <button onClick={() => setView('complaint')} className="text-xs font-bold text-slate-500 hover:text-brand-600 flex items-center gap-1">
                                            <Icon name="shield" size={13} /> 담당자에게만 알리고 싶다면 · 고충 접수
                                        </button>
                                    </div>
                                )}
                            </div>
                            {!composing && (
                                <button onClick={() => setComposing(true)} className="bg-brand-600 text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-brand-700 shadow-brand transition-colors flex items-center gap-1.5 whitespace-nowrap">
                                    <Icon name="pencil" size={15} /> 글쓰기
                                </button>
                            )}
                        </div>

                        {composing && (
                            <form onSubmit={submitPost} className="relative mt-5 border-t border-brand-100 pt-5">
                                <div className="flex gap-2 mb-3 flex-wrap">
                                    {BOARD_CATEGORIES.map(c => (
                                        <button key={c.value} type="button" onClick={() => setDraft({ ...draft, category: c.value })} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${draft.category === c.value ? 'bg-brand-600 text-white border-brand-600' : 'bg-white text-slate-600 border-slate-200 hover:border-brand-300'}`}>{c.label}</button>
                                    ))}
                                </div>
                                <div className="relative mb-2.5">
                                    <input
                                        value={draft.title}
                                        onChange={e => setDraft({ ...draft, title: e.target.value.slice(0, BOARD_TITLE_MAX) })}
                                        maxLength={BOARD_TITLE_MAX}
                                        placeholder="제목 — 무슨 이야기인지 한 줄로"
                                        className="w-full px-4 py-3 pr-16 border border-slate-200 rounded-xl bg-white text-[15px] font-bold focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200"
                                        autoFocus
                                    />
                                    <span className={`absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold tabular-nums ${draft.title.length >= BOARD_TITLE_MAX ? 'text-brand-600' : 'text-slate-300'}`}>
                                        {draft.title.length}/{BOARD_TITLE_MAX}
                                    </span>
                                </div>
                                <textarea value={draft.content} onChange={e => setDraft({ ...draft, content: e.target.value })} rows="5" placeholder="하고 싶은 이야기를 자유롭게 남겨주세요. 특정 개인을 알아볼 수 있는 내용은 피해주세요." className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white text-sm resize-none focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200" />
                                <div className="flex items-center gap-2 mt-3">
                                    <p className="text-xs text-slate-400 flex-1">등록 후에는 이 브라우저에서만 삭제할 수 있습니다.</p>
                                    <button type="button" onClick={() => { setComposing(false); setDraft({ category: 'free', title: '', content: '' }); }} className="px-4 py-2.5 rounded-lg text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">취소</button>
                                    <button type="submit" disabled={!draft.title.trim() || !draft.content.trim() || sending} className="bg-brand-600 text-white px-5 py-2.5 rounded-lg text-sm font-bold hover:bg-brand-700 disabled:opacity-40 transition-colors">{sending ? "등록 중" : "등록"}</button>
                                </div>
                            </form>
                        )}
                    </div>

                    {/* 검색은 서버가 못 하므로 받아둔 글에서 훑는다. 범위를
                        숨기지 않고 결과 줄에 그대로 밝힌다. */}
                    <div className="relative">
                        <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                            <Icon name="search" size={16} />
                        </span>
                        <input
                            value={searchInput}
                            onChange={e => setSearchInput(e.target.value)}
                            placeholder="제목과 본문에서 찾기"
                            className="w-full pl-10 pr-10 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200"
                        />
                        {searchInput && (
                            <button onClick={() => setSearchInput('')} aria-label="검색어 지우기"
                                    className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-600">
                                <Icon name="x" size={16} />
                            </button>
                        )}
                    </div>

                    <div className="flex items-center gap-2 flex-wrap">
                        <button onClick={() => setFilter('all')} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${filter === 'all' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200 hover:border-brand-300'}`}>전체</button>
                        {BOARD_CATEGORIES.map(c => (
                            <button key={c.value} onClick={() => setFilter(c.value)} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${filter === c.value ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200 hover:border-brand-300'}`}>{c.label}</button>
                        ))}
                        <div className="flex-1"></div>
                        <select value={sort} onChange={e => setSort(e.target.value)} className="text-xs font-bold border border-slate-200 rounded-lg px-2 py-1.5 bg-white text-slate-600">
                            <option value="new">최신순</option>
                            <option value="like">공감순</option>
                        </select>
                    </div>

                    <div className="space-y-3">
                        {searchTerm && (
                            <p className="text-xs text-slate-500 px-1">
                                {searching || !searchPool
                                    ? '찾는 중…'
                                    : <>‘<span className="font-bold text-slate-700">{searchTerm}</span>’ 로 <span className="font-bold text-brand-600">{visiblePosts.length}건</span>{' '}
                                       — 최근 글 {searchPool.length}건에서 찾았습니다
                                       {searchPool.length >= BOARD_SEARCH_LIMIT && ' (그보다 오래된 글은 포함되지 않습니다)'}</>}
                            </p>
                        )}
                        {searchTerm && !searching && searchPool && visiblePosts.length === 0 && (
                            <div className="bg-white rounded-2xl border border-slate-100 p-12 text-center">
                                <p className="text-slate-700 font-bold">찾으시는 글이 없습니다</p>
                                <p className="text-sm text-slate-500 mt-1.5">다른 낱말로 찾아보시거나, 말머리 필터를 ‘전체’로 두고 다시 찾아보세요.</p>
                            </div>
                        )}
                        {!searchTerm && visiblePosts.length === 0 && (
                            <div className="bg-white rounded-2xl border border-slate-100 p-12 text-center">
                                <div className="w-14 h-14 rounded-2xl bg-brand-50 border border-brand-100 flex items-center justify-center mx-auto mb-4 text-brand-500">
                                    <span className="sway"><BambooLeaf size={26} /></span>
                                </div>
                                <p className="text-slate-700 font-bold">아직 조용합니다</p>
                                <p className="text-sm text-slate-500 mt-1.5">첫 이야기를 남겨보세요. 누가 썼는지는 아무도 모릅니다.</p>
                            </div>
                        )}
                        {/* 넓은 화면에서는 2열. 칸이 하나뿐이면 옆이 비어 허전하므로
                            그때만 한 줄로 채운다. 글이 두세 건일 때는 마지막 칸에
                            작성 유도 카드를 넣어 목록이 끊겨 보이지 않게 한다. */}
                        <div className={`grid grid-cols-1 gap-3 ${visiblePosts.length + (showWritePrompt ? 1 : 0) > 1 ? 'xl:grid-cols-2' : ''}`}>
                        {visiblePosts.map((post, i) => {
                            const myTag = myTags[post.id];
                            const mine = myTag && myTag === post.authorTag;
                            const liked = myTag && (post.likedBy || []).includes(myTag);
                            const cat = getBoardCategory(post.category);
                            return (
                                <button
                                    key={post.id}
                                    onClick={() => setSelectedId(post.id)}
                                    style={{ animationDelay: `${Math.min(i, 9) * 45}ms` }}
                                    className={`post-enter post-card cat-${cat.value} w-full text-left p-5 pl-6 block`}
                                >
                                    <div className="flex items-start gap-3">
                                        <span className="anon-badge" style={{ '--h': tagHue(post.authorTag) }}>
                                            <BambooLeaf size={16} />
                                        </span>
                                        <div className="min-w-0 flex-1">
                                            <div className="flex items-center gap-2 flex-wrap">
                                                <span className="cat-chip px-2.5 py-0.5 rounded-full text-[11px] font-bold">{cat.label}</span>
                                                <span className="text-xs text-slate-400 font-medium">{tagName(post.authorTag)}</span>
                                                <span className="text-slate-300 text-xs">·</span>
                                                <span className="text-xs text-slate-400">{timeAgo(post.createdAt)}</span>
                                                {mine && <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600">내 글</span>}
                                                {isBlinded(post) && <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-red-600 text-white">블라인드</span>}
                                            </div>
                                            <p className="text-[15px] font-bold text-slate-800 leading-snug line-clamp-2 break-words mt-2">{postTitle(post)}</p>
                                            <div className="flex items-center gap-4 mt-3.5 text-xs font-bold text-slate-400">
                                                <span className={`flex items-center gap-1.5 ${liked ? 'text-brand-600' : ''}`}>
                                                    <Icon name="heart" size={14} /> {(post.likedBy || []).length}
                                                </span>
                                                <span className="flex items-center gap-1.5">
                                                    <Icon name="message-circle" size={14} /> {post.commentCount || 0}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </button>
                            );
                        })}
                        {showWritePrompt && (
                            <button onClick={() => setComposing(true)} className="post-enter write-prompt w-full text-left p-5 pl-6 block" style={{ animationDelay: `${Math.min(visiblePosts.length, 9) * 45}ms` }}>
                                <div className="flex items-start gap-3">
                                    <span className="w-[30px] h-[30px] rounded-[10px] grid place-items-center flex-shrink-0 bg-brand-50 border border-brand-100 text-brand-500">
                                        <Icon name="pencil" size={15} />
                                    </span>
                                    <div className="min-w-0">
                                        <p className="text-[15px] font-bold text-slate-700">여기에 당신의 이야기가 놓입니다</p>
                                        <p className="text-sm text-slate-500 leading-relaxed mt-1.5">불편했던 일, 고마웠던 일, 물어보고 싶었던 것. 무엇이든 괜찮습니다. 이름은 남지 않습니다.</p>
                                    </div>
                                </div>
                            </button>
                        )}

                        </div>

                        {/* '더 보기' 는 서버 목록을 늘리는 버튼이다. 검색 결과에는 해당 없다. */}
                        {!searchTerm && !reachedEnd && (
                            <button
                                onClick={() => setPageSize(n => n + BOARD_PAGE_SIZE)}
                                className="w-full py-3 rounded-xl border border-slate-200 bg-white text-sm font-bold text-slate-600 hover:border-brand-300 hover:text-brand-600 transition-colors"
                            >
                                더 보기
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // 신고가 쌓여 자동으로 가려진 글은 관리자가 들여다보기 전까지 아무도 모른다.
        // 게시판 목록을 훑어야 발견되는 구조라, 방치되면 부당하게 가려진 글도 그대로 묻힌다.
        // 그래서 대시보드에 검토 대기 건수를 띄운다.
        const ReviewQueueCard = ({ setView }) => {
            const [pending, setPending] = useState(0);

            useEffect(() => {
                if (!window.db) return;
                return window.firestore.onSnapshot(
                    window.firestore.query(
                        window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'board_posts'),
                        window.firestore.where("reportCount", ">=", BOARD_BLIND_THRESHOLD),
                        window.firestore.limit(100)
                    ),
                    (snap) => {
                        // 관리자가 이미 가리거나 해제한 글은 판단이 끝난 것이므로 뺀다.
                        const rows = snap.docs.map(d => d.data())
                            .filter(d => d.hidden !== true && !d.blindCleared);
                        setPending(rows.length);
                    },
                    (e) => console.error("검토 대기 조회 실패:", e)
                );
            }, []);

            const urgent = pending > 0;
            return (
                <div className={`rounded-xl border p-4 flex items-center gap-4 flex-wrap ${urgent ? 'bg-red-50 border-red-200' : 'bg-white border-slate-100'}`}>
                    <span className={`w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0 ${urgent ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-400'}`}>
                        <Icon name={urgent ? 'alert-circle' : 'shield-check'} size={20} />
                    </span>
                    <div className="flex-1 min-w-[200px]">
                        <p className="font-bold text-slate-800 text-sm">
                            게시판 검토 대기 <span className={urgent ? 'text-red-700' : 'text-slate-400'}>{pending}건</span>
                        </p>
                        <p className="text-xs text-slate-500 mt-0.5 leading-relaxed">
                            {urgent
                                ? `신고 ${BOARD_BLIND_THRESHOLD}건이 쌓여 자동으로 가려진 글입니다. 내용을 확인하고 숨김을 유지할지 해제할지 정해주세요.`
                                : `신고가 ${BOARD_BLIND_THRESHOLD}건 쌓이면 글이 자동으로 가려지고 여기에 표시됩니다.`}
                        </p>
                    </div>
                    {urgent && (
                        <button onClick={() => setView('board')} className="bg-red-600 text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-red-700 transition-colors whitespace-nowrap">
                            게시판에서 확인
                        </button>
                    )}
                </div>
            );
        };

        const DashboardView = ({ globalMetrics, chartData, teamStats, currentPeriod, user, setView }) => {
            const KPICard = ({ metric }) => {
                if(!metric) return null;
                const valStr = String(metric.value);
                const diffStr = String(metric.diff);
                const isPositive = parseFloat(diffStr) >= 0;
                return (
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                        <div className="flex justify-between items-start mb-4"><div className={`p-3 rounded-xl ${metric.color}`}><Icon name={metric.icon} size={24} /></div><span className={`flex items-center text-xs font-bold px-2 py-1 rounded-full ${isPositive ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`}>{isPositive ? '▲' : '▼'} {Math.abs(parseFloat(diffStr) || 0)}{metric.unit || ''}</span></div>
                        <h3 className="text-slate-500 text-sm font-medium mb-1">{metric.label}</h3>
                        <p className="text-2xl font-bold text-slate-800">{valStr}</p>
                        <p className="text-xs text-slate-400 mt-2">vs 전월</p>
                    </div>
                );
            };
            const TrendChart = ({ data }) => {
                if (!data || data.length === 0) {
                    return (<div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 h-full flex flex-col justify-center items-center text-center"><div className="bg-slate-100 p-3 rounded-full mb-3"><Icon name="bar-chart-2" size={24} className="text-slate-400" /></div><p className="text-slate-500 font-medium">데이터가 없습니다</p><p className="text-xs text-slate-400 mt-1">설정 메뉴에서 데이터를 입력하거나<br/>자동 산출 기능을 사용해보세요.</p></div>);
                }
                const val = (d) => Number.isFinite(Number(d.value)) ? Number(d.value) : 0;
                const maxVal = Math.max(...data.map(val), 100);
                const yOf = (d) => 100 - (val(d) / maxVal) * 80 - 10;
                // 진단을 막 시작해 기간이 하나뿐이면 (i / (length - 1)) 이 0/0 이 된다.
                // 좌표가 NaN 인 polyline 은 SVG 오류를 내고 차트가 통째로 사라진다.
                // 첫 달에 반드시 지나가는 상태라 한 점일 때는 짧은 가로선으로 그린다.
                const points = data.length === 1
                    ? `120,${yOf(data[0])} 180,${yOf(data[0])}`
                    : data.map((d, i) => `${(i / (data.length - 1)) * 280 + 10},${yOf(d)}`).join(" ");
                return (<div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 h-full"><h3 className="font-bold text-slate-800 mb-6 flex items-center gap-2"><Icon name="activity" size={20} className="text-brand-500" /> 몰입도(eNPS) 추이</h3><div className="relative h-40 w-full mt-4"><svg viewBox="0 0 300 100" className="w-full h-full overflow-visible"><polyline points={points} fill="none" stroke="#d92b2b" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="chart-path"/><div className="flex justify-between text-xs text-slate-400 mt-2">{data.map((d, i) => <span key={i}>{d.label}</span>)}</div></svg></div></div>);
            };
            const VoEWidget = () => {
                const allKeywords = teamStats.reduce((acc, team) => { if (team.keywords && Array.isArray(team.keywords)) team.keywords.forEach(k => { acc[k] = (acc[k] || 0) + 1; }); return acc; }, {});
                const keywords = Object.entries(allKeywords).map(([text, count]) => ({ text, count })).sort((a,b) => b.count - a.count);
                return (<div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 h-full"><h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Icon name="message-circle" size={20} className="text-brand-500" /> 구성원의 목소리 (VoE)</h3><div className="flex flex-wrap gap-2 content-start h-40 overflow-y-auto">{keywords.length === 0 ? <p className="text-sm text-slate-400 w-full text-center mt-10">등록된 키워드가 없습니다.</p> : keywords.map((k, i) => <span key={i} className="px-3 py-1.5 rounded-full text-sm font-medium border border-slate-200 bg-slate-50 text-slate-600">{k.text} <span className="text-xs opacity-50 ml-1">{k.count}</span></span>)}</div></div>);
            };
            const ScorePill = ({ value }) => {
                const score = Number(value);
                const tone = score <= 2.5 ? 'bg-red-50 text-red-700 border-red-100' : score <= 3.4 ? 'bg-amber-50 text-amber-700 border-amber-100' : 'bg-green-50 text-green-700 border-green-100';
                return <span className={`px-2 py-1 rounded text-xs font-bold border ${Number.isFinite(score) ? tone : 'bg-slate-50 text-slate-400 border-slate-100'}`}>{Number.isFinite(score) ? score.toFixed(1) : '-'}</span>;
            };

            return (
                <div className="space-y-6 fade-in">
                    <div className="bg-brand-50 border border-brand-100 p-3 rounded-lg text-sm text-brand-800 flex items-center gap-2 mb-4"><Icon name="calendar" size={16} /> 현재 조회 중인 데이터: <span className="font-bold">{currentPeriod}</span></div>
                    <ReviewQueueCard setView={setView} />
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">{/* 아이콘 타일은 네 장 모두 같은 브랜드 톤으로 통일하고, 좋고 나쁨은 오른쪽 증감 배지로만 나타낸다. */}<KPICard metric={{...globalMetrics.enps, icon: "users", color: "text-brand-600 bg-brand-50"}} /><KPICard metric={{...globalMetrics.safety, icon: "shield-check", color: "text-brand-600 bg-brand-50"}} /><KPICard metric={{...globalMetrics.burnout, icon: "flame", color: "text-brand-600 bg-brand-50", unit: "%"}} /><KPICard metric={{...globalMetrics.growth, icon: "trending-up", color: "text-brand-600 bg-brand-50", unit: "%"}} /></div>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6"><div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-100 p-6"><h3 className="font-bold text-slate-800 mb-6 flex items-center gap-2"><Icon name="bar-chart-2" size={20} className="text-slate-400" /> 팀별 조직진단 히트맵 ({currentPeriod})</h3><div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="bg-slate-50"><tr><th className="p-3">팀명</th><th className="p-3">상태</th><th className="p-3">핵심 위험요인</th><th className="p-3 text-center">업무</th><th className="p-3 text-center">안전감</th><th className="p-3 text-center">성장</th><th className="p-3 text-center">몰입</th></tr></thead><tbody>{teamStats.map(t => (<tr key={t.id} className="border-b"><td className="p-3 font-medium">{t.name}</td><td className="p-3"><span className={`w-2 h-2 rounded-full inline-block mr-2 ${t.status === '심각' ? 'bg-red-600' : t.status === '위험' ? 'bg-amber-500' : t.status === '표본부족' ? 'bg-slate-300' : 'bg-green-500'}`}></span>{t.status}</td><td className="p-3 text-slate-500">{t.status === '표본부족' ? `응답 ${t.responseCount || 0}명 · ${PULSE_MIN_N}명 미만이라 집계하지 않음` : (t.diagnosisDrivers || []).length > 0 ? t.diagnosisDrivers.join(', ') : '특이 리스크 없음'}</td><td className="p-3 text-center"><ScorePill value={t.diagnosisScores?.workload} /></td><td className="p-3 text-center"><ScorePill value={t.diagnosisScores?.safety} /></td><td className="p-3 text-center"><ScorePill value={t.diagnosisScores?.growth} /></td><td className="p-3 text-center"><ScorePill value={t.diagnosisScores?.engagement} /></td></tr>))}</tbody></table></div><p className="text-xs text-slate-400 mt-3">응답이 {PULSE_MIN_N}명 미만인 팀은 응답자가 특정될 수 있어 점수를 산출하지 않습니다.</p></div><div className="lg:col-span-1 h-full"><ActionBoardWidget user={user} /></div></div>
                    <div className="h-64"><TrendChart data={chartData.trend} /></div>
                </div>
            );
        };

        const ReportView = ({ globalMetrics, teamStats }) => {
            const handlePrint = () => window.print();
            const riskyTeams = teamStats.filter(t => t.status === '위험' || t.status === '심각');
            return (
                <div className="max-w-4xl mx-auto bg-white shadow-lg p-10 min-h-screen fade-in print:shadow-none print:p-0">
                    <div className="flex justify-between items-center mb-10 no-print">
                        <h2 className="text-lg font-bold text-slate-500">보고서 미리보기</h2>
                        <button onClick={handlePrint} className="bg-brand-600 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-brand-700 shadow-brand transition-colors">
                            <Icon name="printer" size={16} /> PDF 저장 / 인쇄
                        </button>
                    </div>
                    <div className="border-b-2 border-slate-800 pb-4 mb-8">
                        <div><h1 className="text-3xl font-bold text-slate-900">월간 조직 건강도 보고서 (Monthly HR Health)</h1><p className="text-slate-500 mt-2">{new Date().toLocaleDateString()}</p></div>
                    </div>
                    <div className="grid grid-cols-4 gap-4 bg-slate-50 p-6 rounded-xl border border-slate-200 mb-8">
                        <div className="text-center border-r"><div className="text-xs text-slate-500">eNPS</div><div className="text-2xl font-bold text-brand-600">{globalMetrics.enps?.value}</div></div>
                        <div className="text-center border-r"><div className="text-xs text-slate-500">안전감</div><div className="text-2xl font-bold text-green-600">{globalMetrics.safety?.value}</div></div>
                        <div className="text-center border-r"><div className="text-xs text-slate-500">번아웃</div><div className="text-2xl font-bold text-red-600">{globalMetrics.burnout?.value}</div></div>
                        <div className="text-center"><div className="text-xs text-slate-500">성장</div><div className="text-2xl font-bold text-brand-600">{globalMetrics.growth?.value}</div></div>
                    </div>
                    <div className="space-y-6">
                        <h3 className="text-xl font-bold border-l-4 border-red-500 pl-3">리스크 진단 (Risk Assessment)</h3>
                        <table className="w-full text-sm text-left border-collapse border border-slate-300">
                            <thead className="bg-slate-100"><tr><th className="border p-2">부서명</th><th className="border p-2">상태</th><th className="border p-2">이슈</th></tr></thead>
                            <tbody>
                                {riskyTeams.length > 0 ? riskyTeams.map(t => (
                                    <tr key={t.id}><td className="border p-2 font-bold">{t.name}</td><td className="border p-2 text-red-600">{t.status}</td><td className="border p-2">{(t.diagnosisDrivers || []).length > 0 ? t.diagnosisDrivers.join(', ') : (t.workload === '과부하' ? '업무 과다' : '관계 갈등')}</td></tr>
                                )) : <tr><td colSpan="3" className="border p-4 text-center">리스크 없음</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // --- REAL AI Plan Generation Modal with Mock Fallback ---
        const SolutionGeneratorModal = ({ solution, onClose, aiConfig }) => {
            const [step, setStep] = useState('initializing'); 
            const [aiPlan, setAiPlan] = useState(null);
            const [errorMessage, setErrorMessage] = useState("");
            const [usedModel, setUsedModel] = useState("");
            const [isMock, setIsMock] = useState(false);
            
            // Mock Data Generator
            const generateMockPlan = (cat) => {
                const plans = {
                    'Resource': {
                        steps: [
                            {title: "직무 분석 및 병목 확인 (1주차)", desc: "팀원 개별 인터뷰를 통해 비효율 업무 식별 및 R&R 재조정"},
                            {title: "단기 리소스 재배치 (2주차)", desc: "유관 부서 협조 요청 또는 프리랜서 활용 예산 확보"},
                            {title: "채용 프로세스 가동 (3~6주차)", desc: "직무 기술서(JD) 업데이트 및 채용 공고 게시"}
                        ]
                    },
                    'Culture': {
                        steps: [
                            {title: "심리적 안전감 진단 (1주차)", desc: "익명 심층 인터뷰를 통해 갈등의 근본 원인 파악"},
                            {title: "관계 해소 워크숍 (2주차)", desc: "외부 퍼실리테이터 초빙, '솔직한 대화' 세션 운영"},
                            {title: "그라운드 룰 재정립 (3주차)", desc: "팀 내 소통 방식 및 피드백 규칙 합의"}
                        ]
                    },
                    'Growth': {
                        steps: [
                            {title: "개인별 커리어 골 설정 (1주차)", desc: "구성원별 성장 욕구 파악 및 IDP(개인개발계획) 수립"},
                            {title: "사내 멘토링 매칭 (2주차)", desc: "시니어 리더와 주니어 간의 1:1 매칭 지원"},
                            {title: "월간 성장 리뷰 (지속)", desc: "매월 마지막 주 금요일, 성과가 아닌 '성장' 중심의 리뷰 진행"}
                        ]
                    }
                };
                return plans[cat] || plans['Growth'];
            };

            useEffect(() => {
                const runProcess = async () => {
                    try {
                        setStep('initializing');
                        const apiKey = String(aiConfig?.apiKey || '').trim();
                        const savedModel = String(aiConfig?.selectedModel || '').trim();
                        const apiVersion = "v1beta";
                        const fallbackModels = [savedModel, "gemini-1.5-flash", "gemini-1.5-pro"].filter(Boolean);
                        const modelsToTry = [...new Set(fallbackModels)];

                        if (!apiKey) {
                            throw new Error("API key not configured");
                        }

                        const prompt = `
                            You are a top-tier HR consultant.
                            The team has a specific issue:
                            - Category: ${solution.category}
                            - Issue Title: ${solution.title}
                            - Description: ${solution.desc}
                            
                            Please provide a very concrete, actionable 3-step solution plan.
                            Return ONLY a valid JSON object:
                            {
                              "steps": [
                                {"title": "Step 1 Title", "desc": "Desc"},
                                {"title": "Step 2 Title", "desc": "Desc"},
                                {"title": "Step 3 Title", "desc": "Desc"}
                              ]
                            }
                            Respond in Korean.
                        `;

                        for (const targetModel of modelsToTry) {
                            try {
                                const genUrl = `https://generativelanguage.googleapis.com/${apiVersion}/models/${targetModel}:generateContent?key=${apiKey}`;
                                const response = await fetch(genUrl, {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                                });
                                const data = await response.json();
                                if (data.error) throw new Error(data.error.message);
                                if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                                    const rawText = data.candidates[0].content.parts[0].text;
                                    const jsonText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                                    const parsedPlan = JSON.parse(jsonText);
                                    setAiPlan(parsedPlan);
                                    setUsedModel(targetModel);
                                    setIsMock(false);
                                    setStep('content');
                                    return;
                                }
                                throw new Error("No output");
                            } catch (e) {
                                console.warn(`Model failed: ${targetModel}`, e);
                            }
                        }

                        await new Promise(r => setTimeout(r, 1000));
                        setAiPlan(generateMockPlan(solution.category));
                        setUsedModel("Simulation Mode (Model Fallback)");
                        setIsMock(true);
                        setStep('content');

                    } catch (e) {
                        console.error("Fatal Error:", e);
                        setAiPlan(generateMockPlan(solution.category));
                        setUsedModel("Simulation Mode (API Key Missing/Error)");
                        setIsMock(true);
                        setStep('content');
                    }
                };

                runProcess();
            }, [solution, aiConfig]);

            const savePlan = async () => {
                if(!aiPlan) return;
                try {
                    for (const step of aiPlan.steps) {
                        await window.firestore.addDoc(window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'action_items'), { 
                            text: `[AI 제안] ${step.title}: ${step.desc}`, 
                            completed: false, 
                            createdAt: window.firestore.serverTimestamp(),
                            createdBy: isMock ? 'AI_SIMULATOR' : 'AI_AGENT'
                        });
                    }
                    alert("AI가 제안한 실행 계획이 실행 과제 목록에 추가되었습니다.");
                    onClose();
                } catch(e) {
                    console.error("Save error", e);
                    alert("저장 실패");
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[100] p-4 fade-in backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 border border-slate-200 relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icon name="x" size={20}/></button>
                        
                        <div className="mb-6 flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-brand-500 to-brand-600 rounded-lg flex items-center justify-center text-white">
                                <Icon name="sparkles" size={20} />
                            </div>
                            <div>
                                <h3 className="font-bold text-lg text-slate-800">AI 맞춤형 솔루션 생성</h3>
                                <p className="text-xs text-slate-500">Google Gemini 엔진 기반</p>
                            </div>
                        </div>

                        {step === 'initializing' && (
                            <div className="py-12 text-center">
                                <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-slate-400 mx-auto mb-4"></div>
                                <p className="text-slate-600 font-medium">최적의 AI 모델 탐색 중...</p>
                            </div>
                        )}

                        {step === 'loading' && (
                            <div className="py-12 text-center">
                                <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-brand-600 mx-auto mb-4"></div>
                                <p className="text-slate-600 font-medium animate-pulse">조직 데이터를 분석하여 최적의 실행 계획을 생성 중입니다...</p>
                            </div>
                        )}

                        {step === 'content' && aiPlan && (
                            <div className="animate-fade-in">
                                <div className="mb-4">
                                    <h4 className="text-sm font-bold text-slate-700 mb-1">제안 배경</h4>
                                    <p className="text-sm text-slate-600 bg-slate-50 p-3 rounded">{solution.desc}</p>
                                </div>
                                <h4 className="text-sm font-bold text-slate-700 mb-3">🚀 AI가 제안하는 3단계 실행 계획</h4>
                                <div className="space-y-4">
                                    {aiPlan.steps.map((s, i) => (
                                        <div key={i} className="p-3 bg-brand-50/50 rounded border border-brand-100">
                                            <h4 className="font-bold text-brand-800 text-sm">{s.title}</h4>
                                            <p className="text-xs text-slate-700 mt-1">{s.desc}</p>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-6 flex justify-end gap-2">
                                    <button onClick={onClose} className="px-4 py-2 text-slate-500 hover:bg-slate-50 rounded text-sm">닫기</button>
                                    <button onClick={savePlan} className="px-4 py-2 bg-brand-600 text-white rounded text-sm font-bold hover:bg-brand-700 shadow-md">실행 계획 저장</button>
                                </div>
                                <p className="text-[10px] text-slate-400 mt-2 text-right">
                                    {isMock && "⚠️ API 한도 초과로 시뮬레이션 모드로 전환되었습니다."} 
                                    생성 모델: {usedModel}
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const AnalysisView = ({ teamStats, globalMetrics, chartData, currentPeriod, aiConfig }) => {
            const [selectedSolution, setSelectedSolution] = useState(null);
            const toNumber = (val, fallback = 0) => {
                const parsed = parseFloat(String(val ?? '').replace(/[^\d.-]/g, ''));
                return Number.isFinite(parsed) ? parsed : fallback;
            };

            const burnoutScore = toNumber(globalMetrics?.burnout?.value, 0);
            const safetyScore = toNumber(globalMetrics?.safety?.value, 0);
            const enpsScore = toNumber(globalMetrics?.enps?.value, 0);

            const trendData = Array.isArray(chartData?.trend) ? chartData.trend : [];
            const trendDelta = trendData.length >= 2
                ? toNumber(trendData[trendData.length - 1].value, 0) - toNumber(trendData[trendData.length - 2].value, 0)
                : 0;

            const teamRiskRows = useMemo(() => {
                return (teamStats || []).map((team) => {
                    let riskScore = 0;
                    const drivers = [];
                    const scores = team.diagnosisScores || {};
                    const lowScore = (key) => Number(scores[key]) > 0 && Number(scores[key]) <= 2.5;
                    if (team.status === '심각') { riskScore += 45; drivers.push('상태 심각'); }
                    else if (team.status === '위험') { riskScore += 35; drivers.push('상태 위험'); }
