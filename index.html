                                <p className="text-sm text-slate-500">등록된 팀 데이터가 없습니다.</p>
                            ) : (
                                <div className="space-y-3">
                                    {teamRiskRows.slice(0, 6).map(team => (
                                        <div key={team.id} className="bg-white p-3 rounded-lg border border-slate-200">
                                            <div className="flex justify-between items-center">
                                                <p className="font-bold text-slate-800">{team.name}</p>
                                                <span className={`text-xs font-bold px-2 py-1 rounded ${team.riskLevel === 'high' ? 'bg-red-100 text-red-700' : team.riskLevel === 'medium' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'}`}>
                                                    Risk {team.riskScore}
                                                </span>
                                            </div>
                                            <p className="text-xs text-slate-500 mt-1">{team.drivers.length > 0 ? team.drivers.join(' · ') : '특이 리스크 없음'}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                            <h3 className="font-bold text-slate-800 mb-4">핵심 이슈 키워드</h3>
                            {keywordRank.length === 0 ? (
                                <p className="text-sm text-slate-500">키워드 데이터가 없습니다.</p>
                            ) : (
                                <div className="flex flex-wrap gap-2">
                                    {keywordRank.map((k) => (
                                        <span key={k.text} className="px-3 py-1.5 rounded-full text-sm bg-white border border-slate-200 text-slate-700">
                                            {k.text} <span className="text-xs text-slate-400 ml-1">{k.count}</span>
                                        </span>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    <div>
                        <h3 className="font-bold text-slate-700 mb-4 text-lg">맞춤형 개선 솔루션</h3>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                            {recommendations.map((rec, idx) => (
                                <div key={idx} className="bg-white border border-slate-200 p-5 rounded-xl shadow-sm relative overflow-hidden">
                                    <div className={`absolute top-0 left-0 w-1 h-full ${rec.type === 'urgent' ? 'bg-red-500' : rec.type === 'warning' ? 'bg-amber-500' : 'bg-green-500'}`}></div>
                                    <div className="flex justify-between items-center mb-2">
                                        <span className={`text-xs font-bold px-2 py-1 rounded uppercase ${rec.type === 'urgent' ? 'bg-red-100 text-red-700' : rec.type === 'warning' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'}`}>{rec.category}</span>
                                        <span className="text-[11px] text-slate-400">우선순위 {rec.priorityScore}</span>
                                    </div>
                                    <h4 className="font-bold text-slate-900 text-md mb-1">{rec.title}</h4>
                                    <p className="text-sm text-slate-600 mb-4 leading-relaxed">{rec.desc}</p>
                                    <button 
                                        onClick={() => setSelectedSolution(rec)}
                                        className="w-full py-2 border border-brand-200 bg-brand-50 rounded-lg text-sm font-bold text-brand-700 hover:bg-brand-600 hover:border-brand-600 hover:text-white transition-colors flex items-center justify-center gap-2"
                                    >
                                        <Icon name="check-square" size={16}/> {rec.action} 계획 수립
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {selectedSolution && (
                        <SolutionGeneratorModal 
                            solution={selectedSolution} 
                            aiConfig={aiConfig}
                            onClose={() => setSelectedSolution(null)} 
                        />
                    )}
                </div>
            );
        };

        const DataManagementView = ({ teamStats, currentPeriod }) => {
            const [responses, setResponses] = useState([]);
            const [loading, setLoading] = useState(true);
            const syncedEmptyPeriodRef = useRef("");

            useEffect(() => {
                if(!window.db) return;
                setLoading(true);
                // Modified: removed where clause to avoid index issues, doing client-side filtering
                const q = window.firestore.query(
                    window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'survey_responses')
                );

                const unsubscribe = window.firestore.onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs
                        .map(doc => {
                            const rawData = doc.data();
                            const team = teamStats.find(t => t.id === rawData.teamId);
                            return {
                                id: doc.id,
                                ...rawData,
                                teamName: team ? team.name : 'Unknown Team',
                                date: rawData.createdAt ? new Date(rawData.createdAt.seconds * 1000).toLocaleString() : 'N/A',
                                createdAtSeconds: rawData.createdAt ? rawData.createdAt.seconds : 0
                            };
                        })
                        // Client-side filtering for period
                        .filter(item => item.period === currentPeriod);
                    
                    // Sort locally
                    data.sort((a, b) => b.createdAtSeconds - a.createdAtSeconds);
                    
                    setResponses(data);
                    setLoading(false);

                    if (data.length === 0 && syncedEmptyPeriodRef.current !== currentPeriod) {
                        syncedEmptyPeriodRef.current = currentPeriod;
                        calculatePeriodStats(window.db, currentPeriod, teamStats, true).catch((e) => {
                            console.error("Empty-state sync failed:", e);
                        });
                    }
                    if (data.length > 0) {
                        syncedEmptyPeriodRef.current = "";
                    }
                }, (error) => {
                    console.error("Error fetching responses:", error);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, [currentPeriod, teamStats]);

            const handleDelete = async (id) => {
                if(!confirm("이 데이터를 영구적으로 삭제하시겠습니까?")) return;
                await window.firestore.deleteDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'survey_responses', id));
                // Auto calc on delete
                await calculatePeriodStats(window.db, currentPeriod, teamStats, true); 
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 fade-in h-full flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <Icon name="database" className="text-brand-600"/> 데이터 관리 (Data Management)
                        </h2>
                        <span className="text-sm text-slate-500">
                            기간: <span className="font-bold text-slate-800">{currentPeriod}</span> | 총 <span className="font-bold text-brand-600">{responses.length}</span>건
                        </span>
                    </div>

                    <div className="flex-1 overflow-auto border rounded-lg">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 sticky top-0 z-10 text-slate-700 uppercase text-xs">
                                <tr>
                                    <th className="p-3 border-b">일시</th>
                                    <th className="p-3 border-b">팀명</th>
                                    {PULSE_FIELDS.map(field => (
                                        <th key={field.id} className="p-3 border-b text-center whitespace-nowrap">{field.label}</th>
                                    ))}
                                    <th className="p-3 border-b">키워드 (Voice)</th>
                                    <th className="p-3 border-b text-center">관리</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {loading ? (
                                    <tr><td colSpan={PULSE_FIELDS.length + 4} className="p-8 text-center text-slate-500">데이터를 불러오는 중...</td></tr>
                                ) : responses.length === 0 ? (
                                    <tr><td colSpan={PULSE_FIELDS.length + 4} className="p-8 text-center text-slate-500">해당 기간에 등록된 데이터가 없습니다.</td></tr>
                                ) : (
                                    responses.map(res => (
                                        <tr key={res.id} className="hover:bg-slate-50 transition-colors">
                                            <td className="p-3 text-slate-500 text-xs whitespace-nowrap">{res.date}</td>
                                            <td className="p-3 font-medium text-slate-800 whitespace-nowrap">{res.teamName}</td>
                                            {PULSE_FIELDS.map(field => (
                                                <td key={field.id} className="p-3 text-center">
                                                    <span className="bg-slate-100 px-2 py-1 rounded text-xs font-bold">{res[field.id] ?? '-'}</span>
                                                </td>
                                            ))}
                                            <td className="p-3 text-slate-600 text-xs italic max-w-xs truncate" title={res.keywords}>{res.keywords || '-'}</td>
                                            <td className="p-3 text-center">
                                                <button onClick={() => handleDelete(res.id)} className="text-slate-400 hover:text-red-600 transition-colors p-1" title="삭제">
                                                    <Icon name="trash-2" size={14}/>
                                                </button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const PulseScoreBadge = ({ value }) => {
            const score = Number(value);
            if (!Number.isFinite(score)) return <span className="px-2 py-1 rounded text-xs font-bold border bg-slate-50 text-slate-400 border-slate-100">-</span>;
            const tone = score <= 2.5 ? 'bg-red-50 text-red-700 border-red-100' : score <= 3.4 ? 'bg-amber-50 text-amber-700 border-amber-100' : 'bg-green-50 text-green-700 border-green-100';
            return <span className={`px-2 py-1 rounded text-xs font-bold border ${tone}`}>{score.toFixed(1)}</span>;
        };

        const PulseInsightView = ({ teamStats, currentPeriod }) => {
            const [responses, setResponses] = useState([]);
            const [loading, setLoading] = useState(true);
            const [teamFilter, setTeamFilter] = useState("전체");
            const [search, setSearch] = useState("");
            const [selected, setSelected] = useState(null);

            useEffect(() => {
                if (!window.db) return;
                setLoading(true);
                const q = window.firestore.query(
                    window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'survey_responses')
                );
                const unsubscribe = window.firestore.onSnapshot(q, (snapshot) => {
                    const list = snapshot.docs
                        .map(doc => {
                            const rawData = doc.data();
                            const scores = PULSE_FIELDS.map(f => Number(rawData[f.id]) || 0);
                            const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0;
                            const lowFields = PULSE_FIELDS.filter(f => Number(rawData[f.id]) <= 2);
                            const comments = rawData.comments || {};
                            return {
                                id: doc.id,
                                ...rawData,
                                teamName: getTeamName(teamStats, rawData.teamId),
                                avg,
                                lowFields,
                                comments,
                                createdAtSeconds: rawData.createdAt ? rawData.createdAt.seconds : 0
                            };
                        })
                        .filter(item => item.period === currentPeriod);
                    list.sort((a, b) => b.createdAtSeconds - a.createdAtSeconds);
                    setResponses(list);
                    setLoading(false);
                }, (error) => {
                    console.error("Error fetching pulse responses:", error);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [currentPeriod, teamStats]);

            const filteredResponses = useMemo(() => {
                const keyword = search.trim().toLowerCase();
                return responses.filter(item => {
                    if (teamFilter !== "전체" && item.teamId !== teamFilter) return false;
                    if (!keyword) return true;
                    const haystack = [
                        item.teamName,
                        item.keywords,
                        ...Object.values(item.comments || {})
                    ].join(" ").toLowerCase();
                    return haystack.includes(keyword);
                });
            }, [responses, teamFilter, search]);

            const stats = useMemo(() => {
                const total = responses.length;
                const avgAll = total ? responses.reduce((a, r) => a + r.avg, 0) / total : 0;
                const lowRiskCount = responses.filter(r => r.lowFields.length >= 3).length;
                const commentCount = responses.filter(r => Object.keys(r.comments || {}).length > 0).length;
                return { total, avgAll, lowRiskCount, commentCount };
            }, [responses]);

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 fade-in h-full flex flex-col">
                    <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                        <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <Icon name="bar-chart-2" className="text-brand-600" /> 조직진단 현황 (Pulse Survey)
                        </h2>
                        <span className="text-sm text-slate-500">
                            기간: <span className="font-bold text-slate-800">{currentPeriod}</span> | 총 <span className="font-bold text-brand-600">{responses.length}</span>건
                        </span>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-slate-50 rounded-xl p-4 border border-slate-100"><p className="text-xs text-slate-500">총 응답</p><p className="text-2xl font-bold text-slate-800">{stats.total}건</p></div>
                        <div className="bg-slate-50 rounded-xl p-4 border border-slate-100"><p className="text-xs text-slate-500">평균 종합점수</p><p className="text-2xl font-bold text-brand-600">{stats.total ? stats.avgAll.toFixed(1) : '-'}</p></div>
                        <div className="bg-red-50 rounded-xl p-4 border border-red-100"><p className="text-xs text-red-600">위험 응답(저점 3개↑)</p><p className="text-2xl font-bold text-red-700">{stats.lowRiskCount}건</p></div>
                        {/* 옆의 '위험 응답'이 눈에 띄도록, 단순 집계 항목은 중립색으로 둔다. */}
                        <div className="bg-slate-50 rounded-xl p-4 border border-slate-200"><p className="text-xs text-slate-500">사유 코멘트 등록</p><p className="text-2xl font-bold text-slate-800">{stats.commentCount}건</p></div>
                    </div>

                    <div className="flex flex-wrap gap-3 mb-4">
                        <select value={teamFilter} onChange={e => setTeamFilter(e.target.value)} className="border border-slate-200 rounded-lg px-3 py-2 text-sm">
                            <option value="전체">전체 부서</option>
                            {teamStats.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                        </select>
                        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="키워드/코멘트 검색" className="flex-1 min-w-[200px] border border-slate-200 rounded-lg px-3 py-2 text-sm" />
                    </div>

                    <div className="flex-1 overflow-auto border rounded-lg">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 sticky top-0 z-10 text-slate-700 uppercase text-xs">
                                <tr>
                                    <th className="p-3 border-b">일시</th>
                                    <th className="p-3 border-b">팀명</th>
                                    <th className="p-3 border-b text-center">종합점수</th>
                                    <th className="p-3 border-b text-center">저점 지표</th>
                                    <th className="p-3 border-b">키워드</th>
                                    <th className="p-3 border-b text-center">코멘트</th>
                                    <th className="p-3 border-b text-center">상세</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {loading ? (
                                    <tr><td colSpan={7} className="p-8 text-center text-slate-500">데이터를 불러오는 중...</td></tr>
                                ) : filteredResponses.length === 0 ? (
                                    <tr><td colSpan={7} className="p-8 text-center text-slate-500">해당 조건에 등록된 데이터가 없습니다.</td></tr>
                                ) : (
                                    filteredResponses.map(res => (
                                        <tr key={res.id} className="hover:bg-slate-50 transition-colors">
                                            <td className="p-3 text-slate-500 text-xs whitespace-nowrap">{formatDateTime(res.createdAt)}</td>
                                            <td className="p-3 font-medium text-slate-800 whitespace-nowrap">{res.teamName}</td>
                                            <td className="p-3 text-center"><PulseScoreBadge value={res.avg} /></td>
                                            <td className="p-3 text-center">{res.lowFields.length > 0 ? <span className="text-xs font-bold text-red-600">{res.lowFields.length}개</span> : <span className="text-xs text-slate-400">없음</span>}</td>
                                            <td className="p-3 text-slate-600 text-xs italic max-w-xs truncate" title={res.keywords}>{res.keywords || '-'}</td>
                                            <td className="p-3 text-center">{Object.keys(res.comments || {}).length > 0 ? <Icon name="message-circle" size={14} className="text-brand-500 inline-block" /> : '-'}</td>
                                            <td className="p-3 text-center">
                                                <button onClick={() => setSelected(res)} className="text-brand-600 hover:underline text-xs font-bold">보기</button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>

                    {selected && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[100] p-4 fade-in backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[88vh] overflow-y-auto border border-slate-200">
                                <div className="p-5 border-b border-slate-100 flex items-start justify-between gap-4 sticky top-0 bg-white">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-900">{selected.teamName}</h3>
                                        <p className="text-xs text-slate-500 mt-1">{formatDateTime(selected.createdAt)}</p>
                                    </div>
                                    <button onClick={() => setSelected(null)} className="text-slate-400 hover:text-slate-700"><Icon name="x" size={22} /></button>
                                </div>
                                <div className="p-5 space-y-3">
                                    {PULSE_FIELDS.map(f => (
                                        <div key={f.id} className="border border-slate-100 rounded-xl p-4 bg-slate-50">
                                            <div className="flex items-center justify-between mb-1">
                                                <span className="font-bold text-slate-800 text-sm">{f.label}</span>
                                                <PulseScoreBadge value={selected[f.id]} />
                                            </div>
                                            {selected.comments && selected.comments[f.id] && (
                                                <p className="text-xs text-red-700 bg-red-50 border border-red-100 rounded-lg p-2 mt-2">{selected.comments[f.id]}</p>
                                            )}
                                        </div>
                                    ))}
                                    <div className="border border-slate-100 rounded-xl p-4">
                                        <p className="text-xs text-slate-400 mb-1">키워드</p>
                                        <p className="text-sm text-slate-700">{selected.keywords || '등록된 키워드 없음'}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ComplaintManagementView = ({ teamStats, currentPeriod, user }) => {
            const [cases, setCases] = useState([]);
            const [loading, setLoading] = useState(true);
            const [statusFilter, setStatusFilter] = useState("전체");
            const [riskFilter, setRiskFilter] = useState("전체");
            const [search, setSearch] = useState("");
            const [selectedCase, setSelectedCase] = useState(null);
            const [detailDraft, setDetailDraft] = useState({ status: "접수", handler: "", adminMemo: "", outcome: "" });

            useEffect(() => {
                if (!window.db) return;
                setLoading(true);
                const q = window.firestore.query(
                    window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'complaint_cases')
                );
                const unsubscribe = window.firestore.onSnapshot(q, (snapshot) => {
                    const list = snapshot.docs
                        .map(doc => {
                            const rawData = doc.data();
                            return {
                                id: doc.id,
                                ...rawData,
                                teamName: rawData.teamNameSnapshot || getTeamName(teamStats, rawData.teamId),
                                createdAtSeconds: rawData.createdAt ? rawData.createdAt.seconds : 0
                            };
                        })
                        .filter(item => item.period === currentPeriod);
                    list.sort((a, b) => b.createdAtSeconds - a.createdAtSeconds);
                    setCases(list);
                    setLoading(false);
                }, (error) => {
                    console.error("Error fetching complaint cases:", error);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [currentPeriod, teamStats]);

            // 상세 모달을 열어둔 사이에 신고자가 메시지를 보내면 바로 보이도록,
            // 실시간 목록에서 해당 건의 대화만 따라간다. (입력 중인 detailDraft 는 건드리지 않는다)
            useEffect(() => {
                if (!selectedCase) return;
                const live = cases.find(c => c.id === selectedCase.id);
                if (!live) return;
                const liveLen = (live.thread || []).length;
                const shownLen = (selectedCase.thread || []).length;
                if (liveLen !== shownLen) setSelectedCase(prev => ({ ...prev, thread: live.thread || [] }));
            }, [cases, selectedCase]);

            const openCase = (item) => {
                setSelectedCase(item);
                setDetailDraft({
                    status: item.status || "접수",
                    handler: item.handler || "",
                    adminMemo: item.adminMemo || "",
                    outcome: item.outcome || ""
                });
            };

            const filteredCases = useMemo(() => {
                const keyword = search.trim().toLowerCase();
                return cases.filter(item => {
                    if (statusFilter !== "전체" && item.status !== statusFilter) return false;
                    if (riskFilter !== "전체" && item.riskLevel !== riskFilter) return false;
                    if (!keyword) return true;
                    const haystack = [
                        item.caseNo,
                        item.subject,
                        item.details,
                        item.teamName,
                        getCategoryLabel(item.category),
                        item.relatedParty,
                        item.handler
                    ].join(" ").toLowerCase();
                    return haystack.includes(keyword);
                });
            }, [cases, statusFilter, riskFilter, search]);

            const stats = useMemo(() => ({
                total: cases.length,
                open: cases.filter(c => c.status !== "종결").length,
                high: cases.filter(c => c.riskLevel === "high").length,
                protection: cases.filter(c => c.protectionRequest === "yes").length
            }), [cases]);

            const appendHistory = (item, action, note) => {
                const history = Array.isArray(item.history) ? item.history : [];
                return [
                    ...history,
                    {
                        at: new Date().toISOString(),
                        actor: "관리자",
                        action,
                        note: note || "",
                        uid: user?.uid || ""
                    }
                ];
            };

            const saveCase = async () => {
                if (!selectedCase) return;
                const statusChanged = detailDraft.status !== selectedCase.status;
                const history = appendHistory(
                    selectedCase,
                    statusChanged ? `상태 변경: ${selectedCase.status || "접수"} → ${detailDraft.status}` : "상세 내용 저장",
                    statusChanged ? "처리 상태 업데이트" : "담당자/메모/결과 업데이트"
                );
                const patch = {
                    status: detailDraft.status,
                    handler: detailDraft.handler,
                    adminMemo: detailDraft.adminMemo,
                    outcome: detailDraft.outcome,
                    history,
                    updatedAt: window.firestore.serverTimestamp()
                };
                await window.firestore.updateDoc(
                    window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'complaint_cases', selectedCase.id),
                    patch
                );
                setSelectedCase({ ...selectedCase, ...patch });
                alert("저장되었습니다.");
            };

            const sendReply = async (text) => {
                if (!selectedCase) return;
                const thread = appendThreadMessage(selectedCase, 'admin', text);
                await window.firestore.updateDoc(
                    window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'complaint_cases', selectedCase.id),
                    { thread, updatedAt: window.firestore.serverTimestamp() }
                );
                setSelectedCase({ ...selectedCase, thread });
            };

            const quickStatus = async (item, nextStatus) => {
                const history = appendHistory(item, `상태 변경: ${item.status || "접수"} → ${nextStatus}`, "목록에서 빠른 변경");
                await window.firestore.updateDoc(
                    window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'complaint_cases', item.id),
                    { status: nextStatus, history, updatedAt: window.firestore.serverTimestamp() }
                );
            };

            const deleteCase = async (item) => {
                if (!confirm(`${item.caseNo || "선택 건"}을 삭제하시겠습니까? 삭제된 접수 건은 복구할 수 없습니다.`)) return;
                await window.firestore.deleteDoc(
                    window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'complaint_cases', item.id)
                );
                if (selectedCase?.id === item.id) setSelectedCase(null);
            };

            const statusTone = (status) => {
                if (status === "종결") return "bg-green-100 text-green-700 border-green-200";
                if (status === "조사중" || status === "조치중") return "bg-brand-100 text-brand-700 border-brand-200";
                if (status === "보류") return "bg-slate-100 text-slate-600 border-slate-200";
                return "bg-amber-100 text-amber-700 border-amber-200";
            };

            return (
                <div className="space-y-6 fade-in">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
                        <div className="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4 mb-6">
                            <div>
                                <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                    <Icon name="inbox" className="text-brand-600"/> 고충 처리함
                                </h2>
                                <p className="text-sm text-slate-500 mt-2">기준 기간: <span className="font-bold text-slate-700">{currentPeriod}</span></p>
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 lg:min-w-[520px]">
                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
                                    <p className="text-xs text-slate-500 font-bold">전체</p>
                                    <p className="text-2xl font-black text-slate-800">{stats.total}</p>
                                </div>
                                <div className="bg-amber-50 border border-amber-100 rounded-xl p-3">
                                    <p className="text-xs text-amber-600 font-bold">미종결</p>
                                    <p className="text-2xl font-black text-amber-700">{stats.open}</p>
                                </div>
                                <div className="bg-red-50 border border-red-100 rounded-xl p-3">
                                    <p className="text-xs text-red-600 font-bold">고위험</p>
                                    <p className="text-2xl font-black text-red-700">{stats.high}</p>
                                </div>
                                {/* 옆의 '고위험'(채운 레드)과 구분되도록 테두리형으로 둔다. */}
                                <div className="bg-white border border-brand-300 rounded-xl p-3">
                                    <p className="text-xs text-brand-600 font-bold">보호요청</p>
                                    <p className="text-2xl font-black text-brand-700">{stats.protection}</p>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-4 gap-3 mb-5">
                            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="접수번호, 제목, 부서 검색" className="md:col-span-2 border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-100" />
                            <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="border border-slate-200 rounded-lg px-3 py-2.5 text-sm bg-white">
                                <option value="전체">상태 전체</option>
                                {CASE_STATUS_OPTIONS.map(status => <option key={status} value={status}>{status}</option>)}
                            </select>
                            <select value={riskFilter} onChange={e => setRiskFilter(e.target.value)} className="border border-slate-200 rounded-lg px-3 py-2.5 text-sm bg-white">
                                <option value="전체">리스크 전체</option>
                                <option value="high">높음</option>
                                <option value="medium">보통</option>
                                <option value="low">낮음</option>
                            </select>
                        </div>

                        <div className="overflow-x-auto border border-slate-200 rounded-xl">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-slate-50 text-slate-600">
                                    <tr>
                                        <th className="p-3 border-b">접수번호</th>
                                        <th className="p-3 border-b">제목</th>
                                        <th className="p-3 border-b">부서</th>
                                        <th className="p-3 border-b">유형</th>
                                        <th className="p-3 border-b">리스크</th>
                                        <th className="p-3 border-b">상태</th>
                                        <th className="p-3 border-b">접수일</th>
                                        <th className="p-3 border-b text-center">관리</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {loading ? (
                                        <tr><td colSpan="8" className="p-8 text-center text-slate-500">접수 건을 불러오는 중...</td></tr>
                                    ) : filteredCases.length === 0 ? (
                                        <tr><td colSpan="8" className="p-8 text-center text-slate-500">조건에 맞는 접수 건이 없습니다.</td></tr>
                                    ) : (
                                        filteredCases.map(item => (
                                            <tr key={item.id} className="hover:bg-slate-50">
                                                <td className="p-3 text-xs font-bold text-slate-600 whitespace-nowrap">{item.caseNo || item.id.slice(0, 8)}</td>
                                                <td className="p-3 min-w-[220px]">
                                                    <div className="flex items-center gap-2 flex-wrap">
                                                        <button onClick={() => openCase(item)} className="font-bold text-slate-800 hover:text-brand-700 text-left">{item.subject || "-"}</button>
                                                        {/* 신고자가 마지막으로 메시지를 남긴 건은 놓치지 않도록 표시한다. */}
                                                        {isAwaitingReply(item) && (
                                                            <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-red-600 text-white whitespace-nowrap">답변 대기</span>
                                                        )}
                                                    </div>
                                                    <p className="text-xs text-slate-400 mt-1 line-clamp-1">{item.details}</p>
                                                </td>
                                                <td className="p-3 whitespace-nowrap">{item.teamName}</td>
                                                <td className="p-3 whitespace-nowrap">{getCategoryLabel(item.category)}</td>
                                                <td className="p-3 whitespace-nowrap"><RiskBadge level={item.riskLevel} /></td>
                                                <td className="p-3 whitespace-nowrap">
                                                    <select value={item.status || "접수"} onChange={e => quickStatus(item, e.target.value)} className={`border rounded-lg px-2 py-1 text-xs font-bold ${statusTone(item.status)}`}>
                                                        {CASE_STATUS_OPTIONS.map(status => <option key={status} value={status}>{status}</option>)}
                                                    </select>
                                                </td>
                                                <td className="p-3 text-xs text-slate-500 whitespace-nowrap">{formatDateTime(item.createdAt)}</td>
                                                <td className="p-3 text-center whitespace-nowrap">
                                                    <button onClick={() => openCase(item)} className="text-brand-600 hover:bg-brand-50 p-1.5 rounded" title="상세 보기"><Icon name="eye" size={16} /></button>
                                                    <button onClick={() => deleteCase(item)} className="text-slate-400 hover:text-red-600 hover:bg-red-50 p-1.5 rounded" title="삭제"><Icon name="trash-2" size={16} /></button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {selectedCase && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[100] p-4 fade-in backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl max-w-6xl w-full max-h-[92vh] overflow-hidden border border-slate-200 flex flex-col">
                                <div className="p-5 border-b border-slate-100 flex items-start justify-between gap-4">
                                    <div>
                                        <div className="flex flex-wrap items-center gap-2 mb-2">
                                            <span className="text-xs font-bold text-slate-600">{selectedCase.caseNo}</span>
                                            <RiskBadge level={selectedCase.riskLevel} />
                                            <span className={`px-2.5 py-1 rounded-full text-xs font-bold border ${statusTone(detailDraft.status)}`}>{detailDraft.status}</span>
                                        </div>
                                        <h3 className="text-lg font-bold text-slate-900">{selectedCase.subject}</h3>
                                        <p className="text-sm text-slate-500 mt-1">{selectedCase.teamName} · {getCategoryLabel(selectedCase.category)} · 긴급도 {getUrgencyLabel(selectedCase.urgency)}</p>
                                    </div>
                                    <button onClick={() => setSelectedCase(null)} className="text-slate-400 hover:text-slate-700"><Icon name="x" size={22} /></button>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-5 gap-0 overflow-y-auto">
                                    <div className="lg:col-span-3 p-5 space-y-5 border-r border-slate-100">
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
                                            <div className="bg-slate-50 rounded-lg p-3"><p className="text-xs text-slate-400">접수방식</p><p className="font-bold text-slate-800">{selectedCase.reporterMode === "named" ? "기명" : "익명"}</p></div>
                                            <div className="bg-slate-50 rounded-lg p-3"><p className="text-xs text-slate-400">발생일</p><p className="font-bold text-slate-800">{selectedCase.incidentDate || "-"}</p></div>
                                            <div className="bg-slate-50 rounded-lg p-3"><p className="text-xs text-slate-400">보호요청</p><p className="font-bold text-slate-800">{selectedCase.protectionRequest === "yes" ? "요청" : "없음"}</p></div>
                                            <div className="bg-slate-50 rounded-lg p-3"><p className="text-xs text-slate-400">연락동의</p><p className="font-bold text-slate-800">{selectedCase.allowContact === "yes" ? "동의" : "미동의"}</p></div>
                                        </div>

                                        {selectedCase.reporterMode === "named" && (
                                            <div className="bg-brand-50 border border-brand-100 rounded-xl p-4">
                                                <h4 className="font-bold text-brand-800 text-sm mb-2">신고자 정보</h4>
                                                <p className="text-sm text-slate-800">성명: {selectedCase.reporterName || "-"} · 연락처: {selectedCase.contact || "-"}</p>
                                            </div>
                                        )}

                                        <div>
                                            <h4 className="font-bold text-slate-800 mb-2">상세 내용</h4>
                                            <div className="whitespace-pre-wrap text-sm text-slate-700 leading-relaxed bg-slate-50 border border-slate-100 rounded-xl p-4 min-h-[150px]">{selectedCase.details}</div>
                                        </div>

                                        <div>
                                            <h4 className="font-bold text-slate-800 mb-2">희망 조치</h4>
                                            <div className="whitespace-pre-wrap text-sm text-slate-700 leading-relaxed bg-slate-50 border border-slate-100 rounded-xl p-4">{selectedCase.desiredAction || "-"}</div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <h4 className="font-bold text-slate-800 mb-2">관련자/관련부서</h4>
                                                <p className="text-sm text-slate-700 bg-slate-50 border border-slate-100 rounded-xl p-4">{selectedCase.relatedParty || "-"}</p>
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-slate-800 mb-2">리스크 플래그</h4>
                                                <div className="bg-slate-50 border border-slate-100 rounded-xl p-4 min-h-[54px]">
                                                    {(selectedCase.riskFlags || []).length === 0 ? (
                                                        <p className="text-sm text-slate-500">특이 플래그 없음</p>
                                                    ) : (
                                                        <div className="flex flex-wrap gap-2">
                                                            {selectedCase.riskFlags.map(flag => <span key={flag} className="px-2.5 py-1 rounded-full text-xs font-bold bg-red-50 text-red-700 border border-red-100">{flag}</span>)}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="lg:col-span-2 p-5 space-y-4 bg-slate-50">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">처리 상태</label>
                                            <select value={detailDraft.status} onChange={e => setDetailDraft({...detailDraft, status: e.target.value})} className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm bg-white">
                                                {CASE_STATUS_OPTIONS.map(status => <option key={status} value={status}>{status}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">담당자/담당부서</label>
                                            <input value={detailDraft.handler} onChange={e => setDetailDraft({...detailDraft, handler: e.target.value})} className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm bg-white" placeholder="예: 인사팀 홍길동" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">관리 메모</label>
                                            <textarea value={detailDraft.adminMemo} onChange={e => setDetailDraft({...detailDraft, adminMemo: e.target.value})} rows="5" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm bg-white resize-none" placeholder="초기 검토, 조사 필요사항, 보완자료 등을 기록" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">처리 결과</label>
                                            <textarea value={detailDraft.outcome} onChange={e => setDetailDraft({...detailDraft, outcome: e.target.value})} rows="5" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm bg-white resize-none" placeholder="조치 내용, 통보 여부, 후속관리 기준" />
                                        </div>
                                        <button onClick={saveCase} className="w-full bg-brand-600 text-white py-3 rounded-lg font-bold hover:bg-brand-700">저장</button>

                                        <div className="border-t border-slate-200 pt-4">
                                            <div className="flex items-center justify-between mb-1">
                                                <h4 className="font-bold text-slate-800">신고자와의 대화</h4>
                                                {isAwaitingReply(selectedCase) && (
                                                    <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-red-600 text-white">답변 대기</span>
                                                )}
                                            </div>
                                            <p className="text-xs text-slate-500 mb-3">
                                                {selectedCase.reporterMode === "named"
                                                    ? "접수번호와 PIN 으로 접속한 신고자에게 전달됩니다."
                                                    : "익명 신고자에게 신원 노출 없이 전달됩니다. 조사에 필요한 내용을 여기서 확인하세요."}
                                            </p>
                                            <CaseThread
                                                thread={selectedCase.thread}
                                                viewer="admin"
                                                onSend={sendReply}
                                                emptyText="아직 오간 메시지가 없습니다."
                                            />
                                        </div>

                                        <div className="border-t border-slate-200 pt-4">
                                            <h4 className="font-bold text-slate-800 mb-3">처리 이력</h4>
                                            <div className="space-y-2 max-h-[220px] overflow-y-auto">
                                                {(selectedCase.history || []).length === 0 ? (
                                                    <p className="text-sm text-slate-500">처리 이력이 없습니다.</p>
                                                ) : (
                                                    selectedCase.history.slice().reverse().map((h, idx) => (
                                                        <div key={`${h.at}-${idx}`} className="bg-white border border-slate-200 rounded-lg p-3">
                                                            <p className="text-xs font-bold text-slate-700">{h.action}</p>
                                                            <p className="text-[11px] text-slate-400 mt-1">{formatDateTime(h.at)} · {h.actor}</p>
                                                            {h.note && <p className="text-xs text-slate-500 mt-1">{h.note}</p>}
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const TeamManagementView = ({ teamStats, currentPeriod }) => {
            const [formData, setFormData] = useState({ name: '', workload: '적정', conflict: '낮음', leadership: '보통', status: '양호', keywords: [] });
            const [isEditing, setIsEditing] = useState(null);
            
            const handleSave = async (e) => { 
                e.preventDefault(); 
                const { collection, addDoc, doc, updateDoc, serverTimestamp } = window.firestore; 
                const data = { ...formData, period: currentPeriod, createdAt: serverTimestamp() }; 
                if (isEditing) await updateDoc(doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'team_stats', isEditing), formData); 
                else await addDoc(collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'team_stats'), data); 
                setFormData({ name: '', workload: '적정', conflict: '낮음', leadership: '보통', status: '양호', keywords: [] }); 
                setIsEditing(null); 
            };
            const handleDelete = async (id) => window.firestore.deleteDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'team_stats', id));
            
            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 fade-in">
                    <h2 className="text-lg font-bold text-slate-800 mb-2">팀 데이터 관리</h2>
                    {/* 단순 안내문은 중립색으로 — 레드는 오류/경고에만 쓴다. */}
                    <p className="text-sm text-slate-500 mb-4 font-medium">현재 선택된 기간: <span className="font-bold text-slate-700">{currentPeriod}</span> 에 데이터를 추가합니다.</p>
                    <form onSubmit={handleSave} className="grid grid-cols-1 md:grid-cols-6 gap-3 mb-6 bg-slate-50 p-4 rounded-lg"><input placeholder="팀명" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="md:col-span-2 border p-2 rounded text-sm" required /><select value={formData.workload} onChange={e => setFormData({...formData, workload: e.target.value})} className="border p-2 rounded text-sm"><option value="적정">업무: 적정</option><option value="과부하">업무: 과부하</option></select><select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="border p-2 rounded text-sm"><option value="양호">상태: 양호</option><option value="위험">상태: 위험</option></select><button className="bg-brand-600 text-white md:col-span-1 rounded font-bold text-sm">저장</button></form>
                    <div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="bg-slate-50"><tr><th className="p-3">팀명</th><th className="p-3">상태</th><th className="p-3">키워드(VoE)</th><th className="p-3">관리</th></tr></thead><tbody>{teamStats.map(t => (<tr key={t.id} className="border-b"><td className="p-3">{t.name}</td><td className="p-3"><Badge type={t.status === '위험' ? 'critical' : 'good'} text={t.status} /></td><td className="p-3 text-xs text-slate-500">{t.keywords ? t.keywords.join(", ") : "-"}</td><td className="p-3"><button onClick={() => handleDelete(t.id)} className="text-red-500 text-xs">삭제</button></td></tr>))}</tbody></table></div>
                </div>
            );
        };

        const SettingsView = ({ globalMetrics, chartData, availableYears, setAvailableYears, currentPeriod, teamStats, aiConfig }) => {
            const [form, setForm] = useState(globalMetrics);
            const [newYear, setNewYear] = useState("");
            const [resetConfirm, setResetConfirm] = useState(false);
            const [aiApiKeyInput, setAiApiKeyInput] = useState("");
            const [aiModels, setAiModels] = useState([]);
            const [aiSelectedModel, setAiSelectedModel] = useState("");
            const [isSearchingModels, setIsSearchingModels] = useState(false);
            const [isSavingAiConfig, setIsSavingAiConfig] = useState(false);

            useEffect(() => setForm(globalMetrics), [globalMetrics]);
            useEffect(() => {
                setAiApiKeyInput(aiConfig?.apiKey || "");
                setAiModels(Array.isArray(aiConfig?.models) ? aiConfig.models : []);
                setAiSelectedModel(aiConfig?.selectedModel || "");
            }, [aiConfig]);

            const handleMetricChange = (key, field, val) => {
                setForm(prev => ({ ...prev, [key]: { ...prev[key], [field]: val } }));
            };

            const save = async () => {
                 await window.firestore.setDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'global_stats', currentPeriod), form);
                 alert("저장되었습니다.");
            };

            const addYear = () => {
                if(newYear && !availableYears.includes(newYear)) setAvailableYears([...availableYears, newYear].sort());
                setNewYear("");
            };

            const resetPeriodData = async () => {
                if(!resetConfirm) {
                    setResetConfirm(true);
                    setTimeout(() => setResetConfirm(false), 3000);
                    return;
                }
                
                try {
                    await window.firestore.deleteDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'global_stats', currentPeriod));
                    const updatedTrend = chartData.trend.filter(t => t.label !== currentPeriod);
                    await window.firestore.updateDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'chart_stats', 'current'), {
                        trend: updatedTrend
                    });
                    setResetConfirm(false);
                    alert(`현재 기간(${currentPeriod})의 모든 데이터가 초기화되었습니다.`);
                } catch (e) {
                    console.error(e);
                    alert("초기화 실패");
                }
            };

            const handleManualRefresh = async () => {
                await calculatePeriodStats(window.db, currentPeriod, teamStats, false);
            };

            const clearChartData = async () => {
                if(!confirm("모든 차트 데이터를 삭제하시겠습니까?")) return;
                await window.firestore.setDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'chart_stats', 'current'), { trend: [] });
                alert("차트 데이터가 초기화되었습니다.");
            };

            const saveAiSettings = async (next = {}) => {
                try {
                    setIsSavingAiConfig(true);
                    const merged = {
                        keyStorageMode: 'cloud',
                        apiKey: aiApiKeyInput,
                        models: aiModels,
                        selectedModel: aiSelectedModel,
                        ...next,
                        updatedAt: window.firestore.serverTimestamp()
                    };
                    await window.firestore.setDoc(
                        window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'app_settings', 'ai_config'),
                        merged,
                        { merge: true }
                    );
                } finally {
                    setIsSavingAiConfig(false);
                }
            };

            const handleSaveApiKey = async () => {
                const key = String(aiApiKeyInput || '').trim();
                if (!key) return alert("API 키를 입력해주세요.");
                await saveAiSettings({ apiKey: key });
                alert("API 키가 클라우드에 저장되었습니다.");
            };

            const handleSearchModels = async () => {
                const key = String(aiApiKeyInput || aiConfig?.apiKey || '').trim();
                if (!key) return alert("먼저 API 키를 입력하거나 저장해주세요.");
                setIsSearchingModels(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);

                    const models = (data.models || [])
                        .filter(m => m.supportedGenerationMethods?.includes("generateContent") && String(m.name || '').includes("gemini"))
                        .map(m => String(m.name).replace("models/", ""))
                        .sort();

                    if (models.length === 0) throw new Error("사용 가능한 Gemini 모델을 찾을 수 없습니다.");

                    const preferred = models.find(m => m.includes("1.5-flash")) || models[0];
                    setAiModels(models);
                    setAiSelectedModel(preferred);
                    setAiApiKeyInput(key);
                    await saveAiSettings({ apiKey: key, models, selectedModel: preferred });
                    alert(`모델 검색 완료: ${models.length}개`);
                } catch (e) {
                    console.error(e);
                    alert(`모델 검색 실패: ${e.message}`);
                } finally {
                    setIsSearchingModels(false);
                }
            };

            const handleSelectModel = async (model) => {
                setAiSelectedModel(model);
                await saveAiSettings({ selectedModel: model });
            };

            const handleResetAiSettings = async () => {
                if (!confirm("저장된 API 키 및 모델 설정을 초기화하시겠습니까?")) return;
                setAiApiKeyInput("");
                setAiModels([]);
                setAiSelectedModel("");
                await saveAiSettings({ apiKey: "", models: [], selectedModel: "" });
                alert("AI 설정이 초기화되었습니다.");
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 fade-in">
                    <div className="mb-8 border-b pb-6">
                        <h2 className="text-lg font-bold mb-4">Google AI 설정</h2>
                        <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                            <p className="text-xs text-slate-700 font-bold">저장 위치: 클라우드(Firestore)</p>
                            <p className="text-xs text-slate-500 mt-1">관리자 설정 메뉴에서 등록/수정 시 모든 관리자 화면에 동기화됩니다.</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="md:col-span-2">
                                <label className="block text-xs text-slate-500 mb-1">Google AI API Key</label>
                                <input
                                    type="password"
                                    value={aiApiKeyInput}
                                    onChange={e => setAiApiKeyInput(e.target.value)}
                                    placeholder="AIza..."
                                    className="w-full border p-2.5 rounded text-sm"
                                />
                            </div>
                            <div className="flex items-end">
                                <button onClick={handleSaveApiKey} disabled={isSavingAiConfig} className="w-full bg-brand-600 text-white px-4 py-2.5 rounded font-bold hover:bg-brand-700 disabled:bg-slate-400">
                                    {isSavingAiConfig ? "저장 중..." : "API 키 저장"}
                                </button>
                            </div>
                        </div>
                        <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="md:col-span-2">
                                <label className="block text-xs text-slate-500 mb-1">AI 모델 선택</label>
                                <select
                                    value={aiSelectedModel}
                                    onChange={e => handleSelectModel(e.target.value)}
                                    className="w-full border p-2.5 rounded text-sm bg-white"
                                    disabled={aiModels.length === 0}
                                >
                                    <option value="">{aiModels.length === 0 ? "모델을 검색해주세요" : "모델 선택"}</option>
                                    {aiModels.map(model => <option key={model} value={model}>{model}</option>)}
                                </select>
                            </div>
                            <div className="space-y-2">
                                <button onClick={handleSearchModels} disabled={isSearchingModels} className="w-full bg-brand-600 text-white px-4 py-2 rounded font-bold hover:bg-brand-700 disabled:bg-slate-400">
                                    {isSearchingModels ? "검색 중..." : "모델 자동 검색"}
                                </button>
                                <button onClick={handleResetAiSettings} className="w-full bg-slate-100 text-slate-700 px-4 py-2 rounded font-bold hover:bg-slate-200">
                                    AI 설정 초기화
                                </button>
                            </div>
                        </div>
                    </div>
                    <div className="mb-8 border-b pb-6">
                        <h2 className="text-lg font-bold mb-4">자동화 도구</h2>
                        <div className="flex flex-col md:flex-row gap-4">
                            <div className="bg-brand-50 p-4 rounded-lg flex-1 flex flex-col justify-center">
                                <div>
                                    <h3 className="font-bold text-brand-800">데이터 수동 새로고침 ({currentPeriod})</h3>
                                    <p className="text-xs text-brand-600 mt-1">※ 데이터 등록 시 자동으로 계산되므로, 누락 시에만 사용하세요.</p>
                                </div>
                                <button onClick={handleManualRefresh} className="mt-2 w-full bg-brand-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-brand-700">새로고침</button>
                            </div>
                            
                            <div className="bg-amber-50 p-4 rounded-lg flex-1 flex flex-col justify-center">
                                <div><h3 className="font-bold text-amber-800">현재 데이터 초기화</h3><p className="text-xs text-amber-600 mt-1">현재 조회 중인 월의 KPI 값을 삭제합니다.</p></div>
                                <button onClick={resetPeriodData} className={`mt-2 w-full text-white px-4 py-2 rounded-lg font-bold transition-colors ${resetConfirm ? 'bg-red-600' : 'bg-amber-500 hover:bg-amber-600'}`}>
                                    {resetConfirm ? "확실합니까? (클릭)" : "초기화"}
                                </button>
                            </div>

                            <div className="bg-red-50 p-4 rounded-lg flex-1 flex flex-col justify-center">
                                <div><h3 className="font-bold text-red-800">차트 기록 전체 삭제</h3><p className="text-xs text-red-600 mt-1">저장된 eNPS 추이를 모두 삭제합니다.</p></div>
                                {/* 파괴적 동작은 '테두리형'으로 둬서, 같은 레드인 기본 버튼과 확실히 구분한다. */}
                                <button onClick={clearChartData} className="mt-2 w-full bg-white border-2 border-red-600 text-red-700 px-4 py-2 rounded-lg font-bold hover:bg-red-600 hover:text-white transition-colors">전체 삭제</button>
                            </div>
                        </div>
                    </div>
                    <h2 className="text-lg font-bold mb-6">KPI 수동 보정 ({currentPeriod})</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        {Object.entries(form).map(([key, data]) => (
                            <div key={key} className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                <h3 className="text-sm font-bold text-slate-700 mb-3 uppercase">{data.label}</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-xs text-slate-500">값</label><input value={data.value} onChange={e => handleMetricChange(key, 'value', e.target.value)} className="w-full border p-2 rounded text-sm" /></div>
                                    <div><label className="text-xs text-slate-500">변화량</label><input value={data.diff} onChange={e => handleMetricChange(key, 'diff', e.target.value)} className="w-full border p-2 rounded text-sm" /></div>
                                </div>
                            </div>
                        ))}
                    </div>
                    <button onClick={save} className="bg-slate-800 text-white px-6 py-3 rounded-lg font-bold">저장</button>
                    <div className="mt-10 border-t pt-6">
                        <h2 className="text-lg font-bold mb-4">연도 설정</h2>
                        <div className="flex gap-2"><input value={newYear} onChange={e => setNewYear(e.target.value)} placeholder="예: 2028" className="border p-2 rounded w-32" /><button onClick={addYear} className="bg-green-600 text-white px-4 py-2 rounded font-bold">추가</button></div>
                    </div>
                </div>
            );
        };

        const Sidebar = ({ currentView, setView, role, isMobileMenuOpen, setIsMobileMenuOpen }) => {
            const adminMenu = [
                { id: 'dashboard', label: '대시보드', icon: 'layout-dashboard' },
                { id: 'complaints', label: '고충 처리함', icon: 'inbox' },
                { id: 'board', label: '대나무숲 게시판', icon: 'users' },
                { id: 'pulse', label: '조직진단 현황', icon: 'bar-chart-2' },
                { id: 'teams', label: '팀/조직 관리', icon: 'users' },
                { id: 'analysis', label: '분석 및 개선', icon: 'lightbulb' },
                { id: 'data', label: '데이터 관리', icon: 'database' }, 
                { id: 'report', label: '리포트 생성', icon: 'file-text' }, 
                { id: 'settings', label: '설정', icon: 'settings' }
            ];
            // 고충 접수와 그 조회를 붙여 두고, 성격이 다른 게시판은 그 아래로.
            const empMenu = [
                { id: 'guide', label: '이용 안내', icon: 'info' },
                { id: 'complaint', label: '고충 접수', icon: 'message-square' },
                { id: 'complaint-lookup', label: '내 접수 조회', icon: 'search' },
                { id: 'board', label: '대나무숲 게시판', icon: 'users' },
                { id: 'pulse-survey', label: '조직 진단', icon: 'bar-chart-2' }
            ];
            const menu = role === 'admin' ? adminMenu : empMenu;
            
            return (
                <>
                    {/* Mobile Overlay */}
                    {isMobileMenuOpen && (
                        <div 
                            className="fixed inset-0 bg-black bg-opacity-50 z-40 md:hidden"
                            onClick={() => setIsMobileMenuOpen(false)}
                        ></div>
                    )}
                    
                    {/* Sidebar Drawer */}
                    <aside className={`
                        fixed top-0 left-0 bottom-0 z-50 w-64 bg-white border-r border-slate-200 flex flex-col h-full 
                        transform transition-transform duration-300 ease-in-out
                        ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} 
                        md:translate-x-0 no-print
                    `}>
                        <div className="h-16 flex items-center px-5 border-b border-slate-100 justify-between">
                            <div className="flex items-center gap-2.5">
                                <span className="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center shadow-brand">
                                    <Icon name="message-square" size={17} />
                                </span>
                                <span className="font-extrabold text-lg text-slate-900 tracking-tight">엔코스 대나무숲</span>
                            </div>
                            <button onClick={() => setIsMobileMenuOpen(false)} className="md:hidden text-slate-500 hover:text-brand-600">
                                <Icon name="x" size={24} />
                            </button>
                        </div>
                        <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
                            {menu.map(item => (
                                <button key={item.id} onClick={() => { setView(item.id); setIsMobileMenuOpen(false); }} className={`sidebar-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg ${currentView === item.id ? 'active' : 'text-slate-600'}`}>
                                    <Icon name={item.icon} size={20} />
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-100">
                            <div className={`p-3 rounded-lg border flex items-center gap-2 mb-2 ${role === 'admin' ? 'bg-slate-900 text-white border-slate-900' : 'bg-brand-50 text-brand-700 border-brand-100'}`}>
                                <span className="text-xs font-bold">{role === 'admin' ? '관리자 모드' : '구성원 모드'}</span>
                            </div>
                            <div className="flex items-center gap-2 text-xs text-slate-500 px-1"><div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div><span>시스템 연동됨</span></div>
                        </div>
                    </aside>
                </>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState('employee'); 
            const [currentView, setCurrentView] = useState('guide');   // 구성원 첫 화면은 이용 안내
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [selectedYear, setSelectedYear] = useState("2026");
            const [selectedMonth, setSelectedMonth] = useState("2");
            const [availableYears, setAvailableYears] = useState(["2026", "2027"]);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            const currentPeriod = useMemo(() => getFormattedPeriod(selectedYear, selectedMonth), [selectedYear, selectedMonth]);

            const defaultMetrics = {
                enps: { label: "몰입도 (eNPS)", value: "-", diff: "0" },
                safety: { label: "심리적 안전감", value: "-", diff: "0" },
                burnout: { label: "번아웃 리스크", value: "-", diff: "0" },
                growth: { label: "성장 비전 공감", value: "-", diff: "0" }
            };
            const [globalMetrics, setGlobalMetrics] = useState(defaultMetrics);
            const [chartData, setChartData] = useState({ trend: [] });
            const [teamStats, setTeamStats] = useState([]);
            const [aiConfig, setAiConfig] = useState({ keyStorageMode: 'cloud', apiKey: '', models: [], selectedModel: '' });

            useEffect(() => {
                const initAuth = async () => {
                    if (!window.firebaseAuth) return;
                    window.firebaseAuth.onAuthStateChanged(window.auth, async (u) => {
                        if (!u) {
                            window.firebaseAuth.signInAnonymously(window.auth).catch(console.error);
                            return;
                        }
                        setUser(u);
                        // 역할은 화면 상태가 아니라 실제 로그인 세션에서 나온다.
                        // 익명 세션이면 무조건 구성원이고, 관리자는 admins/{uid} 가 있어야 한다.
                        // (같은 조건을 Firestore 보안 규칙에서도 검사하므로 화면만 바꿔서는 데이터에 닿지 못한다)
                        if (u.isAnonymous) { setRole('employee'); return; }
                        try {
                            const adminDoc = await window.firestore.getDoc(window.firestore.doc(window.db, 'admins', u.uid));
                            setRole(adminDoc.exists() ? 'admin' : 'employee');
                        } catch (e) {
                            console.error(e);
                            setRole('employee');
                        }
                    });
                };
                initAuth();
            }, []);

            useEffect(() => {
                // 게시판은 양쪽이 같은 화면을 본다(관리자는 숨김 처리 권한만 더 갖는다).
                const sharedViews = ['board'];
                const employeeOnlyViews = ['guide', 'complaint', 'complaint-lookup', 'pulse-survey'];
                if(role === 'employee' && !employeeOnlyViews.includes(currentView) && !sharedViews.includes(currentView)) setCurrentView('guide');
                else if(role === 'admin' && employeeOnlyViews.includes(currentView)) setCurrentView('dashboard');
            }, [role, currentView]);

            useEffect(() => {
                if (!window.db) return;
                const metricsRef = window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'global_stats', currentPeriod);
                const unsubMetrics = window.firestore.onSnapshot(metricsRef, (s) => {
                    if (s.exists()) setGlobalMetrics(s.data());
                    else setGlobalMetrics(defaultMetrics); 
                });
                const teamQ = window.firestore.query(
                    window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'team_stats'),
                    window.firestore.where("period", "==", currentPeriod)
                );
                const unsubTeams = window.firestore.onSnapshot(teamQ, (s) => {
                    const teams = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    teams.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
                    setTeamStats(teams);
                });
                const chartRef = window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'chart_stats', 'current');
                const unsubChart = window.firestore.onSnapshot(chartRef, (s) => {
                    if (s.exists()) setChartData(s.data());
                    else window.firestore.setDoc(chartRef, { trend: [] }); 
                });
                // AI 설정에는 API 키가 들어 있고 관리자 화면에서만 쓰인다.
                // 구성원 세션까지 구독하면 보안 규칙에서 이 문서를 관리자 전용으로 잠글 수 없다.
                let unsubAiConfig = () => {};
                if (role === 'admin') {
                    const aiConfigRef = window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'app_settings', 'ai_config');
                    unsubAiConfig = window.firestore.onSnapshot(aiConfigRef, (s) => {
                        if (!s.exists()) return;
                        const data = s.data();
                        setAiConfig({
                            keyStorageMode: data?.keyStorageMode || 'cloud',
                            apiKey: data?.apiKey || '',
                            models: Array.isArray(data?.models) ? data.models : [],
                            selectedModel: data?.selectedModel || ''
                        });
                    });
                }
                return () => { unsubMetrics(); unsubTeams(); unsubChart(); unsubAiConfig(); };
            }, [currentPeriod, user, role]);
            
            const handleAdminSuccess = () => { setRole('admin'); };

            // 화면만 구성원으로 바꾸는 게 아니라 관리자 세션을 실제로 끊고 익명으로 되돌린다.
            const leaveAdmin = async () => {
                if (role !== 'admin') return;
                try {
                    await window.firebaseAuth.signOut(window.auth);
                    await window.firebaseAuth.signInAnonymously(window.auth);
                } catch (e) { console.error(e); }
                setRole('employee');
            };

            if (!user) return <Loading />;

            return (
