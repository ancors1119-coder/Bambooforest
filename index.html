                    if (team.workload === '과부하') { riskScore += 25; drivers.push('업무 과부하'); }
                    if (team.conflict === '높음') { riskScore += 20; drivers.push('관계 갈등'); }
                    if (team.leadership === '부족') { riskScore += 15; drivers.push('리더십 이슈'); }
                    if (lowScore('safety')) { riskScore += 20; drivers.push('심리적 안전감 낮음'); }
                    if (lowScore('fairness')) { riskScore += 15; drivers.push('공정성 낮음'); }
                    if (lowScore('clarity')) { riskScore += 12; drivers.push('역할명확성 낮음'); }
                    if (lowScore('growth')) { riskScore += 10; drivers.push('성장감 낮음'); }
                    if (lowScore('engagement')) { riskScore += 15; drivers.push('몰입/추천의향 낮음'); }
                    if ((team.keywords || []).length >= 5) { riskScore += 5; drivers.push('이슈 키워드 다수'); }
                    const mergedDrivers = [...new Set([...(team.diagnosisDrivers || []), ...drivers])];
                    const riskLevel = riskScore >= 70 ? 'high' : riskScore >= 35 ? 'medium' : 'low';
                    return { ...team, riskScore, riskLevel, drivers: mergedDrivers };
                }).sort((a, b) => b.riskScore - a.riskScore);
            }, [teamStats]);

            const riskyTeams = teamRiskRows.filter(t => t.riskLevel !== 'low');
            const highWorkloadTeams = teamRiskRows.filter(t => t.workload === '과부하');
            const conflictTeams = teamRiskRows.filter(t => t.conflict === '높음');
            const fairnessClarityTeams = teamRiskRows.filter(t => (t.diagnosisScores?.fairness || 5) <= 2.5 || (t.diagnosisScores?.clarity || 5) <= 2.5);

            const keywordRank = useMemo(() => {
                const counts = {};
                (teamStats || []).forEach((team) => {
                    (team.keywords || []).forEach((k) => {
                        const key = String(k || '').trim();
                        if (!key) return;
                        counts[key] = (counts[key] || 0) + 1;
                    });
                });
                return Object.entries(counts)
                    .map(([text, count]) => ({ text, count }))
                    .sort((a, b) => b.count - a.count)
                    .slice(0, 8);
            }, [teamStats]);

            const recommendations = [];
            if (riskyTeams.length > 0) {
                recommendations.push({
                    type: 'urgent',
                    category: 'Risk',
                    title: '고위험 팀 집중 케어 플랜',
                    desc: `${riskyTeams.slice(0, 3).map(t => t.name).join(', ')} 팀이 복합 리스크를 보입니다. 2주 내 팀장 면담/업무 재조정/갈등 중재를 병행하세요.`,
                    action: '집중 케어',
                    priorityScore: 95
                });
            }
            if (highWorkloadTeams.length > 0) {
                recommendations.push({
                    type: 'urgent',
                    category: 'Resource',
                    title: '업무 과부하 해소를 위한 R&R 재설계',
                    desc: `${highWorkloadTeams.slice(0, 3).map(t => t.name).join(', ')} 팀은 업무량 리스크가 큽니다. 저부가 업무 이관과 우선순위 재정렬이 필요합니다.`,
                    action: '리소스 조정',
                    priorityScore: 90
                });
            }
            if (conflictTeams.length > 0 || safetyScore < 3.2) {
                recommendations.push({
                    type: 'warning',
                    category: 'Culture',
                    title: '관계 갈등/심리적 안전감 개선 프로그램',
                    desc: `갈등 신호 팀(${conflictTeams.length}개)과 낮은 안전감(${safetyScore.toFixed(1)}점)을 고려해 팀 단위 퍼실리테이션과 1:1 코칭을 권장합니다.`,
                    action: '문화 개선',
                    priorityScore: 82
                });
            }
            if (fairnessClarityTeams.length > 0) {
                recommendations.push({
                    type: 'warning',
                    category: 'System',
                    title: '공정성·역할명확성 진단 보완',
                    desc: `${fairnessClarityTeams.slice(0, 3).map(t => t.name).join(', ')} 팀에서 공정성 또는 역할명확성 저하 신호가 있습니다. 평가 기준, 업무배분 원칙, 의사결정 권한을 문서화해 재공지하세요.`,
                    action: '제도 보완',
                    priorityScore: 78
                });
            }
            if (burnoutScore >= 70 || enpsScore < 0 || trendDelta < 0) {
                recommendations.push({
                    type: 'warning',
                    category: 'Retention',
                    title: '이탈 방지 사전 대응',
                    desc: `번아웃(${burnoutScore.toFixed(0)}%), eNPS(${enpsScore}), 추이 변화(${trendDelta >= 0 ? '+' : ''}${trendDelta})를 보면 이탈 리스크가 있습니다. 핵심 인력 케어 계획을 선제 수립하세요.`,
                    action: '이탈 예방',
                    priorityScore: 80
                });
            }
            if (keywordRank.length > 0) {
                recommendations.push({
                    type: 'good',
                    category: 'Voice',
                    title: '키워드 기반 개선 실험 운영',
                    desc: `상위 키워드(${keywordRank.slice(0, 3).map(k => k.text).join(', ')}) 중심으로 4주 단위 개선 실험을 진행하고 성과를 비교하세요.`,
                    action: '실험 설계',
                    priorityScore: 70
                });
            }
            if (recommendations.length === 0) {
                recommendations.push({
                    type: 'good',
                    category: 'Growth',
                    title: '현 상태 유지 + 성장 투자',
                    desc: '현재 위험 신호가 낮습니다. 우수 사례 문서화와 리더 코칭으로 건강한 조직 상태를 안정적으로 유지하세요.',
                    action: '성장 강화',
                    priorityScore: 60
                });
            }
            recommendations.sort((a, b) => b.priorityScore - a.priorityScore);

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 fade-in h-full overflow-y-auto">
                    <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <Icon name="microscope" className="text-brand-600"/> 조직 심층 분석 및 개선 제언
                    </h2>
                    <p className="text-sm text-slate-500 mb-6">기준 기간: <span className="font-bold text-slate-700">{currentPeriod}</span></p>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                        <div className="bg-red-50 p-4 rounded-xl border border-red-100">
                            <p className="text-xs text-red-500 font-bold">고위험 팀</p>
                            <p className="text-2xl font-black text-red-700 mt-1">{teamRiskRows.filter(t => t.riskLevel === 'high').length}개</p>
                        </div>
                        <div className="bg-amber-50 p-4 rounded-xl border border-amber-100">
                            <p className="text-xs text-amber-500 font-bold">번아웃 지수</p>
                            <p className="text-2xl font-black text-amber-700 mt-1">{burnoutScore.toFixed(0)}%</p>
                        </div>
                        {/* 경고성 지표(고위험/번아웃)만 색을 쓰고, 일반 지표는 중립색으로 둔다. */}
                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <p className="text-xs text-slate-500 font-bold">eNPS</p>
                            <p className="text-2xl font-black text-slate-800 mt-1">{enpsScore > 0 ? '+' : ''}{enpsScore}</p>
                        </div>
                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <p className="text-xs text-slate-500 font-bold">추이 변화</p>
                            <p className="text-2xl font-black text-slate-800 mt-1">{trendDelta > 0 ? '+' : ''}{trendDelta}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                            <h3 className="font-bold text-slate-800 mb-4">팀 리스크 우선순위</h3>
                            {teamRiskRows.length === 0 ? (
                                <p className="text-sm text-slate-500">등록된 팀 데이터가 없습니다.</p>
                            ) : (
                                <div className="space-y-3">
                                    {teamRiskRows.slice(0, 6).map(team => (
                                        <div key={team.id} className="bg-white p-3 rounded-lg border border-slate-200">
                                            <div className="flex justify-between items-center">
                                                <p className="font-bold text-slate-800">{team.name}</p>
                                                <span className={`text-xs font-bold px-2 py-1 rounded ${team.riskLevel === 'high' ? 'bg-red-100 text-red-700' : team.riskLevel === 'medium' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'}`}>
                                                    Risk {team.riskScore}
                                                </span>
                                            </div>
                                            <p className="text-xs text-slate-500 mt-1">{team.drivers.length > 0 ? team.drivers.join(' · ') : '특이 리스크 없음'}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                            <h3 className="font-bold text-slate-800 mb-4">핵심 이슈 키워드</h3>
                            {keywordRank.length === 0 ? (
                                <p className="text-sm text-slate-500">키워드 데이터가 없습니다.</p>
                            ) : (
                                <div className="flex flex-wrap gap-2">
                                    {keywordRank.map((k) => (
                                        <span key={k.text} className="px-3 py-1.5 rounded-full text-sm bg-white border border-slate-200 text-slate-700">
                                            {k.text} <span className="text-xs text-slate-400 ml-1">{k.count}</span>
                                        </span>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    <div>
                        <h3 className="font-bold text-slate-700 mb-4 text-lg">맞춤형 개선 솔루션</h3>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                            {recommendations.map((rec, idx) => (
                                <div key={idx} className="bg-white border border-slate-200 p-5 rounded-xl shadow-sm relative overflow-hidden">
                                    <div className={`absolute top-0 left-0 w-1 h-full ${rec.type === 'urgent' ? 'bg-red-500' : rec.type === 'warning' ? 'bg-amber-500' : 'bg-green-500'}`}></div>
                                    <div className="flex justify-between items-center mb-2">
                                        <span className={`text-xs font-bold px-2 py-1 rounded uppercase ${rec.type === 'urgent' ? 'bg-red-100 text-red-700' : rec.type === 'warning' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'}`}>{rec.category}</span>
                                        <span className="text-[11px] text-slate-400">우선순위 {rec.priorityScore}</span>
                                    </div>
                                    <h4 className="font-bold text-slate-900 text-md mb-1">{rec.title}</h4>
                                    <p className="text-sm text-slate-600 mb-4 leading-relaxed">{rec.desc}</p>
                                    <button 
                                        onClick={() => setSelectedSolution(rec)}
                                        className="w-full py-2 border border-brand-200 bg-brand-50 rounded-lg text-sm font-bold text-brand-700 hover:bg-brand-600 hover:border-brand-600 hover:text-white transition-colors flex items-center justify-center gap-2"
                                    >
                                        <Icon name="check-square" size={16}/> {rec.action} 계획 수립
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {selectedSolution && (
                        <SolutionGeneratorModal 
                            solution={selectedSolution} 
                            aiConfig={aiConfig}
                            onClose={() => setSelectedSolution(null)} 
                        />
                    )}
                </div>
            );
        };

        const DataManagementView = ({ teamStats, currentPeriod }) => {
            const [responses, setResponses] = useState([]);
            const [loading, setLoading] = useState(true);
            const syncedEmptyPeriodRef = useRef("");

            useEffect(() => {
                if(!window.db) return;
                setLoading(true);
                // 기간은 서버에서 거른다. 정렬은 그대로 브라우저에서 하므로
                // where 하나뿐이라 복합 색인이 필요 없다(단일 필드 색인은 자동 생성).
                const q = window.firestore.query(
                    window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'survey_responses'),
                    window.firestore.where("period", "==", currentPeriod)
                );

                const unsubscribe = window.firestore.onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs
                        .map(doc => {
                            const rawData = doc.data();
                            const team = teamStats.find(t => t.id === rawData.teamId);
                            return {
                                id: doc.id,
                                ...rawData,
                                teamName: team ? team.name : 'Unknown Team',
                                date: rawData.createdAt ? new Date(rawData.createdAt.seconds * 1000).toLocaleString() : 'N/A',
                                createdAtSeconds: rawData.createdAt ? rawData.createdAt.seconds : 0
                            };
                        });

                    // 정렬만 브라우저에서 한다(기간은 서버가 이미 걸렀다).
                    data.sort((a, b) => b.createdAtSeconds - a.createdAtSeconds);
                    
                    setResponses(data);
                    setLoading(false);

                    if (data.length === 0 && syncedEmptyPeriodRef.current !== currentPeriod) {
                        syncedEmptyPeriodRef.current = currentPeriod;
                        calculatePeriodStats(window.db, currentPeriod, teamStats, true).catch((e) => {
                            console.error("Empty-state sync failed:", e);
                        });
                    }
                    if (data.length > 0) {
                        syncedEmptyPeriodRef.current = "";
                    }
                }, (error) => {
                    console.error("Error fetching responses:", error);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, [currentPeriod, teamStats]);

            const handleDelete = async (id) => {
                if(!confirm("이 데이터를 영구적으로 삭제하시겠습니까?")) return;
                await window.firestore.deleteDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'survey_responses', id));
                // Auto calc on delete
                await calculatePeriodStats(window.db, currentPeriod, teamStats, true); 
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 fade-in h-full flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <Icon name="database" className="text-brand-600"/> 데이터 관리 (Data Management)
                        </h2>
                        <span className="text-sm text-slate-500">
                            기간: <span className="font-bold text-slate-800">{currentPeriod}</span> | 총 <span className="font-bold text-brand-600">{responses.length}</span>건
                        </span>
                    </div>

                    <div className="flex-1 overflow-auto border rounded-lg">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 sticky top-0 z-10 text-slate-700 uppercase text-xs">
                                <tr>
                                    <th className="p-3 border-b">일시</th>
                                    <th className="p-3 border-b">팀명</th>
                                    {PULSE_FIELDS.map(field => (
                                        <th key={field.id} className="p-3 border-b text-center whitespace-nowrap">{field.label}</th>
                                    ))}
                                    <th className="p-3 border-b">키워드 (Voice)</th>
                                    <th className="p-3 border-b text-center">관리</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {loading ? (
                                    <tr><td colSpan={PULSE_FIELDS.length + 4} className="p-8 text-center text-slate-500">데이터를 불러오는 중...</td></tr>
                                ) : responses.length === 0 ? (
                                    <tr><td colSpan={PULSE_FIELDS.length + 4} className="p-8 text-center text-slate-500">해당 기간에 등록된 데이터가 없습니다.</td></tr>
                                ) : (
                                    responses.map(res => (
                                        <tr key={res.id} className="hover:bg-slate-50 transition-colors">
                                            <td className="p-3 text-slate-500 text-xs whitespace-nowrap">{res.date}</td>
                                            <td className="p-3 font-medium text-slate-800 whitespace-nowrap">{res.teamName}</td>
                                            {PULSE_FIELDS.map(field => (
                                                <td key={field.id} className="p-3 text-center">
                                                    <span className="bg-slate-100 px-2 py-1 rounded text-xs font-bold">{res[field.id] ?? '-'}</span>
                                                </td>
                                            ))}
                                            <td className="p-3 text-slate-600 text-xs italic max-w-xs truncate" title={res.keywords}>{res.keywords || '-'}</td>
                                            <td className="p-3 text-center">
                                                <button onClick={() => handleDelete(res.id)} className="text-slate-400 hover:text-red-600 transition-colors p-1" title="삭제">
                                                    <Icon name="trash-2" size={14}/>
                                                </button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const PulseScoreBadge = ({ value }) => {
            const score = Number(value);
            if (!Number.isFinite(score)) return <span className="px-2 py-1 rounded text-xs font-bold border bg-slate-50 text-slate-400 border-slate-100">-</span>;
            const tone = score <= 2.5 ? 'bg-red-50 text-red-700 border-red-100' : score <= 3.4 ? 'bg-amber-50 text-amber-700 border-amber-100' : 'bg-green-50 text-green-700 border-green-100';
            return <span className={`px-2 py-1 rounded text-xs font-bold border ${tone}`}>{score.toFixed(1)}</span>;
        };

        const PulseInsightView = ({ teamStats, currentPeriod }) => {
            const [responses, setResponses] = useState([]);
            const [loading, setLoading] = useState(true);
            const [teamFilter, setTeamFilter] = useState("전체");
            const [search, setSearch] = useState("");
            const [selected, setSelected] = useState(null);

            useEffect(() => {
                if (!window.db) return;
                setLoading(true);
                const q = window.firestore.query(
                    window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'survey_responses'),
                    window.firestore.where("period", "==", currentPeriod)
                );
                const unsubscribe = window.firestore.onSnapshot(q, (snapshot) => {
                    const list = snapshot.docs
                        .map(doc => {
                            const rawData = doc.data();
                            const scores = PULSE_FIELDS.map(f => Number(rawData[f.id]) || 0);
                            const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0;
                            const lowFields = PULSE_FIELDS.filter(f => Number(rawData[f.id]) <= 2);
                            const comments = rawData.comments || {};
                            return {
                                id: doc.id,
                                ...rawData,
                                teamName: getTeamName(teamStats, rawData.teamId),
                                avg,
                                lowFields,
                                comments,
                                createdAtSeconds: rawData.createdAt ? rawData.createdAt.seconds : 0
                            };
                        });
                    list.sort((a, b) => b.createdAtSeconds - a.createdAtSeconds);
                    setResponses(list);
                    setLoading(false);
                }, (error) => {
                    console.error("Error fetching pulse responses:", error);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [currentPeriod, teamStats]);

            const filteredResponses = useMemo(() => {
                const keyword = search.trim().toLowerCase();
                return responses.filter(item => {
                    if (teamFilter !== "전체" && item.teamId !== teamFilter) return false;
                    if (!keyword) return true;
                    const haystack = [
                        item.teamName,
                        item.keywords,
                        ...Object.values(item.comments || {})
                    ].join(" ").toLowerCase();
                    return haystack.includes(keyword);
                });
            }, [responses, teamFilter, search]);

            const stats = useMemo(() => {
                const total = responses.length;
                const avgAll = total ? responses.reduce((a, r) => a + r.avg, 0) / total : 0;
                const lowRiskCount = responses.filter(r => r.lowFields.length >= 3).length;
                const commentCount = responses.filter(r => Object.keys(r.comments || {}).length > 0).length;
                return { total, avgAll, lowRiskCount, commentCount };
            }, [responses]);

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 fade-in h-full flex flex-col">
                    <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                        <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <Icon name="bar-chart-2" className="text-brand-600" /> 조직진단 현황 (Pulse Survey)
                        </h2>
                        <span className="text-sm text-slate-500">
                            기간: <span className="font-bold text-slate-800">{currentPeriod}</span> | 총 <span className="font-bold text-brand-600">{responses.length}</span>건
                        </span>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-slate-50 rounded-xl p-4 border border-slate-100"><p className="text-xs text-slate-500">총 응답</p><p className="text-2xl font-bold text-slate-800">{stats.total}건</p></div>
                        <div className="bg-slate-50 rounded-xl p-4 border border-slate-100"><p className="text-xs text-slate-500">평균 종합점수</p><p className="text-2xl font-bold text-brand-600">{stats.total ? stats.avgAll.toFixed(1) : '-'}</p></div>
                        <div className="bg-red-50 rounded-xl p-4 border border-red-100"><p className="text-xs text-red-600">위험 응답(저점 3개↑)</p><p className="text-2xl font-bold text-red-700">{stats.lowRiskCount}건</p></div>
                        {/* 옆의 '위험 응답'이 눈에 띄도록, 단순 집계 항목은 중립색으로 둔다. */}
                        <div className="bg-slate-50 rounded-xl p-4 border border-slate-200"><p className="text-xs text-slate-500">사유 코멘트 등록</p><p className="text-2xl font-bold text-slate-800">{stats.commentCount}건</p></div>
                    </div>

                    <div className="flex flex-wrap gap-3 mb-4">
                        <select value={teamFilter} onChange={e => setTeamFilter(e.target.value)} className="border border-slate-200 rounded-lg px-3 py-2 text-sm">
                            <option value="전체">전체 부서</option>
                            {teamStats.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                        </select>
                        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="키워드/코멘트 검색" className="flex-1 min-w-[200px] border border-slate-200 rounded-lg px-3 py-2 text-sm" />
                    </div>

                    <div className="flex-1 overflow-auto border rounded-lg">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 sticky top-0 z-10 text-slate-700 uppercase text-xs">
                                <tr>
                                    <th className="p-3 border-b">일시</th>
                                    <th className="p-3 border-b">팀명</th>
                                    <th className="p-3 border-b text-center">종합점수</th>
                                    <th className="p-3 border-b text-center">저점 지표</th>
                                    <th className="p-3 border-b">키워드</th>
                                    <th className="p-3 border-b text-center">코멘트</th>
                                    <th className="p-3 border-b text-center">상세</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {loading ? (
                                    <tr><td colSpan={7} className="p-8 text-center text-slate-500">데이터를 불러오는 중...</td></tr>
                                ) : filteredResponses.length === 0 ? (
                                    <tr><td colSpan={7} className="p-8 text-center text-slate-500">해당 조건에 등록된 데이터가 없습니다.</td></tr>
                                ) : (
                                    filteredResponses.map(res => (
                                        <tr key={res.id} className="hover:bg-slate-50 transition-colors">
                                            <td className="p-3 text-slate-500 text-xs whitespace-nowrap">{formatDateTime(res.createdAt)}</td>
                                            <td className="p-3 font-medium text-slate-800 whitespace-nowrap">{res.teamName}</td>
                                            <td className="p-3 text-center"><PulseScoreBadge value={res.avg} /></td>
                                            <td className="p-3 text-center">{res.lowFields.length > 0 ? <span className="text-xs font-bold text-red-600">{res.lowFields.length}개</span> : <span className="text-xs text-slate-400">없음</span>}</td>
                                            <td className="p-3 text-slate-600 text-xs italic max-w-xs truncate" title={res.keywords}>{res.keywords || '-'}</td>
                                            <td className="p-3 text-center">{Object.keys(res.comments || {}).length > 0 ? <Icon name="message-circle" size={14} className="text-brand-500 inline-block" /> : '-'}</td>
                                            <td className="p-3 text-center">
                                                <button onClick={() => setSelected(res)} className="text-brand-600 hover:underline text-xs font-bold">보기</button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>

                    {selected && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[100] p-4 fade-in backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[88vh] overflow-y-auto border border-slate-200">
                                <div className="p-5 border-b border-slate-100 flex items-start justify-between gap-4 sticky top-0 bg-white">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-900">{selected.teamName}</h3>
                                        <p className="text-xs text-slate-500 mt-1">{formatDateTime(selected.createdAt)}</p>
                                    </div>
                                    <button onClick={() => setSelected(null)} className="text-slate-400 hover:text-slate-700"><Icon name="x" size={22} /></button>
                                </div>
                                <div className="p-5 space-y-3">
                                    {PULSE_FIELDS.map(f => (
                                        <div key={f.id} className="border border-slate-100 rounded-xl p-4 bg-slate-50">
                                            <div className="flex items-center justify-between mb-1">
                                                <span className="font-bold text-slate-800 text-sm">{f.label}</span>
                                                <PulseScoreBadge value={selected[f.id]} />
                                            </div>
                                            {selected.comments && selected.comments[f.id] && (
                                                <p className="text-xs text-red-700 bg-red-50 border border-red-100 rounded-lg p-2 mt-2">{selected.comments[f.id]}</p>
                                            )}
                                        </div>
                                    ))}
                                    <div className="border border-slate-100 rounded-xl p-4">
                                        <p className="text-xs text-slate-400 mb-1">키워드</p>
                                        <p className="text-sm text-slate-700">{selected.keywords || '등록된 키워드 없음'}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 팀 목록은 조직 구조다. 기간별 진단 결과(team_stats)와 분리해 teams 에 둔다.
        // 예전에는 둘이 한 문서에 섞여 있어, 달이 바뀌면 팀 목록까지 사라지고
        // 구성원이 소속 부서를 고를 수 없어 진단 제출 자체가 막혔다.
        const TeamManagementView = ({ teamStats, currentPeriod }) => {
            const [name, setName] = useState('');
            const [editingId, setEditingId] = useState(null);   // 지금 이름을 고치는 중인 팀
            const [editName, setEditName] = useState('');
            const [saving, setSaving] = useState(false);
            const [migrating, setMigrating] = useState(false);
            const [legacyNames, setLegacyNames] = useState(null);   // null = 아직 확인 전

            const teamsCol = () => window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'teams');

            // 구조를 바꾸기 전에 team_stats 에 이름으로 들어 있던 팀들을 한 번만 옮겨준다.
            useEffect(() => {
                if (!window.db || teamStats.length > 0) { setLegacyNames(null); return; }
                let alive = true;
                (async () => {
                    try {
                        const snap = await window.firestore.getDocs(
                            window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'team_stats'));
                        const names = [...new Set(snap.docs.map(d => d.data().name).filter(Boolean))];
                        if (alive) setLegacyNames(names);
                    } catch (e) { console.error(e); }
                })();
                return () => { alive = false; };
            }, [teamStats.length]);

            const migrateLegacy = async () => {
                if (!legacyNames || legacyNames.length === 0) return;
                if (!confirm(`예전 기간에 등록돼 있던 팀 ${legacyNames.length}개를 옮깁니다.\n\n${legacyNames.join(', ')}`)) return;
                setMigrating(true);
                try {
                    await Promise.all(legacyNames.map(n => window.firestore.addDoc(teamsCol(), {
                        name: n, createdAt: window.firestore.serverTimestamp()
                    })));
                    alert(`팀 ${legacyNames.length}개를 옮겼습니다. 이제 기간과 무관하게 유지됩니다.`);
                } catch (e) {
                    alert("이전 실패: " + e.message);
                } finally {
                    setMigrating(false);
                }
            };

            const nameTaken = (v, exceptId) =>
                teamStats.some(t => t.id !== exceptId && t.name === v);

            const handleSave = async (e) => {
                e.preventDefault();
                const v = name.trim();
                if (!v) return;
                if (nameTaken(v)) return alert("같은 이름의 팀이 이미 있습니다.");
                await window.firestore.addDoc(teamsCol(), { name: v, createdAt: window.firestore.serverTimestamp() });
                setName('');
            };

            const startEdit = (t) => { setEditingId(t.id); setEditName(t.name); };
            const cancelEdit = () => { setEditingId(null); setEditName(''); };

            // 이름만 바꾼다. 진단 응답과 집계는 팀 이름이 아니라 이 문서의 id 를
            // 물고 있으므로, 이름을 고쳐도 지난 결과가 그대로 새 이름으로 따라온다.
            // 삭제와 달리 잃는 데이터가 없어 확인 절차를 두지 않는다.
            const commitEdit = async () => {
                const v = editName.trim();
                if (!v || saving) return;
                const target = teamStats.find(t => t.id === editingId);
                if (!target) return cancelEdit();
                if (v === target.name) return cancelEdit();
                if (nameTaken(v, editingId)) return alert("같은 이름의 팀이 이미 있습니다.");
                setSaving(true);
                try {
                    await window.firestore.updateDoc(
                        window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'teams', editingId),
                        { name: v });
                    cancelEdit();
                } catch (e) {
                    alert("이름 변경 실패: " + e.message);
                } finally {
                    setSaving(false);
                }
            };

            // 팀을 지우면 그 팀으로 제출된 지난 진단 결과가 어디에도 붙지 않는다.
            // 조직 개편으로 팀이 없어지는 일은 있으므로 막지는 않되, 무슨 일이 생기는지 알린다.
            const handleDelete = async (t) => {
                if (!confirm(`'${t.name}' 을 목록에서 지웁니다.\n\n이미 제출된 진단 응답은 남지만, 이 팀 이름으로는 더 이상 집계되지 않습니다.`)) return;
                await window.firestore.deleteDoc(
                    window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'teams', t.id));
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 fade-in">
                    <h2 className="text-lg font-bold text-slate-800 mb-2">팀/조직 관리</h2>
                    <p className="text-sm text-slate-500 mb-5 font-medium">
                        팀 목록은 기간과 무관하게 유지됩니다. 달이 바뀌어도 다시 등록하실 필요가 없습니다.
                        <span className="block text-xs text-slate-400 mt-1">아래 상태·키워드는 현재 조회 기간({currentPeriod})의 진단 결과입니다.</span>
                    </p>

                    {teamStats.length === 0 && (
                        <div className="bg-red-50 border border-red-200 rounded-xl p-4 mb-5 flex items-start gap-3 flex-wrap">
                            <Icon name="alert-circle" size={18} className="text-red-600 mt-0.5 flex-shrink-0" />
                            <div className="flex-1 min-w-[240px]">
                                <p className="font-bold text-slate-800 text-sm">등록된 팀이 없습니다</p>
                                <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                                    팀 목록이 비어 있으면 구성원이 소속 부서를 고를 수 없어 조직 진단을 제출하지 못합니다.
                                    아래에서 추가해주세요.
                                </p>
                            </div>
                            {legacyNames && legacyNames.length > 0 && (
                                <button onClick={migrateLegacy} disabled={migrating} className="bg-red-600 text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-red-700 disabled:opacity-40 transition-colors whitespace-nowrap">
                                    {migrating ? "옮기는 중" : `예전 팀 ${legacyNames.length}개 옮기기`}
                                </button>
                            )}
                        </div>
                    )}

                    <form onSubmit={handleSave} className="flex gap-2 mb-6 bg-slate-50 p-4 rounded-lg flex-wrap">
                        <input placeholder="팀명" value={name} onChange={e => setName(e.target.value)} className="flex-1 min-w-[200px] border border-slate-200 p-2.5 rounded-lg text-sm bg-white focus:outline-none focus:border-brand-500" required />
                        <button className="bg-brand-600 text-white px-5 py-2.5 rounded-lg font-bold text-sm hover:bg-brand-700 transition-colors">팀 추가</button>
                    </form>

                    <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50"><tr><th className="p-3">팀명</th><th className="p-3">상태 ({currentPeriod})</th><th className="p-3">응답</th><th className="p-3">키워드(VoE)</th><th className="p-3">관리</th></tr></thead>
                            <tbody>
                                {teamStats.length === 0 ? (
                                    <tr><td colSpan="5" className="p-8 text-center text-slate-500">등록된 팀이 없습니다.</td></tr>
                                ) : teamStats.map(t => (
                                    <tr key={t.id} className="border-b">
                                        <td className="p-3 font-medium text-slate-800">
                                            {editingId === t.id ? (
                                                <input
                                                    value={editName}
                                                    onChange={e => setEditName(e.target.value)}
                                                    onKeyDown={e => {
                                                        if (e.key === 'Enter') { e.preventDefault(); commitEdit(); }
                                                        if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
                                                    }}
                                                    className="w-full min-w-[160px] border border-brand-400 px-2.5 py-1.5 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-200"
                                                    autoFocus
                                                />
                                            ) : t.name}
                                        </td>
                                        <td className="p-3"><Badge type={t.status === '위험' || t.status === '심각' ? 'critical' : t.status === '표본부족' ? 'neutral' : 'good'} text={t.status || '미집계'} /></td>
                                        <td className="p-3 text-slate-500">{t.responseCount != null ? `${t.responseCount}명` : '-'}</td>
                                        <td className="p-3 text-xs text-slate-500">{(t.keywords || []).length ? t.keywords.join(", ") : "-"}</td>
                                        <td className="p-3">
                                            {editingId === t.id ? (
                                                <span className="flex items-center gap-2 whitespace-nowrap">
                                                    <button onClick={commitEdit} disabled={saving || !editName.trim()} className="bg-brand-600 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg hover:bg-brand-700 disabled:opacity-40 transition-colors">{saving ? "저장 중" : "저장"}</button>
                                                    <button onClick={cancelEdit} className="text-slate-500 text-xs font-bold hover:underline">취소</button>
                                                </span>
                                            ) : (
                                                <span className="flex items-center gap-3 whitespace-nowrap">
                                                    <button onClick={() => startEdit(t)} className="text-brand-600 text-xs font-bold hover:underline">수정</button>
                                                    <button onClick={() => handleDelete(t)} className="text-red-500 text-xs font-bold hover:underline">삭제</button>
                                                </span>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const SettingsView = ({ globalMetrics, chartData, availableYears, setAvailableYears, currentPeriod, teamStats, aiConfig }) => {
            const [form, setForm] = useState(globalMetrics);
            const [newYear, setNewYear] = useState("");
            const [resetConfirm, setResetConfirm] = useState(false);
            const [aiApiKeyInput, setAiApiKeyInput] = useState("");
            const [aiModels, setAiModels] = useState([]);
            const [aiSelectedModel, setAiSelectedModel] = useState("");
            const [isSearchingModels, setIsSearchingModels] = useState(false);
            const [isSavingAiConfig, setIsSavingAiConfig] = useState(false);

            useEffect(() => setForm(globalMetrics), [globalMetrics]);
            useEffect(() => {
                setAiApiKeyInput(aiConfig?.apiKey || "");
                setAiModels(Array.isArray(aiConfig?.models) ? aiConfig.models : []);
                setAiSelectedModel(aiConfig?.selectedModel || "");
            }, [aiConfig]);

            const handleMetricChange = (key, field, val) => {
                setForm(prev => ({ ...prev, [key]: { ...prev[key], [field]: val } }));
            };

            const save = async () => {
                 await window.firestore.setDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'global_stats', currentPeriod), form);
                 alert("저장되었습니다.");
            };

            const addYear = () => {
                if(newYear && !availableYears.includes(newYear)) setAvailableYears([...availableYears, newYear].sort());
                setNewYear("");
            };

            const resetPeriodData = async () => {
                if(!resetConfirm) {
                    setResetConfirm(true);
                    setTimeout(() => setResetConfirm(false), 3000);
                    return;
                }
                
                try {
                    await window.firestore.deleteDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'global_stats', currentPeriod));
                    const updatedTrend = chartData.trend.filter(t => t.label !== currentPeriod);
                    await window.firestore.updateDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'chart_stats', 'current'), {
                        trend: updatedTrend
                    });
                    setResetConfirm(false);
                    alert(`현재 기간(${currentPeriod})의 모든 데이터가 초기화되었습니다.`);
                } catch (e) {
                    console.error(e);
                    alert("초기화 실패");
                }
            };

            const handleManualRefresh = async () => {
                await calculatePeriodStats(window.db, currentPeriod, teamStats, false);
            };

            const clearChartData = async () => {
                if(!confirm("모든 차트 데이터를 삭제하시겠습니까?")) return;
                await window.firestore.setDoc(window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'chart_stats', 'current'), { trend: [] });
                alert("차트 데이터가 초기화되었습니다.");
            };

            const saveAiSettings = async (next = {}) => {
                try {
                    setIsSavingAiConfig(true);
                    const merged = {
                        keyStorageMode: 'cloud',
                        apiKey: aiApiKeyInput,
                        models: aiModels,
                        selectedModel: aiSelectedModel,
                        ...next,
                        updatedAt: window.firestore.serverTimestamp()
                    };
                    await window.firestore.setDoc(
                        window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'app_settings', 'ai_config'),
                        merged,
                        { merge: true }
                    );
                } finally {
                    setIsSavingAiConfig(false);
                }
            };

            const handleSaveApiKey = async () => {
                const key = String(aiApiKeyInput || '').trim();
                if (!key) return alert("API 키를 입력해주세요.");
                await saveAiSettings({ apiKey: key });
                alert("API 키가 클라우드에 저장되었습니다.");
            };

            const handleSearchModels = async () => {
                const key = String(aiApiKeyInput || aiConfig?.apiKey || '').trim();
                if (!key) return alert("먼저 API 키를 입력하거나 저장해주세요.");
                setIsSearchingModels(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);

                    const models = (data.models || [])
                        .filter(m => m.supportedGenerationMethods?.includes("generateContent") && String(m.name || '').includes("gemini"))
                        .map(m => String(m.name).replace("models/", ""))
                        .sort();

                    if (models.length === 0) throw new Error("사용 가능한 Gemini 모델을 찾을 수 없습니다.");

                    const preferred = models.find(m => m.includes("1.5-flash")) || models[0];
                    setAiModels(models);
                    setAiSelectedModel(preferred);
                    setAiApiKeyInput(key);
                    await saveAiSettings({ apiKey: key, models, selectedModel: preferred });
                    alert(`모델 검색 완료: ${models.length}개`);
                } catch (e) {
                    console.error(e);
                    alert(`모델 검색 실패: ${e.message}`);
                } finally {
                    setIsSearchingModels(false);
                }
            };

            const handleSelectModel = async (model) => {
                setAiSelectedModel(model);
                await saveAiSettings({ selectedModel: model });
            };

            const handleResetAiSettings = async () => {
                if (!confirm("저장된 API 키 및 모델 설정을 초기화하시겠습니까?")) return;
                setAiApiKeyInput("");
                setAiModels([]);
                setAiSelectedModel("");
                await saveAiSettings({ apiKey: "", models: [], selectedModel: "" });
                alert("AI 설정이 초기화되었습니다.");
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 fade-in">
                    <div className="mb-8 border-b pb-6">
                        <h2 className="text-lg font-bold mb-4">Google AI 설정</h2>
                        <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                            <p className="text-xs text-slate-700 font-bold">저장 위치: 클라우드(Firestore)</p>
                            <p className="text-xs text-slate-500 mt-1">관리자 설정 메뉴에서 등록/수정 시 모든 관리자 화면에 동기화됩니다.</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="md:col-span-2">
                                <label className="block text-xs text-slate-500 mb-1">Google AI API Key</label>
                                <input
                                    type="password"
                                    value={aiApiKeyInput}
                                    onChange={e => setAiApiKeyInput(e.target.value)}
                                    placeholder="AIza..."
                                    className="w-full border p-2.5 rounded text-sm"
                                />
                            </div>
                            <div className="flex items-end">
                                <button onClick={handleSaveApiKey} disabled={isSavingAiConfig} className="w-full bg-brand-600 text-white px-4 py-2.5 rounded font-bold hover:bg-brand-700 disabled:bg-slate-400">
                                    {isSavingAiConfig ? "저장 중..." : "API 키 저장"}
                                </button>
                            </div>
                        </div>
                        <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="md:col-span-2">
                                <label className="block text-xs text-slate-500 mb-1">AI 모델 선택</label>
                                <select
                                    value={aiSelectedModel}
                                    onChange={e => handleSelectModel(e.target.value)}
                                    className="w-full border p-2.5 rounded text-sm bg-white"
                                    disabled={aiModels.length === 0}
                                >
                                    <option value="">{aiModels.length === 0 ? "모델을 검색해주세요" : "모델 선택"}</option>
                                    {aiModels.map(model => <option key={model} value={model}>{model}</option>)}
                                </select>
                            </div>
                            <div className="space-y-2">
                                <button onClick={handleSearchModels} disabled={isSearchingModels} className="w-full bg-brand-600 text-white px-4 py-2 rounded font-bold hover:bg-brand-700 disabled:bg-slate-400">
                                    {isSearchingModels ? "검색 중..." : "모델 자동 검색"}
                                </button>
                                <button onClick={handleResetAiSettings} className="w-full bg-slate-100 text-slate-700 px-4 py-2 rounded font-bold hover:bg-slate-200">
                                    AI 설정 초기화
                                </button>
                            </div>
                        </div>
                    </div>
                    <div className="mb-8 border-b pb-6">
                        <h2 className="text-lg font-bold mb-4">자동화 도구</h2>
                        <div className="flex flex-col md:flex-row gap-4">
                            <div className="bg-brand-50 p-4 rounded-lg flex-1 flex flex-col justify-center">
                                <div>
                                    <h3 className="font-bold text-brand-800">데이터 수동 새로고침 ({currentPeriod})</h3>
                                    <p className="text-xs text-brand-600 mt-1">※ 데이터 등록 시 자동으로 계산되므로, 누락 시에만 사용하세요.</p>
                                </div>
                                <button onClick={handleManualRefresh} className="mt-2 w-full bg-brand-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-brand-700">새로고침</button>
                            </div>
                            
                            <div className="bg-amber-50 p-4 rounded-lg flex-1 flex flex-col justify-center">
                                <div><h3 className="font-bold text-amber-800">현재 데이터 초기화</h3><p className="text-xs text-amber-600 mt-1">현재 조회 중인 월의 KPI 값을 삭제합니다.</p></div>
                                <button onClick={resetPeriodData} className={`mt-2 w-full text-white px-4 py-2 rounded-lg font-bold transition-colors ${resetConfirm ? 'bg-red-600' : 'bg-amber-500 hover:bg-amber-600'}`}>
                                    {resetConfirm ? "확실합니까? (클릭)" : "초기화"}
                                </button>
                            </div>

                            <div className="bg-red-50 p-4 rounded-lg flex-1 flex flex-col justify-center">
                                <div><h3 className="font-bold text-red-800">차트 기록 전체 삭제</h3><p className="text-xs text-red-600 mt-1">저장된 eNPS 추이를 모두 삭제합니다.</p></div>
                                {/* 파괴적 동작은 '테두리형'으로 둬서, 같은 레드인 기본 버튼과 확실히 구분한다. */}
                                <button onClick={clearChartData} className="mt-2 w-full bg-white border-2 border-red-600 text-red-700 px-4 py-2 rounded-lg font-bold hover:bg-red-600 hover:text-white transition-colors">전체 삭제</button>
                            </div>
                        </div>
                    </div>
                    <h2 className="text-lg font-bold mb-6">KPI 수동 보정 ({currentPeriod})</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        {Object.entries(form).map(([key, data]) => (
                            <div key={key} className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                <h3 className="text-sm font-bold text-slate-700 mb-3 uppercase">{data.label}</h3>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-xs text-slate-500">값</label><input value={data.value} onChange={e => handleMetricChange(key, 'value', e.target.value)} className="w-full border p-2 rounded text-sm" /></div>
                                    <div><label className="text-xs text-slate-500">변화량</label><input value={data.diff} onChange={e => handleMetricChange(key, 'diff', e.target.value)} className="w-full border p-2 rounded text-sm" /></div>
                                </div>
                            </div>
                        ))}
                    </div>
                    <button onClick={save} className="bg-slate-800 text-white px-6 py-3 rounded-lg font-bold">저장</button>
                    <div className="mt-10 border-t pt-6">
                        <h2 className="text-lg font-bold mb-4">연도 설정</h2>
                        <div className="flex gap-2"><input value={newYear} onChange={e => setNewYear(e.target.value)} placeholder="예: 2028" className="border p-2 rounded w-32" /><button onClick={addYear} className="bg-green-600 text-white px-4 py-2 rounded font-bold">추가</button></div>
                    </div>
                </div>
            );
        };

        const Sidebar = ({ currentView, setView, role, isMobileMenuOpen, setIsMobileMenuOpen }) => {
            // 관리자 메뉴는 여덟 줄이라 그냥 늘어놓으면 어디까지가 한 묶음인지
            // 읽히지 않는다. 순서는 그대로 두고 머리글만 세 군데 넣는다.
            const adminMenu = [
                { id: 'dashboard', label: '대시보드', icon: 'layout-dashboard', group: '현황' },
                { id: 'board', label: '대나무숲 게시판', icon: 'users', group: '현황' },
                { id: 'pulse', label: '조직진단 현황', icon: 'bar-chart-2', group: '현황' },
                { id: 'teams', label: '팀/조직 관리', icon: 'users', group: '운영' },
                { id: 'analysis', label: '분석 및 개선', icon: 'lightbulb', group: '운영' },
                { id: 'data', label: '데이터 관리', icon: 'database', group: '관리' },
                { id: 'report', label: '리포트 생성', icon: 'file-text', group: '관리' },
                { id: 'settings', label: '설정', icon: 'settings', group: '관리' }
            ];
            // 고충 접수는 사내 카카오톡 채널이 맡고, 이 사이트의 중심은 대나무숲이다.
            // 매일 들어오는 화면을 맨 위에 두고, 어쩌다 한 번 쓰는 창구를 아래로 내린다.
            const empMenu = [
                { id: 'board', label: '대나무숲 게시판', icon: 'message-square', group: '이야기' },
                { id: 'guide', label: '이용 안내', icon: 'info', group: '이야기' },
                { id: 'pulse-survey', label: '조직 진단', icon: 'bar-chart-2', group: '참여' },
                { id: 'complaint', label: '고충 접수', icon: 'shield', group: '참여' }
            ];
            const menu = role === 'admin' ? adminMenu : empMenu;
            
            return (
                <>
                    {/* Mobile Overlay */}
                    {isMobileMenuOpen && (
                        <div 
                            className="fixed inset-0 bg-black bg-opacity-50 z-40 md:hidden"
                            onClick={() => setIsMobileMenuOpen(false)}
                        ></div>
                    )}
                    
                    {/* Sidebar Drawer */}
                    <aside className={`
                        sidebar-shell fixed top-0 left-0 bottom-0 z-50 w-64 border-r border-slate-200 flex flex-col h-full 
                        transform transition-transform duration-300 ease-in-out
                        ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} 
                        md:translate-x-0 no-print
                    `}>
                        <div className="sidebar-layer sidebar-brand h-16 flex items-center px-4 border-b border-brand-100 justify-between gap-2">
                            {/* 모바일 서랍에서는 오른쪽에 닫기 버튼이 겹치므로 글자를 줄인다. */}
                            <div className="relative flex items-center gap-2.5 min-w-0">
                                <span className="brand-mark w-9 h-9 rounded-xl text-white flex items-center justify-center flex-shrink-0">
                                    <BambooLeaf size={19} />
                                </span>
                                <span className="flex flex-col leading-none min-w-0">
                                    <span className="font-extrabold text-[15px] md:text-[17px] text-slate-900 tracking-tight truncate">엔코스 대나무숲</span>
                                    <span className="text-[10.5px] text-brand-600 font-bold tracking-wide mt-1">익명 소통 공간</span>
                                </span>
                            </div>
                            <button onClick={() => setIsMobileMenuOpen(false)} className="md:hidden text-slate-500 hover:text-brand-600 flex-shrink-0 relative">
                                <Icon name="x" size={24} />
                            </button>
                        </div>
                        <BambooGrove />
                        <nav className="sidebar-layer flex-1 p-3 overflow-y-auto">
                            {menu.map((item, i) => (
                                <React.Fragment key={item.id}>
                                    {item.group && item.group !== menu[i - 1]?.group && (
                                        <div className={`nav-caption px-3 pb-1.5 ${i === 0 ? 'pt-2' : 'pt-4'}`}>{item.group}</div>
                                    )}
                                    <button onClick={() => { setView(item.id); setIsMobileMenuOpen(false); }} className={`sidebar-item w-full flex items-center gap-3 px-2.5 py-2 text-sm font-medium rounded-xl ${currentView === item.id ? 'active' : 'text-slate-600'}`}>
                                        <span className="nav-icon"><Icon name={item.icon} size={17} /></span>
                                        {item.label}
                                    </button>
                                </React.Fragment>
                            ))}
                            {role !== 'admin' && (
                                <div className="mt-6 mx-1 rounded-xl border border-brand-100 bg-white/70 p-3.5">
                                    <div className="flex items-center gap-1.5 text-brand-700">
                                        <Icon name="shield" size={13} />
                                        <span className="text-[11px] font-extrabold">익명 보장</span>
                                    </div>
                                    <p className="text-[11px] text-slate-500 leading-relaxed mt-1.5">
                                        이름·부서를 받지 않습니다. 글마다 다른 표식이 붙어, 같은 사람이 쓴 글끼리도 서로 연결되지 않습니다.
                                    </p>
                                </div>
                            )}
                        </nav>
                        <div className="sidebar-layer p-3 border-t border-brand-100">
                            <div className={`px-3 py-2.5 rounded-xl border flex items-center gap-2.5 mb-2.5 ${role === 'admin' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-brand-700 border-brand-100'}`}>
                                <Icon name={role === 'admin' ? 'shield' : 'users'} size={15} />
                                <span className="text-xs font-bold">{role === 'admin' ? '관리자 모드' : '구성원 모드'}</span>
                            </div>
                            <div className="flex items-center gap-2.5 text-xs text-slate-400 px-2">
                                <span className="live-dot w-1.5 h-1.5 rounded-full bg-green-500 flex-shrink-0"></span>
                                <span>시스템 연동됨</span>
                            </div>
                        </div>
                    </aside>
                </>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState('employee'); 
            const [currentView, setCurrentView] = useState('board');    // 구성원 첫 화면은 대나무숲 게시판
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [selectedYear, setSelectedYear] = useState(() => nowPeriod().year);
            const [selectedMonth, setSelectedMonth] = useState(() => nowPeriod().month);
            // 올해가 목록에 없으면 관리자가 현재 기간을 고를 수 없게 된다.
            const [availableYears, setAvailableYears] = useState(() => {
                const y = Number(nowPeriod().year);
                return [String(y), String(y + 1)];
            });
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            const currentPeriod = useMemo(() => getFormattedPeriod(selectedYear, selectedMonth), [selectedYear, selectedMonth]);

            const defaultMetrics = {
                enps: { label: "몰입도 (eNPS)", value: "-", diff: "0" },
                safety: { label: "심리적 안전감", value: "-", diff: "0" },
                burnout: { label: "번아웃 리스크", value: "-", diff: "0" },
                growth: { label: "성장 비전 공감", value: "-", diff: "0" }
            };
            const [globalMetrics, setGlobalMetrics] = useState(defaultMetrics);
            const [chartData, setChartData] = useState({ trend: [] });
            const [teamStats, setTeamStats] = useState([]);
            const [aiConfig, setAiConfig] = useState({ keyStorageMode: 'cloud', apiKey: '', models: [], selectedModel: '' });

            useEffect(() => {
                const initAuth = async () => {
                    if (!window.firebaseAuth) return;
                    window.firebaseAuth.onAuthStateChanged(window.auth, async (u) => {
                        if (!u) {
                            window.firebaseAuth.signInAnonymously(window.auth).catch(console.error);
                            return;
                        }
                        setUser(u);
                        // 역할은 화면 상태가 아니라 실제 로그인 세션에서 나온다.
                        // 익명 세션이면 무조건 구성원이고, 관리자는 admins/{uid} 가 있어야 한다.
                        // (같은 조건을 Firestore 보안 규칙에서도 검사하므로 화면만 바꿔서는 데이터에 닿지 못한다)
                        if (u.isAnonymous) { setRole('employee'); return; }
                        try {
                            const adminDoc = await window.firestore.getDoc(window.firestore.doc(window.db, 'admins', u.uid));
                            setRole(adminDoc.exists() ? 'admin' : 'employee');
                        } catch (e) {
                            console.error(e);
                            setRole('employee');
                        }
                    });
                };
                initAuth();
            }, []);

            const prevRole = useRef(role);
            useEffect(() => {
                // 게시판은 양쪽이 같은 화면을 본다(관리자는 숨김 처리 권한만 더 갖는다).
                const sharedViews = ['board'];
                const employeeOnlyViews = ['guide', 'complaint', 'pulse-survey'];

                // 역할이 바뀌는 순간에는 그 역할의 첫 화면으로 보낸다.
                // 게시판이 공용 화면이라, 이 처리가 없으면 관리자로 로그인해도
                // 구성원 화면인 게시판에 그대로 남는다.
                if (prevRole.current !== role) {
                    prevRole.current = role;
                    setCurrentView(role === 'admin' ? 'dashboard' : 'board');
                    return;
                }
                if(role === 'employee' && !employeeOnlyViews.includes(currentView) && !sharedViews.includes(currentView)) setCurrentView('board');
                else if(role === 'admin' && employeeOnlyViews.includes(currentView)) setCurrentView('dashboard');
            }, [role, currentView]);

            useEffect(() => {
                if (!window.db) return;
                const metricsRef = window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'global_stats', currentPeriod);
                const unsubMetrics = window.firestore.onSnapshot(metricsRef, (s) => {
                    if (s.exists()) setGlobalMetrics(s.data());
                    else setGlobalMetrics(defaultMetrics); 
                });
                // 팀 목록은 조직 구조라 기간이 없다(teams). 진단 결과만 기간을 갖는다(team_stats).
                // 예전에는 둘이 한 문서에 섞여 있어, 달이 바뀌면 팀 목록까지 사라졌다.
                let roster = [];
                let periodStats = {};
                const pushMerged = () => {
                    // 화면들이 쓰는 모양(id·name·status·diagnosisScores…)은 그대로 유지한다.
                    const merged = roster.map(t => ({ ...(periodStats[t.id] || {}), id: t.id, name: t.name }));
                    merged.sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'));
                    setTeamStats(merged);
                };
                const unsubRoster = window.firestore.onSnapshot(
                    window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'teams'),
                    (s) => { roster = s.docs.map(d => ({ id: d.id, ...d.data() })); pushMerged(); }
                );
                const unsubTeams = window.firestore.onSnapshot(
                    window.firestore.query(
                        window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'team_stats'),
                        window.firestore.where("period", "==", currentPeriod)
                    ),
                    (s) => {
                        periodStats = {};
                        s.docs.forEach(d => { const v = d.data(); if (v.teamId) periodStats[v.teamId] = v; });
                        pushMerged();
                    }
                );
                const chartRef = window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'chart_stats', 'current');
                const unsubChart = window.firestore.onSnapshot(chartRef, (s) => {
                    if (s.exists()) setChartData(s.data());
                    else window.firestore.setDoc(chartRef, { trend: [] }); 
                });
                // AI 설정에는 API 키가 들어 있고 관리자 화면에서만 쓰인다.
                // 구성원 세션까지 구독하면 보안 규칙에서 이 문서를 관리자 전용으로 잠글 수 없다.
                let unsubAiConfig = () => {};
                if (role === 'admin') {
                    const aiConfigRef = window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'app_settings', 'ai_config');
                    unsubAiConfig = window.firestore.onSnapshot(aiConfigRef, (s) => {
                        if (!s.exists()) return;
                        const data = s.data();
                        setAiConfig({
                            keyStorageMode: data?.keyStorageMode || 'cloud',
                            apiKey: data?.apiKey || '',
                            models: Array.isArray(data?.models) ? data.models : [],
                            selectedModel: data?.selectedModel || ''
                        });
                    });
                }
                return () => { unsubMetrics(); unsubTeams(); unsubRoster(); unsubChart(); unsubAiConfig(); };
            }, [currentPeriod, user, role]);
            
            const handleAdminSuccess = () => { setRole('admin'); };

            // 화면만 구성원으로 바꾸는 게 아니라 관리자 세션을 실제로 끊고 익명으로 되돌린다.
            const leaveAdmin = async () => {
                if (role !== 'admin') return;
                try {
                    await window.firebaseAuth.signOut(window.auth);
                    await window.firebaseAuth.signInAnonymously(window.auth);
                } catch (e) { console.error(e); }
                setRole('employee');
            };

            if (!user) return <Loading />;

            return (
                <div className="flex min-h-screen">
                    {currentView === 'board' && <LeafField />}
                    <Sidebar 
                        currentView={currentView} 
                        setView={setCurrentView} 
                        role={role} 
                        isMobileMenuOpen={isMobileMenuOpen} 
                        setIsMobileMenuOpen={setIsMobileMenuOpen}
                    />
                    <main className="flex-1 md:ml-64 px-4 py-4 md:px-6 md:py-8 lg:px-10 overflow-y-auto print:ml-0 print:p-0 transition-all duration-300">
                        <header className="flex justify-between items-center mb-6 md:mb-8 no-print">
                            <div className="flex items-center gap-3">
                                {/* Mobile Menu Button */}
                                <button onClick={() => setIsMobileMenuOpen(true)} className="md:hidden text-slate-600 p-1 rounded-md hover:bg-brand-50 hover:text-brand-600">
                                    <Icon name="menu" size={24} />
                                </button>

                                <div>
                                    <h1 className="text-xl md:text-2xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2.5">
                                        <span className="hidden md:inline-block w-1 h-6 rounded-full bg-brand-600"></span>
                                        {currentView === 'board' ? '대나무숲 게시판' : role === 'employee' ? (currentView === 'guide' ? '이용 안내' : currentView === 'pulse-survey' ? '조직 진단' : '고충 접수') : 'HR 관리자 콘솔'}
                                    </h1>
                                    {/* 게시판은 기간과 무관한 화면이라 조회 기간 선택을 숨긴다. */}
                                    {role === 'admin' && currentView !== 'board' && (
                                        <div className="mt-2 flex items-center gap-2 md:pl-[18px]">
                                            <p className="hidden md:block text-sm text-brand-600 font-bold">🕒 조회 기간:</p>
                                            <select value={selectedYear} onChange={e => setSelectedYear(e.target.value)} className="text-xs p-1 rounded-md border border-brand-200 bg-white text-brand-700 font-semibold">{availableYears.map(y => <option key={y} value={y}>{y}년</option>)}</select>
                                            <select value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="text-xs p-1 rounded-md border border-brand-200 bg-white text-brand-700 font-semibold">{Array.from({length:12}, (_,i)=>i+1).map(m => <option key={m} value={m}>{m}월</option>)}</select>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="flex items-center gap-4">
                                <div className="bg-white border border-slate-200 rounded-lg p-1 flex shadow-sm">
                                    <button onClick={() => setShowAdminLogin(true)} className={`px-2 py-1.5 md:px-3 text-xs font-bold rounded-md transition ${role === 'admin' ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-brand-50 hover:text-brand-600'}`}>관리자</button>
                                    <button onClick={leaveAdmin} className={`px-2 py-1.5 md:px-3 text-xs font-bold rounded-md transition ${role === 'employee' ? 'bg-brand-600 text-white' : 'text-slate-500 hover:bg-brand-50 hover:text-brand-600'}`}>구성원</button>
                                </div>
                            </div>
                        </header>
                        
                        {currentView === 'board' && <BoardView user={user} role={role} setView={setCurrentView} />}

                        {role === 'employee' && currentView === 'guide' && <GuideView setView={setCurrentView} />}
                        {role === 'employee' && currentView === 'complaint' && <ComplaintIntakeView setView={setCurrentView} />}
                        {role === 'employee' && currentView === 'pulse-survey' && <SurveyView teamStats={teamStats} currentPeriod={currentPeriod} user={user} />}
                        
                        {role === 'admin' && currentView === 'dashboard' && <DashboardView globalMetrics={globalMetrics} chartData={chartData} teamStats={teamStats} currentPeriod={currentPeriod} user={user} setView={setCurrentView} />}
                        {role === 'admin' && currentView === 'pulse' && <PulseInsightView teamStats={teamStats} currentPeriod={currentPeriod} />}
                        {role === 'admin' && currentView === 'teams' && <TeamManagementView teamStats={teamStats} currentPeriod={currentPeriod} />}
                        {role === 'admin' && currentView === 'analysis' && <AnalysisView teamStats={teamStats} globalMetrics={globalMetrics} chartData={chartData} currentPeriod={currentPeriod} aiConfig={aiConfig} />}
                        {role === 'admin' && currentView === 'data' && <DataManagementView teamStats={teamStats} currentPeriod={currentPeriod} />}
                        {role === 'admin' && currentView === 'settings' && <SettingsView globalMetrics={globalMetrics} chartData={chartData} availableYears={availableYears} setAvailableYears={setAvailableYears} currentPeriod={currentPeriod} teamStats={teamStats} aiConfig={aiConfig} />}
                        {role === 'admin' && currentView === 'report' && <ReportView globalMetrics={globalMetrics} teamStats={teamStats} />}

                        {showAdminLogin && <AdminLoginModal onClose={() => setShowAdminLogin(false)} onSuccess={handleAdminSuccess} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
