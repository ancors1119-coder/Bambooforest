                                </div>
                            </div>
                        ))}
                    </div>
                    <button onClick={save} className="bg-slate-800 text-white px-6 py-3 rounded-lg font-bold">저장</button>
                    <div className="mt-10 border-t pt-6">
                        <h2 className="text-lg font-bold mb-4">연도 설정</h2>
                        <div className="flex gap-2"><input value={newYear} onChange={e => setNewYear(e.target.value)} placeholder="예: 2028" className="border p-2 rounded w-32" /><button onClick={addYear} className="bg-green-600 text-white px-4 py-2 rounded font-bold">추가</button></div>
                    </div>
                </div>
            );
        };

        const Sidebar = ({ currentView, setView, role, isMobileMenuOpen, setIsMobileMenuOpen }) => {
            const adminMenu = [
                { id: 'dashboard', label: '대시보드', icon: 'layout-dashboard' },
                { id: 'complaints', label: '고충 처리함', icon: 'inbox' },
                { id: 'pulse', label: '조직진단 현황', icon: 'bar-chart-2' },
                { id: 'teams', label: '팀/조직 관리', icon: 'users' },
                { id: 'analysis', label: '분석 및 개선', icon: 'lightbulb' },
                { id: 'data', label: '데이터 관리', icon: 'database' }, 
                { id: 'report', label: '리포트 생성', icon: 'file-text' }, 
                { id: 'settings', label: '설정', icon: 'settings' }
            ];
            const empMenu = [
                { id: 'complaint', label: '고충 접수', icon: 'message-square' },
                { id: 'pulse-survey', label: '조직 진단', icon: 'bar-chart-2' }
            ];
            const menu = role === 'admin' ? adminMenu : empMenu;
            
            return (
                <>
                    {/* Mobile Overlay */}
                    {isMobileMenuOpen && (
                        <div 
                            className="fixed inset-0 bg-black bg-opacity-50 z-40 md:hidden"
                            onClick={() => setIsMobileMenuOpen(false)}
                        ></div>
                    )}
                    
                    {/* Sidebar Drawer */}
                    <aside className={`
                        fixed top-0 left-0 bottom-0 z-50 w-64 bg-white border-r border-slate-200 flex flex-col h-full 
                        transform transition-transform duration-300 ease-in-out
                        ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} 
                        md:translate-x-0 no-print
                    `}>
                        <div className="h-16 flex items-center px-5 border-b border-slate-100 justify-between">
                            <div className="flex items-center gap-2.5">
                                <span className="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center shadow-brand">
                                    <Icon name="message-square" size={17} />
                                </span>
                                <span className="font-extrabold text-lg text-slate-900 tracking-tight">대나무숲</span>
                            </div>
                            <button onClick={() => setIsMobileMenuOpen(false)} className="md:hidden text-slate-500 hover:text-brand-600">
                                <Icon name="x" size={24} />
                            </button>
                        </div>
                        <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
                            {menu.map(item => (
                                <button key={item.id} onClick={() => { setView(item.id); setIsMobileMenuOpen(false); }} className={`sidebar-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg ${currentView === item.id ? 'active' : 'text-slate-600'}`}>
                                    <Icon name={item.icon} size={20} />
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-100">
                            <div className={`p-3 rounded-lg border flex items-center gap-2 mb-2 ${role === 'admin' ? 'bg-slate-900 text-white border-slate-900' : 'bg-brand-50 text-brand-700 border-brand-100'}`}>
                                <span className="text-xs font-bold">{role === 'admin' ? '관리자 모드' : '구성원 모드'}</span>
                            </div>
                            <div className="flex items-center gap-2 text-xs text-slate-500 px-1"><div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div><span>시스템 연동됨</span></div>
                        </div>
                    </aside>
                </>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState('employee'); 
            const [currentView, setCurrentView] = useState('complaint');
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [selectedYear, setSelectedYear] = useState("2026");
            const [selectedMonth, setSelectedMonth] = useState("2");
            const [availableYears, setAvailableYears] = useState(["2026", "2027"]);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            const currentPeriod = useMemo(() => getFormattedPeriod(selectedYear, selectedMonth), [selectedYear, selectedMonth]);

            const defaultMetrics = {
                enps: { label: "몰입도 (eNPS)", value: "-", diff: "0" },
                safety: { label: "심리적 안전감", value: "-", diff: "0" },
                burnout: { label: "번아웃 리스크", value: "-", diff: "0" },
                growth: { label: "성장 비전 공감", value: "-", diff: "0" }
            };
            const [globalMetrics, setGlobalMetrics] = useState(defaultMetrics);
            const [chartData, setChartData] = useState({ trend: [] });
            const [teamStats, setTeamStats] = useState([]);
            const [aiConfig, setAiConfig] = useState({ keyStorageMode: 'cloud', apiKey: '', models: [], selectedModel: '' });

            useEffect(() => {
                const initAuth = async () => {
                    if (!window.firebaseAuth) return;
                    window.firebaseAuth.onAuthStateChanged(window.auth, (u) => {
                        if (u) { setUser(u); } 
                        else { window.firebaseAuth.signInAnonymously(window.auth).catch(console.error); }
                    });
                };
                initAuth();
            }, []);

            useEffect(() => {
                if(role === 'employee' && (currentView !== 'complaint' && currentView !== 'pulse-survey')) setCurrentView('complaint');
                else if(role === 'admin' && (currentView === 'complaint' || currentView === 'pulse-survey')) setCurrentView('dashboard');
            }, [role, currentView]);

            useEffect(() => {
                if (!window.db) return;
                const metricsRef = window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'global_stats', currentPeriod);
                const unsubMetrics = window.firestore.onSnapshot(metricsRef, (s) => {
                    if (s.exists()) setGlobalMetrics(s.data());
                    else setGlobalMetrics(defaultMetrics); 
                });
                const teamQ = window.firestore.query(
                    window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'team_stats'),
                    window.firestore.where("period", "==", currentPeriod)
                );
                const unsubTeams = window.firestore.onSnapshot(teamQ, (s) => {
                    const teams = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    teams.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
                    setTeamStats(teams);
                });
                const chartRef = window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'chart_stats', 'current');
                const unsubChart = window.firestore.onSnapshot(chartRef, (s) => {
                    if (s.exists()) setChartData(s.data());
                    else window.firestore.setDoc(chartRef, { trend: [] }); 
                });
                const aiConfigRef = window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'app_settings', 'ai_config');
                const unsubAiConfig = window.firestore.onSnapshot(aiConfigRef, (s) => {
                    if (!s.exists()) return;
                    const data = s.data();
                    setAiConfig({
                        keyStorageMode: data?.keyStorageMode || 'cloud',
                        apiKey: data?.apiKey || '',
                        models: Array.isArray(data?.models) ? data.models : [],
                        selectedModel: data?.selectedModel || ''
                    });
                });
                return () => { unsubMetrics(); unsubTeams(); unsubChart(); unsubAiConfig(); };
            }, [currentPeriod, user]);
            
            const handleAdminSuccess = () => { setRole('admin'); };

            if (!user) return <Loading />;

            return (
                <div className="flex min-h-screen">
                    <Sidebar 
                        currentView={currentView} 
                        setView={setCurrentView} 
                        role={role} 
                        isMobileMenuOpen={isMobileMenuOpen} 
                        setIsMobileMenuOpen={setIsMobileMenuOpen}
                    />
                    <main className="flex-1 md:ml-64 p-4 md:p-8 overflow-y-auto print:ml-0 print:p-0 transition-all duration-300">
                        <header className="flex justify-between items-center mb-6 md:mb-8 no-print">
                            <div className="flex items-center gap-3">
                                {/* Mobile Menu Button */}
                                <button onClick={() => setIsMobileMenuOpen(true)} className="md:hidden text-slate-600 p-1 rounded-md hover:bg-brand-50 hover:text-brand-600">
                                    <Icon name="menu" size={24} />
                                </button>

                                <div>
                                    <h1 className="text-xl md:text-2xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2.5">
                                        <span className="hidden md:inline-block w-1 h-6 rounded-full bg-brand-600"></span>
                                        {role === 'employee' ? (currentView === 'pulse-survey' ? '조직 진단' : '고충 접수') : 'HR 관리자 콘솔'}
                                    </h1>
                                    {role === 'admin' && (
                                        <div className="mt-2 flex items-center gap-2 md:pl-[18px]">
                                            <p className="hidden md:block text-sm text-brand-600 font-bold">🕒 조회 기간:</p>
                                            <select value={selectedYear} onChange={e => setSelectedYear(e.target.value)} className="text-xs p-1 rounded-md border border-brand-200 bg-white text-brand-700 font-semibold">{availableYears.map(y => <option key={y} value={y}>{y}년</option>)}</select>
                                            <select value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="text-xs p-1 rounded-md border border-brand-200 bg-white text-brand-700 font-semibold">{Array.from({length:12}, (_,i)=>i+1).map(m => <option key={m} value={m}>{m}월</option>)}</select>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="flex items-center gap-4">
                                <div className="bg-white border border-slate-200 rounded-lg p-1 flex shadow-sm">
                                    <button onClick={() => setShowAdminLogin(true)} className={`px-2 py-1.5 md:px-3 text-xs font-bold rounded-md transition ${role === 'admin' ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-brand-50 hover:text-brand-600'}`}>관리자</button>
                                    <button onClick={() => setRole('employee')} className={`px-2 py-1.5 md:px-3 text-xs font-bold rounded-md transition ${role === 'employee' ? 'bg-brand-600 text-white' : 'text-slate-500 hover:bg-brand-50 hover:text-brand-600'}`}>구성원</button>
                                </div>
                            </div>
                        </header>
                        
                        {role === 'employee' && <SurveyView teamStats={teamStats} currentPeriod={currentPeriod} user={user} mode={currentView} />}
                        
                        {role === 'admin' && currentView === 'dashboard' && <DashboardView globalMetrics={globalMetrics} chartData={chartData} teamStats={teamStats} currentPeriod={currentPeriod} user={user} />}
                        {role === 'admin' && currentView === 'complaints' && <ComplaintManagementView teamStats={teamStats} currentPeriod={currentPeriod} user={user} />}
                        {role === 'admin' && currentView === 'pulse' && <PulseInsightView teamStats={teamStats} currentPeriod={currentPeriod} />}
                        {role === 'admin' && currentView === 'teams' && <TeamManagementView teamStats={teamStats} currentPeriod={currentPeriod} />}
                        {role === 'admin' && currentView === 'analysis' && <AnalysisView teamStats={teamStats} globalMetrics={globalMetrics} chartData={chartData} currentPeriod={currentPeriod} aiConfig={aiConfig} />}
                        {role === 'admin' && currentView === 'data' && <DataManagementView teamStats={teamStats} currentPeriod={currentPeriod} />}
                        {role === 'admin' && currentView === 'settings' && <SettingsView globalMetrics={globalMetrics} chartData={chartData} availableYears={availableYears} setAvailableYears={setAvailableYears} currentPeriod={currentPeriod} teamStats={teamStats} aiConfig={aiConfig} />}
                        {role === 'admin' && currentView === 'report' && <ReportView globalMetrics={globalMetrics} teamStats={teamStats} />}

                        {showAdminLogin && <AdminLoginModal onClose={() => setShowAdminLogin(false)} onSuccess={handleAdminSuccess} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
