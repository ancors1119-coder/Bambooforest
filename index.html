            const [caseData, setCaseData] = useState(null);

            // 조회에 성공하면 해당 문서를 구독해, 담당자 답변이 실시간으로 들어온다.
            useEffect(() => {
                if (!foundId || !window.db) return;
                const ref = window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'complaint_cases', foundId);
                return window.firestore.onSnapshot(ref, (snap) => {
                    if (snap.exists()) setCaseData({ id: snap.id, ...snap.data() });
                });
            }, [foundId]);

            const handleLookup = async (e) => {
                e.preventDefault();
                setError("");
                if (!caseNoInput.trim()) return setError("접수번호를 입력해주세요.");
                if (!/^[0-9]{4,8}$/.test(pinInput)) return setError("PIN 을 숫자 4~8자리로 입력해주세요.");

                setChecking(true);
                try {
                    // 해시가 곧 문서 ID 다. 목록을 훑지 않고 한 건만 직접 읽으므로,
                    // 보안 규칙에서 이 컬렉션의 list 권한을 관리자에게만 줄 수 있다.
                    // 하이픈이나 공백을 다르게 입력해도 찾히도록 몇 가지 형태를 시도한다.
                    let snap = null, hash = null;
                    for (const form of caseNoCandidates(caseNoInput)) {
                        hash = await makeLookupHash(form, pinInput);
                        const found = await window.firestore.getDoc(
                            window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'complaint_cases', hash)
                        );
                        if (found.exists()) { snap = found; break; }
                    }
                    if (!snap) {
                        // 어느 쪽이 틀렸는지 알려주지 않는다 (접수번호 대입 공격 방지).
                        setError("일치하는 접수 건이 없습니다. 접수번호와 PIN 을 다시 확인해주세요.");
                        setFoundId(null);
                        setCaseData(null);
                    } else {
                        setCaseData({ id: hash, ...snap.data() });
                        setFoundId(hash);
                    }
                } catch (err) {
                    setError(err.message || "조회 중 오류가 발생했습니다.");
                } finally {
                    setChecking(false);
                }
            };

            const sendMessage = async (text) => {
                if (!caseData) return;
                await window.firestore.updateDoc(
                    window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', 'complaint_cases', caseData.id),
                    { thread: appendThreadMessage(caseData, 'reporter', text), updatedAt: window.firestore.serverTimestamp() }
                );
            };

            const reset = () => { setFoundId(null); setCaseData(null); setCaseNoInput(""); setPinInput(""); setError(""); };

            if (caseData) {
                const statusTone = caseData.status === "종결" ? "bg-green-100 text-green-700 border-green-200"
                    : caseData.status === "보류" ? "bg-slate-100 text-slate-700 border-slate-200"
                    : "bg-amber-100 text-amber-800 border-amber-200";
                return (
                    <div className="max-w-6xl mx-auto animate-fade-in my-4 md:my-8 space-y-4">
                        <div className="bg-white rounded-2xl shadow-card border border-slate-100 p-4 md:p-8">
                            <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                                <div className="min-w-0">
                                    <p className="text-xs font-bold text-slate-500">{caseData.caseNo}</p>
                                    <h1 className="text-xl md:text-2xl font-bold text-slate-800 mt-1 break-words">{caseData.subject}</h1>
                                    <p className="text-sm text-slate-500 mt-1">
                                        {getCategoryLabel(caseData.category)} · 긴급도 {getUrgencyLabel(caseData.urgency)} · 접수 {formatDateTime(caseData.createdAt)}
                                    </p>
                                </div>
                                <span className={`px-3 py-1.5 rounded-full text-xs font-bold border ${statusTone}`}>{caseData.status || "접수"}</span>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4">
                                    <p className="text-xs font-bold text-slate-500 mb-1">담당자</p>
                                    <p className="text-sm font-bold text-slate-800">{caseData.handler || "배정 전"}</p>
                                </div>
                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4">
                                    <p className="text-xs font-bold text-slate-500 mb-1">최근 업데이트</p>
                                    <p className="text-sm font-bold text-slate-800">{formatDateTime(caseData.updatedAt) }</p>
                                </div>
                            </div>

                            <div className="mb-6">
                                <h3 className="font-bold text-slate-800 mb-2">처리 결과</h3>
                                {caseData.outcome ? (
                                    <div className="whitespace-pre-wrap text-sm text-slate-700 leading-relaxed bg-brand-50 border border-brand-100 rounded-xl p-4">{caseData.outcome}</div>
                                ) : (
                                    <p className="text-sm text-slate-500 bg-slate-50 border border-slate-200 rounded-xl p-4">아직 처리 결과가 등록되지 않았습니다. 확인 후 이곳에 안내드립니다.</p>
                                )}
                            </div>

                            <div className="border-t border-slate-200 pt-5">
                                <h3 className="font-bold text-slate-800 mb-1">담당자와의 대화</h3>
                                <p className="text-xs text-slate-500 mb-3">익명이 유지된 채로 담당자와 이야기할 수 있습니다. 추가로 확인이 필요한 내용이 있으면 여기로 질문이 옵니다.</p>
                                <CaseThread
                                    thread={caseData.thread}
                                    viewer="reporter"
                                    onSend={sendMessage}
                                    emptyText="아직 오간 메시지가 없습니다. 궁금한 점을 남겨주세요."
                                />
                            </div>
                        </div>
                        <button onClick={reset} className="text-sm text-slate-500 hover:text-brand-600 font-bold">← 다른 접수 건 조회하기</button>
                    </div>
                );
            }

            return (
                <div className="max-w-lg mx-auto animate-fade-in my-4 md:my-8">
                    <div className="bg-white rounded-2xl shadow-card border border-slate-100 p-6 md:p-8">
                        <div className="w-12 h-12 bg-brand-50 border border-brand-100 rounded-full flex items-center justify-center mb-4">
                            <Icon name="search" size={22} className="text-brand-600" />
                        </div>
                        <h1 className="text-xl md:text-2xl font-bold text-slate-800">내 접수 조회</h1>
                        <p className="text-sm text-slate-500 mt-2 mb-6 leading-relaxed">
                            접수 시 받으신 <span className="font-bold text-slate-700">접수번호</span> 와 직접 정하신 <span className="font-bold text-slate-700">PIN</span> 을 입력하시면
                            처리 상태와 담당자 답변을 확인하실 수 있습니다. 익명 접수도 신원 확인 없이 그대로 조회됩니다.
                        </p>

                        <form onSubmit={handleLookup} className="space-y-4">
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-2">접수번호</label>
                                <input
                                    value={caseNoInput}
                                    onChange={e => setCaseNoInput(e.target.value)}
                                    className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white font-semibold focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200"
                                    placeholder="예: 엔코스-73152"
                                    autoFocus
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-2">조회 PIN</label>
                                <input
                                    type="password"
                                    inputMode="numeric"
                                    maxLength={8}
                                    value={pinInput}
                                    onChange={e => setPinInput(e.target.value.replace(/[^0-9]/g, ""))}
                                    className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white text-center tracking-[0.4em] focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200"
                                    placeholder="숫자 4~8자리"
                                />
                            </div>
                            {error && <p className="text-sm text-red-700 font-medium bg-red-50 border border-red-100 rounded-lg px-3 py-2">{error}</p>}
                            <button type="submit" disabled={checking} className="w-full bg-brand-600 text-white py-4 rounded-xl font-bold hover:bg-brand-700 shadow-brand transition-colors disabled:opacity-50">
                                {checking ? "조회 중…" : "조회하기"}
                            </button>
                        </form>

                        <p className="text-xs text-slate-400 mt-5 leading-relaxed">
                            PIN 은 암호화되어 저장되므로 관리자도 확인하거나 재발급할 수 없습니다.
                            분실하신 경우 번거로우시더라도 새로 접수해주세요.
                        </p>
                    </div>
                </div>
            );
        };

        // ── 안내 페이지 (구성원 첫 화면) ────────────────────────────
        // 익명 제보 도구는 "내가 쓴 게 누구에게 어디까지 보이는지" 를 이해시키지
        // 못하면 아무도 쓰지 않는다. 특히 이 서비스는 성격이 정반대인 창구
        // 두 개(관리자 전용 / 전체 공개)를 함께 두고 있어 그 구분이 중요하다.
        // 다만 급히 제보하려는 사람에게 벽이 되면 안 되므로, 각 항목에서 바로
        // 해당 화면으로 넘어갈 수 있게 한다.
        const GuideView = ({ setView }) => {
            const channels = [
                {
                    id: 'complaint',
                    icon: 'shield',
                    label: '고충 접수',
                    tagline: '관리자만 봅니다',
                    tone: 'brand',
                    desc: '괴롭힘, 부당한 업무 배분, 평가·보상 문제처럼 개별적으로 확인과 조치가 필요한 일을 접수합니다.',
                    points: ['HR 담당자만 열람', '접수번호로 진행 상황 추적', '담당자와 1:1 대화 가능'],
                    cta: '고충 접수하기'
                },
                {
                    id: 'board',
                    icon: 'users',
                    label: '대나무숲 게시판',
                    tagline: '구성원 모두가 봅니다',
                    tone: 'slate',
                    desc: '개선 아이디어, 칭찬, 소소한 질문처럼 함께 이야기하고 싶은 주제를 자유롭게 나눕니다.',
                    points: ['모든 구성원이 읽고 댓글', '글마다 다른 익명 표식', '신고가 쌓이면 자동으로 가려짐'],
                    cta: '게시판 둘러보기'
                }
            ];

            const steps = [
                { n: '1', title: '접수하기', desc: '익명 또는 기명으로 작성합니다. 익명을 고르면 부서·이름·연락처를 아예 받지 않습니다.' },
                { n: '2', title: '접수번호와 PIN 저장', desc: '제출 직후 ‘엔코스-73152’ 같은 접수번호가 발급됩니다. 직접 정하신 PIN 과 함께 보관해주세요.' },
                { n: '3', title: '담당자 확인', desc: '접수 → 검토중 → 조사중 → 조치중 → 종결 순으로 진행되며, 필요하면 담당자가 추가로 질문합니다.' },
                { n: '4', title: '결과 확인', desc: "‘내 접수 조회’ 에서 접수번호와 PIN 을 넣으면 처리 상태와 담당자 답변을 볼 수 있습니다." }
            ];

            const privacy = [
                { icon: 'user-x', title: '신원을 받지 않습니다', desc: '익명 접수와 게시판 글에는 이름·부서·연락처를 수집하지 않습니다. 인원이 적은 팀에서는 부서만으로도 사람이 특정되기 때문입니다.' },
                { icon: 'key', title: 'PIN 은 저장되지 않습니다', desc: '입력하신 PIN 은 암호화된 형태로만 남습니다. 관리자도 확인할 수 없고, 그래서 분실 시 재발급도 불가능합니다.' },
                { icon: 'shuffle', title: '글끼리 연결되지 않습니다', desc: '게시판 글에는 글마다 다른 익명 표식이 붙습니다. 같은 사람이 쓴 글 여러 개를 모아 글쓴이를 추정할 수 없습니다.' },
                { icon: 'eye-off', title: '내부 검토 자료는 따로입니다', desc: '담당자가 남기는 내부 메모와 위험도 평가는 처리 목적으로만 쓰이며 신고자 화면에 표시되지 않습니다.' }
            ];

            return (
                <div className="max-w-6xl mx-auto animate-fade-in my-4 md:my-8 space-y-5">

                    {/* 첫인상: 무엇을 하는 곳인지 한 문장 */}
                    <div className="bg-white rounded-2xl shadow-card border border-slate-100 p-6 md:p-10">
                        <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-brand-50 text-brand-700 border border-brand-100 mb-4">
                            <Icon name="lock" size={13} /> 익명이 보장되는 공간
                        </span>
                        <h1 className="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight leading-snug">
                            말하기 어려운 이야기를<br className="hidden md:block" /> 안전하게 꺼내는 곳
                        </h1>
                        <p className="text-sm md:text-base text-slate-600 mt-4 leading-relaxed">
                            엔코스 대나무숲은 구성원의 고충과 의견을 익명으로 전달받는 창구입니다.
                            혼자 감당하지 마시고, 편하신 방법으로 남겨주세요.
                        </p>
                        <div className="flex flex-wrap gap-2 mt-6">
                            <button onClick={() => setView('complaint')} className="bg-brand-600 text-white px-5 py-3 rounded-xl text-sm font-bold hover:bg-brand-700 shadow-brand transition-colors flex items-center gap-2">
                                <Icon name="edit-3" size={16} /> 고충 접수하기
                            </button>
                            <button onClick={() => setView('complaint-lookup')} className="bg-white border border-slate-200 text-slate-700 px-5 py-3 rounded-xl text-sm font-bold hover:border-brand-300 hover:text-brand-600 transition-colors flex items-center gap-2">
                                <Icon name="search" size={16} /> 내 접수 조회
                            </button>
                        </div>
                    </div>

                    {/* 가장 헷갈리는 지점: 두 창구의 차이 */}
                    <div>
                        <h2 className="text-lg font-bold text-slate-800 mb-1 px-1">어디에 남길까요?</h2>
                        <p className="text-sm text-slate-500 mb-4 px-1">두 창구는 보이는 범위가 다릅니다.</p>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {channels.map(ch => {
                                const brand = ch.tone === 'brand';
                                return (
                                    <div key={ch.id} className={`bg-white rounded-2xl border p-5 md:p-6 flex flex-col ${brand ? 'border-brand-200' : 'border-slate-200'}`}>
                                        <div className="flex items-center gap-2.5 mb-3">
                                            <span className={`w-9 h-9 rounded-lg flex items-center justify-center ${brand ? 'bg-brand-50 text-brand-600 border border-brand-100' : 'bg-slate-100 text-slate-600'}`}>
                                                <Icon name={ch.icon} size={18} />
                                            </span>
                                            <div>
                                                <p className="font-bold text-slate-900">{ch.label}</p>
                                                <p className={`text-xs font-bold ${brand ? 'text-brand-600' : 'text-slate-500'}`}>{ch.tagline}</p>
                                            </div>
                                        </div>
                                        <p className="text-sm text-slate-600 leading-relaxed">{ch.desc}</p>
                                        <ul className="mt-4 space-y-1.5 flex-1">
                                            {ch.points.map(pt => (
                                                <li key={pt} className="flex items-start gap-2 text-xs text-slate-600">
                                                    <span className="mt-1.5 w-1 h-1 rounded-full bg-slate-400 flex-shrink-0"></span>{pt}
                                                </li>
                                            ))}
                                        </ul>
                                        <button onClick={() => setView(ch.id)} className={`mt-5 w-full py-2.5 rounded-lg text-sm font-bold transition-colors ${brand ? 'bg-brand-600 text-white hover:bg-brand-700' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                                            {ch.cta}
                                        </button>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* 접수 후 무슨 일이 일어나는지 */}
                    <div className="bg-white rounded-2xl shadow-card border border-slate-100 p-6 md:p-8">
                        <h2 className="text-lg font-bold text-slate-800">고충 접수는 이렇게 진행됩니다</h2>
                        <p className="text-sm text-slate-500 mt-1 mb-6">접수하고 끝이 아니라, 진행 상황을 직접 확인하실 수 있습니다.</p>
                        <ol className="space-y-4 lg:space-y-0 lg:grid lg:grid-cols-4 lg:gap-6">
                            {steps.map(st => (
                                <li key={st.n} className="flex gap-3.5 lg:flex-col lg:gap-2.5">
                                    <span className="flex-shrink-0 w-7 h-7 rounded-full bg-brand-600 text-white text-xs font-bold flex items-center justify-center">{st.n}</span>
                                    <div className="pt-0.5">
                                        <p className="font-bold text-slate-800 text-sm">{st.title}</p>
                                        <p className="text-sm text-slate-600 mt-1 leading-relaxed">{st.desc}</p>
                                    </div>
                                </li>
                            ))}
                        </ol>
                    </div>

                    {/* 익명 보장의 근거 — 추상적인 약속 대신 구체적인 방식 */}
                    <div className="bg-white rounded-2xl shadow-card border border-slate-100 p-6 md:p-8">
                        <h2 className="text-lg font-bold text-slate-800">익명은 이렇게 지켜집니다</h2>
                        <p className="text-sm text-slate-500 mt-1 mb-6">‘믿어주세요’ 대신, 실제로 어떻게 처리되는지 알려드립니다.</p>
                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
                            {privacy.map(item => (
                                <div key={item.title} className="bg-slate-50 border border-slate-200 rounded-xl p-4">
                                    <div className="flex items-center gap-2 mb-2">
                                        <Icon name={item.icon} size={16} className="text-brand-600" />
                                        <p className="font-bold text-slate-800 text-sm">{item.title}</p>
                                    </div>
                                    <p className="text-xs text-slate-600 leading-relaxed">{item.desc}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 트러블이 생기기 쉬운 지점을 미리 알린다 */}
                    <div className="bg-white rounded-2xl border border-red-200 p-6 md:p-8">
                        <div className="flex items-center gap-2 mb-4">
                            <Icon name="alert-circle" size={18} className="text-red-600" />
                            <h2 className="text-lg font-bold text-slate-800">먼저 알아두실 점</h2>
                        </div>
                        <ul className="space-y-3 lg:space-y-0 lg:grid lg:grid-cols-2 lg:gap-x-8 lg:gap-y-3">
                            <li className="text-sm text-slate-700 leading-relaxed">
                                <span className="font-bold">접수번호와 PIN 을 잃어버리면 조회할 수 없습니다.</span> PIN 은 암호화되어 저장되므로 관리자도 알려드릴 수 없습니다. 제출 직후 화면에서 꼭 복사해두세요.
                            </li>
                            <li className="text-sm text-slate-700 leading-relaxed">
                                <span className="font-bold">본문에 적으신 내용으로 신원이 드러날 수 있습니다.</span> 시스템은 신원을 수집하지 않지만, 날짜·부서·상황을 자세히 적으시면 내용만으로 특정될 수 있습니다. 필요한 만큼만 적어주세요.
                            </li>
                            <li className="text-sm text-slate-700 leading-relaxed">
                                <span className="font-bold">게시판 글은 같은 브라우저에서만 삭제할 수 있습니다.</span> 익명 유지를 위해 작성자 정보를 저장하지 않기 때문입니다.
                            </li>
                            <li className="text-sm text-slate-700 leading-relaxed">
                                <span className="font-bold">긴급한 상황은 고충 접수를 이용해주세요.</span> 게시판은 전체에게 공개되며, 조사나 보호조치로 이어지지 않습니다.
                            </li>
                        </ul>
                    </div>

                    <div className="bg-slate-900 rounded-2xl p-6 md:p-8 text-center">
                        <p className="text-white font-bold text-lg">지금 바로 시작하실 수 있습니다</p>
                        <p className="text-slate-300 text-sm mt-2">어떤 이야기든 괜찮습니다. 익명으로 남겨주세요.</p>
                        <div className="flex flex-wrap gap-2 justify-center mt-5">
                            <button onClick={() => setView('complaint')} className="bg-brand-600 text-white px-5 py-3 rounded-xl text-sm font-bold hover:bg-brand-700 transition-colors">고충 접수하기</button>
                            <button onClick={() => setView('board')} className="bg-white/10 text-white border border-white/20 px-5 py-3 rounded-xl text-sm font-bold hover:bg-white/20 transition-colors">게시판 둘러보기</button>
                            <button onClick={() => setView('pulse-survey')} className="bg-white/10 text-white border border-white/20 px-5 py-3 rounded-xl text-sm font-bold hover:bg-white/20 transition-colors">조직 진단 참여</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ── 대나무숲 게시판 ──────────────────────────────────────────
        // 고충 접수가 '관리자에게만' 가는 1:1 창구라면, 이 게시판은 구성원 모두가 읽는
        // 공개 공간이다. 그래서 익명성 설계가 다르다.
        //
        //  - 작성자 uid 를 저장하지 않는다. 글마다 다른 nonce 와 섞은 해시(익명 태그)만 남긴다.
        //    태그가 글마다 달라지므로, 같은 사람이 쓴 다른 글끼리 묶어낼 수 없다.
        //    (전체 공통 태그를 쓰면 글 여러 개를 모아 글쓴이를 추정할 수 있다)
        //  - 소속 부서를 받지 않는다. 인원이 적은 팀에서는 부서만으로 사람이 특정된다.
        //  - 대신 공개 공간인 만큼 신고와 관리자 조치 수단을 둔다.
        const BOARD_CATEGORIES = [
            { value: 'free',       label: '자유' },
            { value: 'suggestion', label: '제안' },
            { value: 'praise',     label: '칭찬' },
            { value: 'question',   label: '질문' }
        ];
        const BOARD_SALT = 'bambooforest-board-v1';
        const BOARD_BLIND_THRESHOLD = 3;   // 신고 3건이면 자동 블라인드 후 관리자 검토
        const BOARD_PAGE_SIZE = 10;        // 한 번에 불러오는 글 수

        const getBoardCategory = (value) => BOARD_CATEGORIES.find(c => c.value === value) || BOARD_CATEGORIES[0];

        const makeNonce = () => {
            const bytes = new Uint8Array(16);
            window.crypto.getRandomValues(bytes);
            return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
        };

        const makeAnonTag = async (nonce, uid) => {
            if (!window.crypto?.subtle) throw new Error('보안 연결(HTTPS)에서만 게시판을 사용할 수 있습니다.');
            const data = new TextEncoder().encode(`${BOARD_SALT}:${nonce}:${uid}`);
            const buf = await window.crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
        };

        const timeAgo = (value) => {
            const ms = value?.seconds ? value.seconds * 1000 : Date.parse(value);
            if (!ms || Number.isNaN(ms)) return "-";
            const diff = Math.floor((Date.now() - ms) / 1000);
            if (diff < 60) return "방금";
            if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
            if (diff < 604800) return `${Math.floor(diff / 86400)}일 전`;
            return new Date(ms).toLocaleDateString();
        };

        const BoardView = ({ user, role }) => {
            const isAdmin = role === 'admin';
            const [posts, setPosts] = useState([]);
            const [comments, setComments] = useState([]);
            const [selectedId, setSelectedId] = useState(null);
            const [myTags, setMyTags] = useState({});      // postId -> 내 익명 태그
            const [composing, setComposing] = useState(false);
            const [draft, setDraft] = useState({ category: 'free', content: '' });
            const [sending, setSending] = useState(false);
            const [sort, setSort] = useState('new');
            const [pageSize, setPageSize] = useState(BOARD_PAGE_SIZE);
            const [reachedEnd, setReachedEnd] = useState(false);
            const [filter, setFilter] = useState('all');
            const [commentDraft, setCommentDraft] = useState("");

            const col = (name) => window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', name);
            const ref = (name, id) => window.firestore.doc(window.db, 'artifacts', APP_ID, 'public', 'data', name, id);

            // 전부 내려받으면 글이 쌓일수록 그대로 느려진다.
            // 정렬·필터·개수 제한을 모두 서버에 맡기고, '더 보기' 로 한도만 늘린다.
            useEffect(() => { setPageSize(BOARD_PAGE_SIZE); }, [sort, filter]);

            useEffect(() => {
                if (!window.db) return;
                const parts = [];
                if (filter !== 'all') parts.push(window.firestore.where("category", "==", filter));
                parts.push(window.firestore.orderBy(sort === 'like' ? "likeCount" : "createdAt", "desc"));
                parts.push(window.firestore.limit(pageSize));
                return window.firestore.onSnapshot(
                    window.firestore.query(col('board_posts'), ...parts),
                    (snap) => {
                        const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        setPosts(rows);
                        setReachedEnd(rows.length < pageSize);   // 요청한 만큼 못 채웠으면 끝
                    }
                );
            }, [sort, filter, pageSize]);

            // 댓글은 열어본 글의 것만 받는다. 목록 카드의 댓글 수는 글 문서에
            // 함께 저장해 둔 commentCount 를 쓴다(전체 댓글을 받지 않기 위해).
            useEffect(() => {
                if (!window.db || !selectedId) { setComments([]); return; }
                return window.firestore.onSnapshot(
                    window.firestore.query(col('board_comments'), window.firestore.where("postId", "==", selectedId)),
                    (snap) => setComments(snap.docs.map(d => ({ id: d.id, ...d.data() })))
                );
            }, [selectedId]);

            // 글마다 태그가 다르므로, 보이는 글들의 내 태그를 한 번에 계산해 둔다.
            useEffect(() => {
                if (!user || posts.length === 0) return;
                let alive = true;
                (async () => {
                    const next = {};
                    for (const post of posts) {
                        if (!post.nonce) continue;
                        try { next[post.id] = await makeAnonTag(post.nonce, user.uid); } catch { /* HTTPS 아님 */ }
                    }
                    if (alive) setMyTags(next);
                })();
                return () => { alive = false; };
            }, [posts, user]);

            const selected = posts.find(p => p.id === selectedId) || null;

            // 정렬·필터·개수는 서버 쿼리가 이미 처리했다.
            // 여기서는 블라인드된 글만 걷어낸다(관리자와 작성자 본인에게는 남긴다).
            const visiblePosts = useMemo(
                () => posts.filter(p => !p.hidden || isAdmin || myTags[p.id] === p.authorTag),
                [posts, isAdmin, myTags]
            );

            const submitPost = async (e) => {
                e.preventDefault();
                const content = draft.content.trim();
                if (!content || sending) return;
                setSending(true);
                try {
                    const nonce = makeNonce();
                    await window.firestore.addDoc(col('board_posts'), {
                        content,
                        category: draft.category,
                        nonce,
                        authorTag: await makeAnonTag(nonce, user.uid),
                        likedBy: [],
                        // likedBy 배열 길이로는 서버 정렬을 할 수 없어 개수를 따로 둔다.
                        likeCount: 0,
                        commentCount: 0,
                        reportedBy: [],
                        hidden: false,
                        createdAt: window.firestore.serverTimestamp()
                    });
                    setDraft({ category: 'free', content: '' });
                    setComposing(false);
                } catch (err) {
                    alert("등록 실패: " + err.message);
                } finally {
                    setSending(false);
                }
            };

            const submitComment = async (e) => {
                e.preventDefault();
                const content = commentDraft.trim();
                if (!content || !selected || sending) return;
                setSending(true);
                try {
                    await window.firestore.addDoc(col('board_comments'), {
                        postId: selected.id,
                        content,
                        // 댓글도 같은 글의 nonce 를 쓰므로, 같은 글 안에서만 동일인이 식별된다.
                        authorTag: await makeAnonTag(selected.nonce, user.uid),
                        createdAt: window.firestore.serverTimestamp()
                    });
                    await window.firestore.updateDoc(ref('board_posts', selected.id), {
                        commentCount: (selected.commentCount || 0) + 1
                    });
                    setCommentDraft("");
                } catch (err) {
                    alert("등록 실패: " + err.message);
                } finally {
                    setSending(false);
                }
            };

            const toggleLike = async (post) => {
                const tag = myTags[post.id];
                if (!tag) return;
                const likedBy = post.likedBy || [];
                const next = likedBy.includes(tag) ? likedBy.filter(t => t !== tag) : [...likedBy, tag];
                await window.firestore.updateDoc(ref('board_posts', post.id), {
                    likedBy: next,
                    likeCount: next.length
                });
            };

            const reportPost = async (post) => {
                const tag = myTags[post.id];
                if (!tag) return;
                const reportedBy = post.reportedBy || [];
                if (reportedBy.includes(tag)) return alert("이미 신고하신 글입니다.");
                if (!confirm("이 글을 신고하시겠습니까? 신고가 누적되면 자동으로 가려지고 관리자가 검토합니다.")) return;
                const next = [...reportedBy, tag];
                await window.firestore.updateDoc(ref('board_posts', post.id), {
                    reportedBy: next,
                    hidden: post.hidden || next.length >= BOARD_BLIND_THRESHOLD
                });
                alert("신고가 접수되었습니다.");
            };

            const removePost = async (post) => {
                if (!confirm("이 글을 삭제하시겠습니까? 삭제된 글은 복구할 수 없습니다.")) return;
                for (const c of comments) {
                    await window.firestore.deleteDoc(ref('board_comments', c.id));
                }
                await window.firestore.deleteDoc(ref('board_posts', post.id));
                setSelectedId(null);
            };

            const setHidden = async (post, hidden) => {
                await window.firestore.updateDoc(ref('board_posts', post.id), { hidden });
            };

            const removeComment = async (comment) => {
                if (!confirm("이 댓글을 삭제하시겠습니까?")) return;
                await window.firestore.deleteDoc(ref('board_comments', comment.id));
                const post = posts.find(x => x.id === comment.postId);
                if (post) {
                    await window.firestore.updateDoc(ref('board_posts', post.id), {
                        commentCount: Math.max(0, (post.commentCount || 0) - 1)
                    });
                }
            };

            // ── 글 상세 ──────────────────────────────────────────────
            if (selected) {
                const myTag = myTags[selected.id];
                const mine = myTag && myTag === selected.authorTag;
                const liked = myTag && (selected.likedBy || []).includes(myTag);
                const sorted = comments.slice().sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
                // 같은 글 안에서 등장 순서대로 익명1, 익명2… 를 붙인다.
                const order = [];
                sorted.forEach(c => { if (c.authorTag && !order.includes(c.authorTag)) order.push(c.authorTag); });
                const nameOf = (tag) => tag === selected.authorTag ? '작성자' : `익명${order.indexOf(tag) + 1}`;

                // 목록에서 가려도 상세로 들어오면 그대로 읽히면 안 된다.
                // (글을 열어둔 채로 블라인드된 경우도 여기서 막힌다)
                if (selected.hidden && !isAdmin && !mine) {
                    return (
                        <div className="max-w-6xl mx-auto animate-fade-in my-4 md:my-8 space-y-4">
                            <button onClick={() => setSelectedId(null)} className="text-sm text-slate-500 hover:text-brand-600 font-bold">← 목록으로</button>
                            <div className="bg-white rounded-2xl shadow-card border border-slate-100 p-10 text-center">
                                <div className="w-12 h-12 bg-red-50 border border-red-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                    <Icon name="eye-off" size={22} className="text-red-600" />
                                </div>
                                <p className="font-bold text-slate-800">가려진 글입니다</p>
                                <p className="text-sm text-slate-500 mt-1.5">신고가 누적되어 관리자 검토 중입니다.</p>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="max-w-6xl mx-auto animate-fade-in my-4 md:my-8 space-y-4">
                        <button onClick={() => setSelectedId(null)} className="text-sm text-slate-500 hover:text-brand-600 font-bold">← 목록으로</button>

                        {/* 넓은 화면에서는 본문과 댓글을 나란히 놓아 스크롤을 줄인다. */}
                        <div className="grid grid-cols-1 xl:grid-cols-5 gap-4 items-start">
                        <div className="xl:col-span-3 bg-white rounded-2xl shadow-card border border-slate-100 p-5 md:p-7">
                            {selected.hidden && (
                                <div className="mb-4 bg-red-50 border border-red-100 rounded-xl px-4 py-3 text-sm text-red-700 font-bold">
                                    신고 누적으로 가려진 글입니다. {isAdmin ? "관리자에게만 보입니다." : ""}
                                </div>
                            )}
                            <div className="flex items-center gap-2 mb-3 flex-wrap">
                                <span className="px-2.5 py-1 rounded-full text-xs font-bold bg-brand-50 text-brand-700 border border-brand-100">{getBoardCategory(selected.category).label}</span>
                                <span className="text-xs text-slate-400">{timeAgo(selected.createdAt)}</span>
                                {mine && <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600">내 글</span>}
                            </div>
                            <p className="text-[15px] text-slate-800 whitespace-pre-wrap break-words leading-relaxed">{selected.content}</p>

                            <div className="flex items-center gap-2 mt-5 pt-4 border-t border-slate-100 flex-wrap">
                                <button onClick={() => toggleLike(selected)} className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-bold border transition-colors ${liked ? 'bg-brand-600 text-white border-brand-600' : 'bg-white text-slate-600 border-slate-200 hover:border-brand-300 hover:text-brand-600'}`}>
                                    <Icon name="heart" size={15} /> 공감 {(selected.likedBy || []).length}
                                </button>
                                <span className="flex items-center gap-1.5 px-3 py-2 text-sm font-bold text-slate-500">
                                    <Icon name="message-circle" size={15} /> 댓글 {sorted.length}
                                </span>
                                <div className="flex-1"></div>
                                {!mine && (
                                    <button onClick={() => reportPost(selected)} className="text-xs font-bold text-slate-400 hover:text-red-600 px-2 py-2">신고</button>
                                )}
                                {(mine || isAdmin) && (
                                    <button onClick={() => removePost(selected)} className="text-xs font-bold text-red-700 border border-red-200 px-3 py-2 rounded-lg hover:bg-red-600 hover:text-white hover:border-red-600 transition-colors">삭제</button>
                                )}
                                {isAdmin && (
                                    <button onClick={() => setHidden(selected, !selected.hidden)} className="text-xs font-bold text-slate-600 border border-slate-200 px-3 py-2 rounded-lg hover:bg-slate-100">
                                        {selected.hidden ? "숨김 해제" : "숨기기"}
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="xl:col-span-2 bg-white rounded-2xl shadow-card border border-slate-100 p-5 md:p-7">
                            <h3 className="font-bold text-slate-800 mb-4">댓글 {sorted.length}</h3>
                            <div className="space-y-3 mb-4">
                                {sorted.length === 0 && <p className="text-sm text-slate-500">첫 댓글을 남겨보세요.</p>}
                                {sorted.map(c => {
                                    const isMine = myTag && c.authorTag === myTag;
                                    return (
                                        <div key={c.id} className="border border-slate-100 bg-slate-50 rounded-xl px-4 py-3">
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className={`text-xs font-bold ${c.authorTag === selected.authorTag ? 'text-brand-700' : 'text-slate-600'}`}>{nameOf(c.authorTag)}</span>
                                                <span className="text-[11px] text-slate-400">{timeAgo(c.createdAt)}</span>
                                                <div className="flex-1"></div>
                                                {(isMine || isAdmin) && (
                                                    <button onClick={() => removeComment(c)} className="text-[11px] font-bold text-slate-400 hover:text-red-600">삭제</button>
                                                )}
                                            </div>
                                            <p className="text-sm text-slate-700 whitespace-pre-wrap break-words leading-relaxed">{c.content}</p>
                                        </div>
                                    );
                                })}
                            </div>
                            <form onSubmit={submitComment} className="flex gap-2">
                                <input value={commentDraft} onChange={e => setCommentDraft(e.target.value)} placeholder="익명으로 댓글 남기기…" className="flex-1 border border-slate-200 rounded-lg px-3 py-2.5 text-sm bg-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200" />
                                <button type="submit" disabled={!commentDraft.trim() || sending} className="bg-brand-600 text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-brand-700 disabled:opacity-40 transition-colors">등록</button>
                            </form>
                        </div>
                        </div>
                    </div>
                );
            }

            // ── 목록 ─────────────────────────────────────────────────
            return (
                <div className="max-w-6xl mx-auto animate-fade-in my-4 md:my-8 space-y-4">
                    <div className="bg-white rounded-2xl shadow-card border border-slate-100 p-5 md:p-7">
                        <div className="flex items-start justify-between gap-3 flex-wrap">
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold text-slate-800">대나무숲 게시판</h1>
                                <p className="text-sm text-slate-500 mt-1.5 leading-relaxed">
                                    누구나 익명으로 쓰고 함께 읽는 공간입니다. 작성자 정보는 저장하지 않으며, 글마다 다른 익명 표식이 부여됩니다.
                                </p>
                            </div>
                            {!composing && (
                                <button onClick={() => setComposing(true)} className="bg-brand-600 text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-brand-700 shadow-brand transition-colors flex items-center gap-1.5 whitespace-nowrap">
                                    <Icon name="pencil" size={15} /> 글쓰기
                                </button>
                            )}
                        </div>

                        {composing && (
                            <form onSubmit={submitPost} className="mt-5 border-t border-slate-100 pt-5">
                                <div className="flex gap-2 mb-3 flex-wrap">
                                    {BOARD_CATEGORIES.map(c => (
                                        <button key={c.value} type="button" onClick={() => setDraft({ ...draft, category: c.value })} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${draft.category === c.value ? 'bg-brand-600 text-white border-brand-600' : 'bg-white text-slate-600 border-slate-200 hover:border-brand-300'}`}>{c.label}</button>
                                    ))}
                                </div>
                                <textarea value={draft.content} onChange={e => setDraft({ ...draft, content: e.target.value })} rows="5" placeholder="하고 싶은 이야기를 자유롭게 남겨주세요. 특정 개인을 알아볼 수 있는 내용은 피해주세요." className="w-full px-4 py-3 border border-slate-200 rounded-xl bg-white text-sm resize-none focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200" autoFocus />
                                <div className="flex items-center gap-2 mt-3">
                                    <p className="text-xs text-slate-400 flex-1">등록 후에는 이 브라우저에서만 삭제할 수 있습니다.</p>
                                    <button type="button" onClick={() => { setComposing(false); setDraft({ category: 'free', content: '' }); }} className="px-4 py-2.5 rounded-lg text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">취소</button>
                                    <button type="submit" disabled={!draft.content.trim() || sending} className="bg-brand-600 text-white px-5 py-2.5 rounded-lg text-sm font-bold hover:bg-brand-700 disabled:opacity-40 transition-colors">{sending ? "등록 중" : "등록"}</button>
                                </div>
                            </form>
                        )}
                    </div>

                    <div className="flex items-center gap-2 flex-wrap">
                        <button onClick={() => setFilter('all')} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${filter === 'all' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200 hover:border-brand-300'}`}>전체</button>
                        {BOARD_CATEGORIES.map(c => (
                            <button key={c.value} onClick={() => setFilter(c.value)} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${filter === c.value ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200 hover:border-brand-300'}`}>{c.label}</button>
                        ))}
                        <div className="flex-1"></div>
                        <select value={sort} onChange={e => setSort(e.target.value)} className="text-xs font-bold border border-slate-200 rounded-lg px-2 py-1.5 bg-white text-slate-600">
                            <option value="new">최신순</option>
                            <option value="like">공감순</option>
                        </select>
                    </div>

                    <div className="space-y-3">
                        {visiblePosts.length === 0 && (
                            <div className="bg-white rounded-2xl border border-slate-100 p-10 text-center">
                                <div className="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                    <Icon name="message-square" size={22} className="text-slate-400" />
                                </div>
                                <p className="text-slate-500 font-medium">아직 올라온 글이 없습니다.</p>
                                <p className="text-xs text-slate-400 mt-1">첫 이야기를 남겨보세요.</p>
                            </div>
                        )}
                        {/* 카드 한 장이 1000px 넘게 늘어나면 빈 공간만 커진다. 넓은 화면에서는 2열로. */}
                        <div className="grid grid-cols-1 xl:grid-cols-2 gap-3">
                        {visiblePosts.map(post => {
                            const myTag = myTags[post.id];
                            const mine = myTag && myTag === post.authorTag;
                            const liked = myTag && (post.likedBy || []).includes(myTag);
                            return (
                                <button key={post.id} onClick={() => setSelectedId(post.id)} className="w-full text-left bg-white rounded-2xl border border-slate-100 shadow-sm p-5 hover:border-brand-300 transition-colors block">
                                    <div className="flex items-center gap-2 mb-2 flex-wrap">
                                        <span className="px-2.5 py-1 rounded-full text-xs font-bold bg-brand-50 text-brand-700 border border-brand-100">{getBoardCategory(post.category).label}</span>
                                        <span className="text-xs text-slate-400">{timeAgo(post.createdAt)}</span>
                                        {mine && <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600">내 글</span>}
                                        {post.hidden && <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-red-600 text-white">블라인드</span>}
                                    </div>
                                    <p className="text-sm text-slate-700 leading-relaxed line-clamp-3 whitespace-pre-wrap break-words">{post.content}</p>
                                    <div className="flex items-center gap-4 mt-3 text-xs font-bold text-slate-400">
                                        <span className={`flex items-center gap-1 ${liked ? 'text-brand-600' : ''}`}><Icon name="heart" size={13} /> {(post.likedBy || []).length}</span>
                                        <span className="flex items-center gap-1"><Icon name="message-circle" size={13} /> {post.commentCount || 0}</span>
                                    </div>
                                </button>
                            );
                        })}

                        </div>

                        {!reachedEnd && (
                            <button
                                onClick={() => setPageSize(n => n + BOARD_PAGE_SIZE)}
                                className="w-full py-3 rounded-xl border border-slate-200 bg-white text-sm font-bold text-slate-600 hover:border-brand-300 hover:text-brand-600 transition-colors"
                            >
                                더 보기
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const DashboardView = ({ globalMetrics, chartData, teamStats, currentPeriod, user }) => {
            const KPICard = ({ metric }) => {
                if(!metric) return null;
                const valStr = String(metric.value);
                const diffStr = String(metric.diff);
                const isPositive = parseFloat(diffStr) >= 0;
                return (
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                        <div className="flex justify-between items-start mb-4"><div className={`p-3 rounded-xl ${metric.color}`}><Icon name={metric.icon} size={24} /></div><span className={`flex items-center text-xs font-bold px-2 py-1 rounded-full ${isPositive ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`}>{isPositive ? '▲' : '▼'} {Math.abs(parseFloat(diffStr) || 0)}{metric.unit || ''}</span></div>
                        <h3 className="text-slate-500 text-sm font-medium mb-1">{metric.label}</h3>
                        <p className="text-2xl font-bold text-slate-800">{valStr}</p>
                        <p className="text-xs text-slate-400 mt-2">vs 전월</p>
                    </div>
                );
            };
            const TrendChart = ({ data }) => {
                if (!data || data.length === 0) {
                    return (<div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 h-full flex flex-col justify-center items-center text-center"><div className="bg-slate-100 p-3 rounded-full mb-3"><Icon name="bar-chart-2" size={24} className="text-slate-400" /></div><p className="text-slate-500 font-medium">데이터가 없습니다</p><p className="text-xs text-slate-400 mt-1">설정 메뉴에서 데이터를 입력하거나<br/>자동 산출 기능을 사용해보세요.</p></div>);
                }
                const maxVal = Math.max(...data.map(d => Number(d.value)), 100);
                const points = data.map((d, i) => { const x = (i / (data.length - 1)) * 280 + 10; const y = 100 - (Number(d.value) / maxVal) * 80 - 10; return `${x},${y}`; }).join(" ");
                return (<div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 h-full"><h3 className="font-bold text-slate-800 mb-6 flex items-center gap-2"><Icon name="activity" size={20} className="text-brand-500" /> 몰입도(eNPS) 추이</h3><div className="relative h-40 w-full mt-4"><svg viewBox="0 0 300 100" className="w-full h-full overflow-visible"><polyline points={points} fill="none" stroke="#d92b2b" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="chart-path"/><div className="flex justify-between text-xs text-slate-400 mt-2">{data.map((d, i) => <span key={i}>{d.label}</span>)}</div></svg></div></div>);
            };
            const VoEWidget = () => {
                const allKeywords = teamStats.reduce((acc, team) => { if (team.keywords && Array.isArray(team.keywords)) team.keywords.forEach(k => { acc[k] = (acc[k] || 0) + 1; }); return acc; }, {});
                const keywords = Object.entries(allKeywords).map(([text, count]) => ({ text, count })).sort((a,b) => b.count - a.count);
                return (<div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 h-full"><h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Icon name="message-circle" size={20} className="text-brand-500" /> 구성원의 목소리 (VoE)</h3><div className="flex flex-wrap gap-2 content-start h-40 overflow-y-auto">{keywords.length === 0 ? <p className="text-sm text-slate-400 w-full text-center mt-10">등록된 키워드가 없습니다.</p> : keywords.map((k, i) => <span key={i} className="px-3 py-1.5 rounded-full text-sm font-medium border border-slate-200 bg-slate-50 text-slate-600">{k.text} <span className="text-xs opacity-50 ml-1">{k.count}</span></span>)}</div></div>);
            };
            const ScorePill = ({ value }) => {
                const score = Number(value);
                const tone = score <= 2.5 ? 'bg-red-50 text-red-700 border-red-100' : score <= 3.4 ? 'bg-amber-50 text-amber-700 border-amber-100' : 'bg-green-50 text-green-700 border-green-100';
                return <span className={`px-2 py-1 rounded text-xs font-bold border ${Number.isFinite(score) ? tone : 'bg-slate-50 text-slate-400 border-slate-100'}`}>{Number.isFinite(score) ? score.toFixed(1) : '-'}</span>;
            };

            return (
                <div className="space-y-6 fade-in">
                    <div className="bg-brand-50 border border-brand-100 p-3 rounded-lg text-sm text-brand-800 flex items-center gap-2 mb-4"><Icon name="calendar" size={16} /> 현재 조회 중인 데이터: <span className="font-bold">{currentPeriod}</span></div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">{/* 아이콘 타일은 네 장 모두 같은 브랜드 톤으로 통일하고, 좋고 나쁨은 오른쪽 증감 배지로만 나타낸다. */}<KPICard metric={{...globalMetrics.enps, icon: "users", color: "text-brand-600 bg-brand-50"}} /><KPICard metric={{...globalMetrics.safety, icon: "shield-check", color: "text-brand-600 bg-brand-50"}} /><KPICard metric={{...globalMetrics.burnout, icon: "flame", color: "text-brand-600 bg-brand-50", unit: "%"}} /><KPICard metric={{...globalMetrics.growth, icon: "trending-up", color: "text-brand-600 bg-brand-50", unit: "%"}} /></div>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6"><div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-100 p-6"><h3 className="font-bold text-slate-800 mb-6 flex items-center gap-2"><Icon name="bar-chart-2" size={20} className="text-slate-400" /> 팀별 조직진단 히트맵 ({currentPeriod})</h3><div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="bg-slate-50"><tr><th className="p-3">팀명</th><th className="p-3">상태</th><th className="p-3">핵심 위험요인</th><th className="p-3 text-center">업무</th><th className="p-3 text-center">안전감</th><th className="p-3 text-center">성장</th><th className="p-3 text-center">몰입</th></tr></thead><tbody>{teamStats.map(t => (<tr key={t.id} className="border-b"><td className="p-3 font-medium">{t.name}</td><td className="p-3"><span className={`w-2 h-2 rounded-full inline-block mr-2 ${t.status === '심각' ? 'bg-red-600' : t.status === '위험' ? 'bg-amber-500' : 'bg-green-500'}`}></span>{t.status}</td><td className="p-3 text-slate-500">{(t.diagnosisDrivers || []).length > 0 ? t.diagnosisDrivers.join(', ') : '특이 리스크 없음'}</td><td className="p-3 text-center"><ScorePill value={t.diagnosisScores?.workload} /></td><td className="p-3 text-center"><ScorePill value={t.diagnosisScores?.safety} /></td><td className="p-3 text-center"><ScorePill value={t.diagnosisScores?.growth} /></td><td className="p-3 text-center"><ScorePill value={t.diagnosisScores?.engagement} /></td></tr>))}</tbody></table></div></div><div className="lg:col-span-1 h-full"><ActionBoardWidget user={user} /></div></div>
                    <div className="h-64"><TrendChart data={chartData.trend} /></div>
                </div>
            );
        };

        const ReportView = ({ globalMetrics, teamStats }) => {
            const handlePrint = () => window.print();
            const riskyTeams = teamStats.filter(t => t.status === '위험' || t.status === '심각');
            return (
                <div className="max-w-4xl mx-auto bg-white shadow-lg p-10 min-h-screen fade-in print:shadow-none print:p-0">
                    <div className="flex justify-between items-center mb-10 no-print">
                        <h2 className="text-lg font-bold text-slate-500">보고서 미리보기</h2>
                        <button onClick={handlePrint} className="bg-brand-600 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-brand-700 shadow-brand transition-colors">
                            <Icon name="printer" size={16} /> PDF 저장 / 인쇄
                        </button>
                    </div>
                    <div className="border-b-2 border-slate-800 pb-4 mb-8">
                        <div><h1 className="text-3xl font-bold text-slate-900">월간 조직 건강도 보고서 (Monthly HR Health)</h1><p className="text-slate-500 mt-2">{new Date().toLocaleDateString()}</p></div>
                    </div>
                    <div className="grid grid-cols-4 gap-4 bg-slate-50 p-6 rounded-xl border border-slate-200 mb-8">
                        <div className="text-center border-r"><div className="text-xs text-slate-500">eNPS</div><div className="text-2xl font-bold text-brand-600">{globalMetrics.enps?.value}</div></div>
                        <div className="text-center border-r"><div className="text-xs text-slate-500">안전감</div><div className="text-2xl font-bold text-green-600">{globalMetrics.safety?.value}</div></div>
                        <div className="text-center border-r"><div className="text-xs text-slate-500">번아웃</div><div className="text-2xl font-bold text-red-600">{globalMetrics.burnout?.value}</div></div>
                        <div className="text-center"><div className="text-xs text-slate-500">성장</div><div className="text-2xl font-bold text-brand-600">{globalMetrics.growth?.value}</div></div>
                    </div>
                    <div className="space-y-6">
                        <h3 className="text-xl font-bold border-l-4 border-red-500 pl-3">리스크 진단 (Risk Assessment)</h3>
                        <table className="w-full text-sm text-left border-collapse border border-slate-300">
                            <thead className="bg-slate-100"><tr><th className="border p-2">부서명</th><th className="border p-2">상태</th><th className="border p-2">이슈</th></tr></thead>
                            <tbody>
                                {riskyTeams.length > 0 ? riskyTeams.map(t => (
                                    <tr key={t.id}><td className="border p-2 font-bold">{t.name}</td><td className="border p-2 text-red-600">{t.status}</td><td className="border p-2">{(t.diagnosisDrivers || []).length > 0 ? t.diagnosisDrivers.join(', ') : (t.workload === '과부하' ? '업무 과다' : '관계 갈등')}</td></tr>
                                )) : <tr><td colSpan="3" className="border p-4 text-center">리스크 없음</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // --- REAL AI Plan Generation Modal with Mock Fallback ---
        const SolutionGeneratorModal = ({ solution, onClose, aiConfig }) => {
            const [step, setStep] = useState('initializing'); 
            const [aiPlan, setAiPlan] = useState(null);
            const [errorMessage, setErrorMessage] = useState("");
            const [usedModel, setUsedModel] = useState("");
            const [isMock, setIsMock] = useState(false);
            
            // Mock Data Generator
            const generateMockPlan = (cat) => {
                const plans = {
                    'Resource': {
                        steps: [
                            {title: "직무 분석 및 병목 확인 (1주차)", desc: "팀원 개별 인터뷰를 통해 비효율 업무 식별 및 R&R 재조정"},
                            {title: "단기 리소스 재배치 (2주차)", desc: "유관 부서 협조 요청 또는 프리랜서 활용 예산 확보"},
                            {title: "채용 프로세스 가동 (3~6주차)", desc: "직무 기술서(JD) 업데이트 및 채용 공고 게시"}
                        ]
                    },
                    'Culture': {
                        steps: [
                            {title: "심리적 안전감 진단 (1주차)", desc: "익명 심층 인터뷰를 통해 갈등의 근본 원인 파악"},
                            {title: "관계 해소 워크숍 (2주차)", desc: "외부 퍼실리테이터 초빙, '솔직한 대화' 세션 운영"},
                            {title: "그라운드 룰 재정립 (3주차)", desc: "팀 내 소통 방식 및 피드백 규칙 합의"}
                        ]
                    },
                    'Growth': {
                        steps: [
                            {title: "개인별 커리어 골 설정 (1주차)", desc: "구성원별 성장 욕구 파악 및 IDP(개인개발계획) 수립"},
                            {title: "사내 멘토링 매칭 (2주차)", desc: "시니어 리더와 주니어 간의 1:1 매칭 지원"},
                            {title: "월간 성장 리뷰 (지속)", desc: "매월 마지막 주 금요일, 성과가 아닌 '성장' 중심의 리뷰 진행"}
                        ]
                    }
                };
                return plans[cat] || plans['Growth'];
            };

            useEffect(() => {
                const runProcess = async () => {
                    try {
                        setStep('initializing');
                        const apiKey = String(aiConfig?.apiKey || '').trim();
                        const savedModel = String(aiConfig?.selectedModel || '').trim();
                        const apiVersion = "v1beta";
                        const fallbackModels = [savedModel, "gemini-1.5-flash", "gemini-1.5-pro"].filter(Boolean);
                        const modelsToTry = [...new Set(fallbackModels)];

                        if (!apiKey) {
                            throw new Error("API key not configured");
                        }

                        const prompt = `
                            You are a top-tier HR consultant.
                            The team has a specific issue:
                            - Category: ${solution.category}
                            - Issue Title: ${solution.title}
                            - Description: ${solution.desc}
                            
                            Please provide a very concrete, actionable 3-step solution plan.
                            Return ONLY a valid JSON object:
                            {
                              "steps": [
                                {"title": "Step 1 Title", "desc": "Desc"},
                                {"title": "Step 2 Title", "desc": "Desc"},
                                {"title": "Step 3 Title", "desc": "Desc"}
                              ]
                            }
                            Respond in Korean.
                        `;

                        for (const targetModel of modelsToTry) {
                            try {
                                const genUrl = `https://generativelanguage.googleapis.com/${apiVersion}/models/${targetModel}:generateContent?key=${apiKey}`;
                                const response = await fetch(genUrl, {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                                });
                                const data = await response.json();
                                if (data.error) throw new Error(data.error.message);
                                if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                                    const rawText = data.candidates[0].content.parts[0].text;
                                    const jsonText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                                    const parsedPlan = JSON.parse(jsonText);
                                    setAiPlan(parsedPlan);
                                    setUsedModel(targetModel);
                                    setIsMock(false);
                                    setStep('content');
                                    return;
                                }
                                throw new Error("No output");
                            } catch (e) {
                                console.warn(`Model failed: ${targetModel}`, e);
                            }
                        }

                        await new Promise(r => setTimeout(r, 1000));
                        setAiPlan(generateMockPlan(solution.category));
                        setUsedModel("Simulation Mode (Model Fallback)");
                        setIsMock(true);
                        setStep('content');

                    } catch (e) {
                        console.error("Fatal Error:", e);
                        setAiPlan(generateMockPlan(solution.category));
                        setUsedModel("Simulation Mode (API Key Missing/Error)");
                        setIsMock(true);
                        setStep('content');
                    }
                };

                runProcess();
            }, [solution, aiConfig]);

            const savePlan = async () => {
                if(!aiPlan) return;
                try {
                    for (const step of aiPlan.steps) {
                        await window.firestore.addDoc(window.firestore.collection(window.db, 'artifacts', APP_ID, 'public', 'data', 'action_items'), { 
                            text: `[AI 제안] ${step.title}: ${step.desc}`, 
                            completed: false, 
                            createdAt: window.firestore.serverTimestamp(),
                            createdBy: isMock ? 'AI_SIMULATOR' : 'AI_AGENT'
                        });
                    }
                    alert("AI가 제안한 실행 계획이 실행 과제 목록에 추가되었습니다.");
                    onClose();
                } catch(e) {
                    console.error("Save error", e);
                    alert("저장 실패");
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[100] p-4 fade-in backdrop-blur-sm">
                    <div className="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 border border-slate-200 relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icon name="x" size={20}/></button>
                        
                        <div className="mb-6 flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-brand-500 to-brand-600 rounded-lg flex items-center justify-center text-white">
                                <Icon name="sparkles" size={20} />
                            </div>
                            <div>
                                <h3 className="font-bold text-lg text-slate-800">AI 맞춤형 솔루션 생성</h3>
                                <p className="text-xs text-slate-500">Google Gemini 엔진 기반</p>
                            </div>
                        </div>

                        {step === 'initializing' && (
                            <div className="py-12 text-center">
                                <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-slate-400 mx-auto mb-4"></div>
                                <p className="text-slate-600 font-medium">최적의 AI 모델 탐색 중...</p>
                            </div>
                        )}

                        {step === 'loading' && (
                            <div className="py-12 text-center">
                                <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-brand-600 mx-auto mb-4"></div>
                                <p className="text-slate-600 font-medium animate-pulse">조직 데이터를 분석하여 최적의 실행 계획을 생성 중입니다...</p>
                            </div>
                        )}

                        {step === 'content' && aiPlan && (
                            <div className="animate-fade-in">
                                <div className="mb-4">
                                    <h4 className="text-sm font-bold text-slate-700 mb-1">제안 배경</h4>
                                    <p className="text-sm text-slate-600 bg-slate-50 p-3 rounded">{solution.desc}</p>
                                </div>
                                <h4 className="text-sm font-bold text-slate-700 mb-3">🚀 AI가 제안하는 3단계 실행 계획</h4>
                                <div className="space-y-4">
                                    {aiPlan.steps.map((s, i) => (
                                        <div key={i} className="p-3 bg-brand-50/50 rounded border border-brand-100">
                                            <h4 className="font-bold text-brand-800 text-sm">{s.title}</h4>
                                            <p className="text-xs text-slate-700 mt-1">{s.desc}</p>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-6 flex justify-end gap-2">
                                    <button onClick={onClose} className="px-4 py-2 text-slate-500 hover:bg-slate-50 rounded text-sm">닫기</button>
                                    <button onClick={savePlan} className="px-4 py-2 bg-brand-600 text-white rounded text-sm font-bold hover:bg-brand-700 shadow-md">실행 계획 저장</button>
                                </div>
                                <p className="text-[10px] text-slate-400 mt-2 text-right">
                                    {isMock && "⚠️ API 한도 초과로 시뮬레이션 모드로 전환되었습니다."} 
                                    생성 모델: {usedModel}
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const AnalysisView = ({ teamStats, globalMetrics, chartData, currentPeriod, aiConfig }) => {
            const [selectedSolution, setSelectedSolution] = useState(null);
            const toNumber = (val, fallback = 0) => {
                const parsed = parseFloat(String(val ?? '').replace(/[^\d.-]/g, ''));
                return Number.isFinite(parsed) ? parsed : fallback;
            };

            const burnoutScore = toNumber(globalMetrics?.burnout?.value, 0);
            const safetyScore = toNumber(globalMetrics?.safety?.value, 0);
            const enpsScore = toNumber(globalMetrics?.enps?.value, 0);

            const trendData = Array.isArray(chartData?.trend) ? chartData.trend : [];
            const trendDelta = trendData.length >= 2
                ? toNumber(trendData[trendData.length - 1].value, 0) - toNumber(trendData[trendData.length - 2].value, 0)
                : 0;

            const teamRiskRows = useMemo(() => {
                return (teamStats || []).map((team) => {
                    let riskScore = 0;
                    const drivers = [];
                    const scores = team.diagnosisScores || {};
                    const lowScore = (key) => Number(scores[key]) > 0 && Number(scores[key]) <= 2.5;
                    if (team.status === '심각') { riskScore += 45; drivers.push('상태 심각'); }
                    else if (team.status === '위험') { riskScore += 35; drivers.push('상태 위험'); }
                    if (team.workload === '과부하') { riskScore += 25; drivers.push('업무 과부하'); }
                    if (team.conflict === '높음') { riskScore += 20; drivers.push('관계 갈등'); }
                    if (team.leadership === '부족') { riskScore += 15; drivers.push('리더십 이슈'); }
                    if (lowScore('safety')) { riskScore += 20; drivers.push('심리적 안전감 낮음'); }
                    if (lowScore('fairness')) { riskScore += 15; drivers.push('공정성 낮음'); }
                    if (lowScore('clarity')) { riskScore += 12; drivers.push('역할명확성 낮음'); }
                    if (lowScore('growth')) { riskScore += 10; drivers.push('성장감 낮음'); }
                    if (lowScore('engagement')) { riskScore += 15; drivers.push('몰입/추천의향 낮음'); }
                    if ((team.keywords || []).length >= 5) { riskScore += 5; drivers.push('이슈 키워드 다수'); }
                    const mergedDrivers = [...new Set([...(team.diagnosisDrivers || []), ...drivers])];
                    const riskLevel = riskScore >= 70 ? 'high' : riskScore >= 35 ? 'medium' : 'low';
                    return { ...team, riskScore, riskLevel, drivers: mergedDrivers };
                }).sort((a, b) => b.riskScore - a.riskScore);
            }, [teamStats]);

            const riskyTeams = teamRiskRows.filter(t => t.riskLevel !== 'low');
            const highWorkloadTeams = teamRiskRows.filter(t => t.workload === '과부하');
            const conflictTeams = teamRiskRows.filter(t => t.conflict === '높음');
            const fairnessClarityTeams = teamRiskRows.filter(t => (t.diagnosisScores?.fairness || 5) <= 2.5 || (t.diagnosisScores?.clarity || 5) <= 2.5);

            const keywordRank = useMemo(() => {
                const counts = {};
                (teamStats || []).forEach((team) => {
                    (team.keywords || []).forEach((k) => {
                        const key = String(k || '').trim();
                        if (!key) return;
                        counts[key] = (counts[key] || 0) + 1;
                    });
                });
                return Object.entries(counts)
                    .map(([text, count]) => ({ text, count }))
                    .sort((a, b) => b.count - a.count)
                    .slice(0, 8);
            }, [teamStats]);

            const recommendations = [];
            if (riskyTeams.length > 0) {
                recommendations.push({
                    type: 'urgent',
                    category: 'Risk',
                    title: '고위험 팀 집중 케어 플랜',
                    desc: `${riskyTeams.slice(0, 3).map(t => t.name).join(', ')} 팀이 복합 리스크를 보입니다. 2주 내 팀장 면담/업무 재조정/갈등 중재를 병행하세요.`,
                    action: '집중 케어',
                    priorityScore: 95
                });
            }
            if (highWorkloadTeams.length > 0) {
                recommendations.push({
                    type: 'urgent',
                    category: 'Resource',
                    title: '업무 과부하 해소를 위한 R&R 재설계',
                    desc: `${highWorkloadTeams.slice(0, 3).map(t => t.name).join(', ')} 팀은 업무량 리스크가 큽니다. 저부가 업무 이관과 우선순위 재정렬이 필요합니다.`,
                    action: '리소스 조정',
                    priorityScore: 90
                });
            }
            if (conflictTeams.length > 0 || safetyScore < 3.2) {
                recommendations.push({
                    type: 'warning',
                    category: 'Culture',
                    title: '관계 갈등/심리적 안전감 개선 프로그램',
                    desc: `갈등 신호 팀(${conflictTeams.length}개)과 낮은 안전감(${safetyScore.toFixed(1)}점)을 고려해 팀 단위 퍼실리테이션과 1:1 코칭을 권장합니다.`,
                    action: '문화 개선',
                    priorityScore: 82
                });
            }
            if (fairnessClarityTeams.length > 0) {
                recommendations.push({
                    type: 'warning',
                    category: 'System',
                    title: '공정성·역할명확성 진단 보완',
                    desc: `${fairnessClarityTeams.slice(0, 3).map(t => t.name).join(', ')} 팀에서 공정성 또는 역할명확성 저하 신호가 있습니다. 평가 기준, 업무배분 원칙, 의사결정 권한을 문서화해 재공지하세요.`,
                    action: '제도 보완',
                    priorityScore: 78
                });
            }
            if (burnoutScore >= 70 || enpsScore < 0 || trendDelta < 0) {
                recommendations.push({
                    type: 'warning',
                    category: 'Retention',
                    title: '이탈 방지 사전 대응',
                    desc: `번아웃(${burnoutScore.toFixed(0)}%), eNPS(${enpsScore}), 추이 변화(${trendDelta >= 0 ? '+' : ''}${trendDelta})를 보면 이탈 리스크가 있습니다. 핵심 인력 케어 계획을 선제 수립하세요.`,
                    action: '이탈 예방',
                    priorityScore: 80
                });
            }
            if (keywordRank.length > 0) {
                recommendations.push({
                    type: 'good',
                    category: 'Voice',
                    title: '키워드 기반 개선 실험 운영',
                    desc: `상위 키워드(${keywordRank.slice(0, 3).map(k => k.text).join(', ')}) 중심으로 4주 단위 개선 실험을 진행하고 성과를 비교하세요.`,
                    action: '실험 설계',
                    priorityScore: 70
                });
            }
            if (recommendations.length === 0) {
                recommendations.push({
                    type: 'good',
                    category: 'Growth',
                    title: '현 상태 유지 + 성장 투자',
                    desc: '현재 위험 신호가 낮습니다. 우수 사례 문서화와 리더 코칭으로 건강한 조직 상태를 안정적으로 유지하세요.',
                    action: '성장 강화',
                    priorityScore: 60
                });
            }
            recommendations.sort((a, b) => b.priorityScore - a.priorityScore);

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 fade-in h-full overflow-y-auto">
                    <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <Icon name="microscope" className="text-brand-600"/> 조직 심층 분석 및 개선 제언
                    </h2>
                    <p className="text-sm text-slate-500 mb-6">기준 기간: <span className="font-bold text-slate-700">{currentPeriod}</span></p>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                        <div className="bg-red-50 p-4 rounded-xl border border-red-100">
                            <p className="text-xs text-red-500 font-bold">고위험 팀</p>
                            <p className="text-2xl font-black text-red-700 mt-1">{teamRiskRows.filter(t => t.riskLevel === 'high').length}개</p>
                        </div>
                        <div className="bg-amber-50 p-4 rounded-xl border border-amber-100">
                            <p className="text-xs text-amber-500 font-bold">번아웃 지수</p>
                            <p className="text-2xl font-black text-amber-700 mt-1">{burnoutScore.toFixed(0)}%</p>
                        </div>
                        {/* 경고성 지표(고위험/번아웃)만 색을 쓰고, 일반 지표는 중립색으로 둔다. */}
                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <p className="text-xs text-slate-500 font-bold">eNPS</p>
                            <p className="text-2xl font-black text-slate-800 mt-1">{enpsScore > 0 ? '+' : ''}{enpsScore}</p>
                        </div>
                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <p className="text-xs text-slate-500 font-bold">추이 변화</p>
                            <p className="text-2xl font-black text-slate-800 mt-1">{trendDelta > 0 ? '+' : ''}{trendDelta}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                            <h3 className="font-bold text-slate-800 mb-4">팀 리스크 우선순위</h3>
                            {teamRiskRows.length === 0 ? (
